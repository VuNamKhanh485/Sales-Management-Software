<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi tài khoản & Mật khẩu - Sales Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/core/apple-design.css}">
    <link rel="stylesheet" th:href="@{/css/employee/profile.css}">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <div th:replace="~{component/navbar :: global-nav('profile')}"></div>

    <!-- Toast Notifications -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <!-- Success message for password change -->
        <div class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" th:if="${passwordSuccess}">
            <div class="d-flex">
                <div class="toast-body" th:text="${passwordSuccess}"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
        <!-- Error message -->
        <div class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true" th:if="${errorMessage}">
            <div class="d-flex">
                <div class="toast-body" th:text="${errorMessage}"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center">
            
            <!-- Change Password Card -->
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 rounded-4 h-100 profile-card">
                    <div class="card-body p-4 p-md-5 d-flex flex-column">
                        <h4 class="fw-bold mb-4 text-primary">Đổi mật khẩu</h4>
                        
                        <form th:action="@{/profile/change-password}" method="post" th:object="${passwordForm}" id="passwordForm" novalidate class="flex-grow-1 d-flex flex-column">
                            
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold mb-1">Mật khẩu hiện tại</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" th:field="*{currentPassword}" id="currentPassword" required>
                                    <button class="btn btn-outline-secondary toggle-password" type="button" data-target="currentPassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
                                <div class="invalid-feedback js-pwd-error" id="currentPasswordError"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold mb-1">Mật khẩu mới</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" th:field="*{newPassword}" id="newPassword" required>
                                    <button class="btn btn-outline-secondary toggle-password" type="button" data-target="newPassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div class="form-text text-muted small mt-2 bg-light p-2 rounded">
                                    <i class="bi bi-info-circle me-1"></i> Mật khẩu phải: ít nhất 8 ký tự, có chữ hoa, chữ thường, số và ký tự đặc biệt.
                                </div>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                                <div class="invalid-feedback js-pwd-error" id="newPasswordError"></div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label text-muted small fw-bold mb-1">Xác nhận mật khẩu mới</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" th:field="*{confirmPassword}" id="confirmPassword" required>
                                    <button class="btn btn-outline-secondary toggle-password" type="button" data-target="confirmPassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                                <div class="invalid-feedback js-pwd-error" id="confirmPasswordError"></div>
                            </div>
                            
                            <div class="d-flex justify-content-end gap-2 mt-auto pt-4 border-top">
                                <a th:href="@{/profile}" class="btn btn-secondary rounded-pill px-4">Hủy</a>
                                <button type="submit" class="btn btn-success rounded-pill px-4 shadow-sm">Lưu thay đổi</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
    
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Logic -->
    <script th:src="@{/js/employee/account.js}"></script>
</body>
</html>
