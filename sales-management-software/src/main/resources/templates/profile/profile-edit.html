<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa thông tin cá nhân - Sales Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/apple-design.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <div th:replace="~{component/navbar :: global-nav('profile')}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <!-- Main Card -->
                <div class="card shadow-sm border-0 rounded-4 profile-card">
                    <div class="card-body p-4 p-md-5">
                        
                        <div class="mb-4 pb-3 border-bottom">
                            <h3 class="fw-bold mb-0 text-primary">Chỉnh sửa thông tin cá nhân</h3>
                        </div>
                        
                        <form th:action="@{/profile/update}" method="post" th:object="${profileUpdateRequest}" id="profileForm" novalidate>
                            
                            <div class="row g-4">
                                <!-- Họ và tên -->
                                <div class="col-md-12">
                                    <label class="form-label text-muted small fw-bold mb-1">Họ và tên</label>
                                    <input type="text" class="form-control" th:field="*{fullName}" id="fullName">
                                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                                    <div class="invalid-feedback js-error" id="fullNameError"></div>
                                </div>

                                <!-- Số điện thoại -->
                                <div class="col-md-4">
                                    <label class="form-label text-muted small fw-bold mb-1">Số điện thoại</label>
                                    <input type="text" class="form-control" th:field="*{phone}" id="phone">
                                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                                    <div class="invalid-feedback js-error" id="phoneError"></div>
                                </div>

                                <!-- Giới tính -->
                                <div class="col-md-4">
                                    <label class="form-label text-muted small fw-bold mb-1">Giới tính</label>
                                    <select class="form-select" th:field="*{gender}" id="gender">
                                        <option value="MALE">Nam</option>
                                        <option value="FEMALE">Nữ</option>
                                        <option value="OTHER">Khác</option>
                                    </select>
                                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                                </div>
                                
                                <!-- Ngày sinh -->
                                <div class="col-md-4">
                                    <label class="form-label text-muted small fw-bold mb-1">Ngày sinh</label>
                                    <input type="date" class="form-control" th:field="*{dob}" id="dob">
                                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('dob')}" th:errors="*{dob}"></div>
                                    <div class="invalid-feedback js-error" id="dobError"></div>
                                </div>

                                <!-- Địa chỉ -->
                                <div class="col-12">
                                    <label class="form-label text-muted small fw-bold mb-1">Địa chỉ</label>
                                    <textarea class="form-control" th:field="*{address}" id="address" rows="3"></textarea>
                                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                                    <div class="invalid-feedback js-error" id="addressError"></div>
                                </div>
                            </div>
                            
                            <hr class="my-4 border-light">
                            
                            <!-- Actions -->
                            <div class="d-flex justify-content-end gap-2" id="actionButtons">
                                <a th:href="@{/profile}" class="btn btn-secondary rounded-pill px-4">
                                    Hủy
                                </a>
                                <button type="submit" class="btn btn-success rounded-pill px-4 shadow-sm" id="btnSave">
                                    <i class="bi bi-check-lg me-1"></i> Lưu thay đổi
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Logic -->
    <script th:src="@{/js/profile.js}"></script>
</body>
</html>
