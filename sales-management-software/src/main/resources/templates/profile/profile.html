<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin cá nhân - Sales Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <div th:replace="~{component/navbar :: global-nav('profile')}"></div>

    <!-- Toast Notifications -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" th:if="${successMessage}">
            <div class="d-flex">
                <div class="toast-body" th:text="${successMessage}"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
        <div class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true" th:if="${errorMessage}">
            <div class="d-flex">
                <div class="toast-body" th:text="${errorMessage}"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <!-- Main Card -->
                <div class="card shadow-sm border-0 rounded-4 profile-card">
                    <div class="card-body p-4 p-md-5">
                        
                        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                            <h3 class="fw-bold mb-0 text-primary">Thông tin cá nhân</h3>
                            <a th:href="@{/profile/account}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                                <i class="bi bi-shield-lock me-1"></i> Đổi tài khoản & Mật khẩu
                            </a>
                        </div>
                        
                        <div class="row g-4">
                            <!-- Mã nhân viên -->
                            <div class="col-md-4">
                                <label class="form-label text-muted small fw-bold mb-1">Mã nhân viên</label>
                                <div class="form-control-plaintext fw-medium text-dark" th:text="${employee.employeeCode}"></div>
                            </div>
                            
                            <!-- Họ và tên -->
                            <div class="col-md-4">
                                <label class="form-label text-muted small fw-bold mb-1">Họ và tên</label>
                                <div class="form-control-plaintext fw-medium text-dark" th:text="${employee.fullName}"></div>
                            </div>

                            <!-- Email -->
                            <div class="col-md-4">
                                <label class="form-label text-muted small fw-bold mb-1">Email</label>
                                <div class="form-control-plaintext fw-medium text-dark" th:text="${employee.email}"></div>
                            </div>
                            
                            <div class="col-12"><hr class="my-2 border-light"></div>

                            <!-- Số điện thoại -->
                            <div class="col-md-4">
                                <label class="form-label text-muted small fw-bold mb-1">Số điện thoại</label>
                                <div class="form-control-plaintext fw-medium text-dark" th:text="${employee.phone}"></div>
                            </div>

                            <!-- Giới tính -->
                            <div class="col-md-4">
                                <label class="form-label text-muted small fw-bold mb-1">Giới tính</label>
                                <div class="form-control-plaintext fw-medium text-dark" 
                                     th:text="${employee.gender != null ? (employee.gender.name() == 'MALE' ? 'Nam' : (employee.gender.name() == 'FEMALE' ? 'Nữ' : 'Khác')) : 'Chưa cập nhật'}">
                                </div>
                            </div>

                            <!-- Ngày sinh -->
                            <div class="col-md-4">
                                <label class="form-label text-muted small fw-bold mb-1">Ngày sinh</label>
                                <div class="form-control-plaintext fw-medium text-dark" 
                                     th:text="${employee.dob != null ? #temporals.format(employee.dob, 'dd/MM/yyyy') : 'Chưa cập nhật'}">
                                </div>
                            </div>

                            <!-- Địa chỉ -->
                            <div class="col-12">
                                <label class="form-label text-muted small fw-bold mb-1">Địa chỉ</label>
                                <div class="form-control-plaintext fw-medium text-dark" th:text="${employee.address != null and !employee.address.isEmpty() ? employee.address : 'Chưa cập nhật'}"></div>
                            </div>
                            
                            <div class="col-12"><hr class="my-2 border-light"></div>

                            <!-- Ngày vào làm -->
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold mb-1">Ngày vào làm</label>
                                <div class="form-control-plaintext fw-medium text-dark" 
                                     th:text="${employee.hiredDate != null ? #temporals.format(employee.hiredDate, 'dd/MM/yyyy') : ''}">
                                </div>
                            </div>
                            
                            <!-- Trạng thái -->
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold mb-1">Trạng thái</label>
                                <div class="form-control-plaintext fw-medium text-dark" 
                                     th:text="${employee.workStatus != null ? employee.workStatus.name() : ''}">
                                </div>
                            </div>
                        </div>
                        
                        <hr class="my-4 border-light">
                        
                        <!-- Actions -->
                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/profile/edit}" class="btn btn-primary rounded-pill px-4 shadow-sm">
                                <i class="bi bi-pencil-square me-1"></i> Chỉnh sửa thông tin
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Logic -->
    <script th:src="@{/js/profile.js}"></script>
</body>
</html>
