<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <title>Danh sách Đơn vị sản phẩm</title>
</head>
<body>

<h2>Danh sách Đơn vị sản phẩm</h2>

<a th:href="@{/productunit/create}">+ Thêm đơn vị sản phẩm</a>

<br/><br/>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>#</th>
        <th>Đơn vị</th>
        <th>Giá trị quy đổi</th>
        <th>Giá</th>
        <th>Barcode</th>
        <th>SKU</th>
        <th>Đơn vị cơ bản</th>
        <th>Thao tác</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(productUnitList)}">
        <td colspan="8">Chưa có đơn vị sản phẩm nào.</td>
    </tr>
    <tr th:each="pu, stat : ${productUnitList}">
        <td th:text="${stat.index + 1}"></td>
        <td th:text="${pu.unit != null ? pu.unit.name : ''}"></td>
        <td th:text="${pu.conventionValue}"></td>
        <td th:text="${pu.price}"></td>
        <td th:text="${pu.barcodeUnit}"></td>
        <td th:text="${pu.sku}"></td>
        <td th:text="${pu.isBaseUnit}"></td>
        <td>
            <a th:href="@{/productunit/update/{id}(id=${pu.id})}">Sửa</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
