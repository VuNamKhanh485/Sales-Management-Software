<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <title>Cập nhật Đơn vị sản phẩm</title>
</head>
<body>

<h2>Cập nhật Đơn vị sản phẩm</h2>

<a th:href="@{/productunit}">← Quay lại</a>

<br/><br/>

<form th:action="@{/productunit/update/{id}(id=${productUnitResponse.id})}" method="post">

    <label>Giá trị quy đổi:</label><br/>
    <input type="number" name="conventionValue" th:value="${productUnitResponse.conventionValue}" min="1"/><br/><br/>

    <label>Giá:</label><br/>
    <input type="number" name="price" th:value="${productUnitResponse.price}" step="0.01"/><br/><br/>

    <label>Barcode:</label><br/>
    <input type="text" name="barcodeUnit" th:value="${productUnitResponse.barcodeUnit}"/><br/><br/>

    <label>SKU:</label><br/>
    <input type="text" name="sku" th:value="${productUnitResponse.sku}"/><br/><br/>

    <label>Đơn vị cơ bản:</label>
    <input type="checkbox" name="isBaseUnit" value="true" th:checked="${productUnitResponse.isBaseUnit}"/><br/><br/>

    <!-- giữ lại unitId và productId ẩn -->
    <input type="hidden" name="unitId" th:value="${productUnitResponse.unit != null ? productUnitResponse.unit.id : ''}"/>

    <button type="submit">Lưu thay đổi</button>
    <a th:href="@{/productunit}">Hủy</a>

</form>

</body>
</html>
