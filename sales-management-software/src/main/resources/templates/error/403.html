<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lỗi hệ thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5 text-center">
    <h1 class="text-danger" th:text="${errorCode != null ? errorCode : '403'}">403</h1>
    <h4 th:text="${errorMessage != null ? errorMessage : 'Bạn không có quyền truy cập chức năng này'}">Bạn không có quyền truy cập chức năng này</h4>
    <a href="/dashboard" class="btn btn-primary mt-3">Quay về trang chủ</a>
</div>

</body>
</html>
