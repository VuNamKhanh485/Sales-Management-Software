<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<aside class="sidebar" th:fragment="sidebar-component">
    <div class="logo">
        <div class="logo-text">
            <h2>Sales Admin</h2>
            <p>Management</p>
        </div>
    </div>

    <nav class="menu">
        <a href="#" class="menu-item">
            <span>Khách hàng</span>
        </a>

        <a th:href="@{/product}"
           th:class="${page == 'product' ? 'menu-item active' : 'menu-item'}">
            <span>Sản phẩm</span>
        </a>

        <a th:href="@{/inventory}"
           th:class="${page == 'inventory' ? 'menu-item active' : 'menu-item'}">
            <span>Kho hàng</span>
        </a>

        <a th:if="${session.loggedInUser != null
                   and (session.loggedInUser.roleCode == 'OWNER'
                        or session.loggedInUser.roleCode == 'BRANCH_MANAGER')}"
           th:href="@{/employee}"
           th:class="${page == 'employee' ? 'menu-item active' : 'menu-item'}">
            <span>Quản lý nhân viên</span>
        </a>

        <a th:if="${session.loggedInUser != null
                   and session.loggedInUser.roleCode == 'OWNER'}"
           th:href="@{/branch}"
           th:class="${page == 'branch' ? 'menu-item active' : 'menu-item'}">
            <span>Quản lý chi nhánh</span>
        </a>
    </nav>

    <div class="user-profile" th:if="${session.loggedInUser != null}">
        <div class="user-details">
            <h4 class="user-name"
                th:text="${session.loggedInUser.fullName}">
                Admin
            </h4>

            <span class="user-role"
                  th:text="${session.loggedInUser.roleName}">
                Quản trị viên
            </span>
        </div>

        <form th:action="@{/auth/logout}" method="get" class="logout-form">
            <button type="submit" class="logout-btn" title="Đăng xuất">
                Đăng xuất
            </button>
        </form>
    </div>
</aside>

</html>
