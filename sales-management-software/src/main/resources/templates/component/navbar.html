<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<nav class="global-nav" th:fragment="global-nav(page)">
    <a href="/dashboard" class="global-nav__brand">SMS</a>
    <ul style="display:flex; gap:0; list-style:none; margin:0; padding:0; align-items:center; flex:1;">
        <li><a th:href="@{/dashboard}" th:classappend="${page == 'dashboard' ? 'active' : ''}">Dashboard</a></li>
        <li><a th:href="@{/pos}" th:classappend="${page == 'pos' ? 'active' : ''}">Bán hàng</a></li>
        <li><a th:href="@{/customers}" th:classappend="${page == 'customer' ? 'active' : ''}">Khách hàng</a></li>
        <li><a th:href="@{/product}" th:classappend="${page == 'product' ? 'active' : ''}">Sản phẩm</a></li>
        <li><a th:href="@{/inventory}" th:classappend="${page == 'inventory' ? 'active' : ''}">Kho hàng</a></li>
        <li><a th:href="@{/imports}" th:classappend="${page == 'imports' ? 'active' : ''}">Nhập hàng</a></li>
        <li><a th:href="@{/vouchers}" th:classappend="${page == 'voucher' ? 'active' : ''}">Voucher</a></li>
        <li sec:authorize="hasAnyRole('OWNER')"><a th:href="@{/employee}" th:classappend="${page == 'employee' ? 'active' : ''}">Nhân viên</a></li>
        <li sec:authorize="hasAnyRole('OWNER', 'MANAGER')"><a th:href="@{/branch}" th:classappend="${page == 'branch' ? 'active' : ''}">Chi nhánh</a></li>
    </ul>
    <div style="display:flex; align-items:center; gap:12px; margin-left:auto;" sec:authorize="isAuthenticated()">
        <span style="font-size:12px; color:rgba(245,245,247,0.8);" th:text="${#authentication.principal.employee.fullName}">Admin</span>
        <form th:action="@{/logout}" method="post" style="margin:0;">
            <button type="submit" style="background:transparent; border:none; color:rgba(245,245,247,0.8); cursor:pointer; font-size:12px; padding:4px 8px;">
                Đăng xuất
            </button>
        </form>
    </div>
</nav>

<aside class="d-flex flex-column flex-shrink-0 p-3 bg-light border-end" style="width: 250px; min-width: 250px; min-height: 100vh;" th:fragment="sidebar-component">
    <div class="mb-4">
        <h2 class="h4 mb-0 fw-bold text-primary">Sales Admin</h2>
        <small class="text-muted">Management</small>
    </div>

    <nav class="nav nav-pills flex-column mb-auto">
        <a th:href="@{/dashboard}" th:class="${page == 'dashboard' ? 'nav-link active mb-1' : 'nav-link text-dark mb-1'}">
            <span>Dashboard</span>
        </a>
        <a th:href="@{/pos}" th:class="${page == 'pos' ? 'nav-link active mb-1' : 'nav-link text-dark mb-1'}">
            <span>Bán hàng (POS)</span>
        </a>
        <a th:href="@{/customers}" th:class="${page == 'customer' ? 'nav-link active mb-1' : 'nav-link text-dark mb-1'}">
            <span>Khách hàng</span>
        </a>
        <a th:href="@{/product}" th:class="${page == 'product' ? 'nav-link active mb-1' : 'nav-link text-dark mb-1'}">
            <span>Sản phẩm</span>
        </a>
        <a th:href="@{/inventory}" th:class="${page == 'inventory' ? 'nav-link active mb-1' : 'nav-link text-dark mb-1'}">
            <span>Kho hàng</span>
        </a>

        <a th:href="@{/imports}" th:class="${page == 'imports' ? 'nav-link active mb-1' : 'nav-link text-dark mb-1'}">
            <span>Nhập hàng</span>
        </a>

        <a sec:authorize="hasAnyRole('OWNER')" th:href="@{/employee}"
           th:class="${page == 'employee' ? 'nav-link active mb-1' : 'nav-link text-dark mb-1'}">
            <span>Quản lý nhân viên</span>
        </a>

        <a sec:authorize="hasAnyRole('OWNER', 'MANAGER')" th:href="@{/branch}"
           th:class="${page == 'branch' ? 'nav-link active mb-1' : 'nav-link text-dark mb-1'}">
            <span>Quản lý chi nhánh</span>
        </a>
    </nav>

    <hr>
    <div class="user-profile" sec:authorize="isAuthenticated()">
        <div class="mb-2">
            <div class="fw-bold text-dark" th:text="${#authentication.principal.employee.fullName}">Admin</div>
            <small class="text-muted d-block mb-2"
                   th:text="${#authentication.principal.employee.role != null ? #authentication.principal.employee.role.name : 'Quản trị viên'}">Quản trị viên</small>
        </div>
        <form th:action="@{/logout}" method="post" class="logout-form m-0">
            <button type="submit" class="btn btn-sm btn-outline-danger w-100" title="Đăng xuất">
                Đăng xuất
            </button>
        </form>
    </div>
</aside>

</html>
