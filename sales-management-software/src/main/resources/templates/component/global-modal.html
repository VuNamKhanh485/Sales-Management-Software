<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="confirm-modal">
        <!-- Modal Xác nhận chung không phụ thuộc Bootstrap -->
        <div id="confirmModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99999; justify-content: center; align-items: center; backdrop-filter: blur(4px);">
            <div style="background: var(--canvas, #ffffff); padding: 24px; border-radius: var(--r-lg, 16px); max-width: 400px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.15);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <h3 id="confirmModalTitle" style="margin: 0; font-size: 18px; font-weight: 600; color: var(--ink, #111827);">
                        Xác nhận
                    </h3>
                    <button type="button" onclick="closeGlobalConfirmModal()" style="background: transparent; border: none; font-size: 24px; line-height: 1; cursor: pointer; color: var(--ink-muted-48, #6b7280); padding: 0;">&times;</button>
                </div>
                <p id="confirmModalMessage" style="color: var(--ink-muted, #4b5563); font-size: 15px; margin-bottom: 24px; line-height: 1.5;">Bạn có chắc chắn muốn thực hiện hành động này?</p>
                <div style="display: flex; justify-content: flex-end; gap: 12px;">
                    <button type="button" class="btn-secondary btn-secondary--sm" onclick="closeGlobalConfirmModal()">Hủy</button>
                    <button type="button" id="confirmModalBtn" class="btn-danger btn-danger--sm">Đồng ý</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
