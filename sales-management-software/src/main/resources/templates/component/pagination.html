<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<body>
    <!--
      Pagination Component
      Usage:
      <div th:replace="~{component/pagination :: pagination(currentPage=${currentPage}, totalPages=${totalPages}, baseUrl='/your-url')}"></div>
      
      Note: baseUrl should not include the 'page=' parameter. For example: '/dashboard' or '/return/manage'
    -->
    <div th:fragment="pagination(currentPage, totalPages, baseUrl)" th:if="${totalPages > 1}" class="pagination-bar" style="padding: 16px 24px; border-top: 1px solid var(--hairline); display: flex; justify-content: center;">
        <nav>
            <ul class="pagination" style="display: flex; list-style: none; padding: 0; margin: 0; gap: 8px; align-items: center;">
                
                <!-- First Page -->
                <li th:if="${currentPage > 0}">
                    <a th:href="@{${baseUrl}(page=0)}" title="Trang đầu"
                       style="display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 4px; border-radius: var(--r-sm); background: transparent; color: var(--ink-muted-48); text-decoration: none; font-size: 16px; transition: all 0.2s;"
                       onmouseover="if(this.style.background === 'transparent') this.style.color = 'var(--primary)';"
                       onmouseout="if(this.style.background === 'transparent') this.style.color = 'var(--ink-muted-48)';">
                        &laquo;
                    </a>
                </li>

                <!-- Previous Page -->
                <li th:if="${currentPage > 0}">
                    <a th:href="@{${baseUrl}(page=${currentPage - 1})}" title="Trang trước"
                       style="display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 4px; border-radius: var(--r-sm); background: transparent; color: var(--ink-muted-48); text-decoration: none; font-size: 16px; transition: all 0.2s;"
                       onmouseover="if(this.style.background === 'transparent') this.style.color = 'var(--primary)';"
                       onmouseout="if(this.style.background === 'transparent') this.style.color = 'var(--ink-muted-48)';">
                        &lsaquo;
                    </a>
                </li>

                <!-- Page Numbers -->
                <th:block th:with="startPage=${T(java.lang.Math).max(0, currentPage - 2)}, endPage=${T(java.lang.Math).min(totalPages - 1, currentPage + 2)}">
                    <!-- Điều chỉnh để luôn hiển thị 5 trang nếu có thể -->
                    <th:block th:with="startPageAdjusted=${(endPage - startPage < 4) ? T(java.lang.Math).max(0, endPage - 4) : startPage}, endPageAdjusted=${(endPage - startPage < 4) ? T(java.lang.Math).min(totalPages - 1, startPageAdjusted + 4) : endPage}">
                        <li th:each="i : ${#numbers.sequence(startPageAdjusted, endPageAdjusted)}">
                            <a th:href="@{${baseUrl}(page=${i})}" th:text="${i + 1}"
                               th:style="${i == currentPage} ? 'display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 8px; background: var(--primary); color: white; text-decoration: none; font-size: 14px; font-weight: 600; box-shadow: 0 2px 4px rgba(0,102,204,0.2);' : 'display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 8px; background: transparent; color: var(--ink-muted-80); text-decoration: none; font-size: 14px; transition: all 0.2s; font-weight: 500;' "
                               onmouseover="if(this.style.background === 'transparent') this.style.background = 'rgba(0,102,204,0.08)';"
                               onmouseout="if(this.style.color === 'var(--ink-muted-80)') this.style.background = 'transparent';"></a>
                        </li>
                    </th:block>
                </th:block>

                <!-- Next Page -->
                <li th:if="${currentPage < totalPages - 1}">
                    <a th:href="@{${baseUrl}(page=${currentPage + 1})}" title="Trang sau"
                       style="display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 4px; border-radius: var(--r-sm); background: transparent; color: var(--ink-muted-48); text-decoration: none; font-size: 16px; transition: all 0.2s;"
                       onmouseover="if(this.style.background === 'transparent') this.style.color = 'var(--primary)';"
                       onmouseout="if(this.style.background === 'transparent') this.style.color = 'var(--ink-muted-48)';">
                        &rsaquo;
                    </a>
                </li>

                <!-- Last Page -->
                <li th:if="${currentPage < totalPages - 1}">
                    <a th:href="@{${baseUrl}(page=${totalPages - 1})}" title="Trang cuối"
                       style="display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 4px; border-radius: var(--r-sm); background: transparent; color: var(--ink-muted-48); text-decoration: none; font-size: 16px; transition: all 0.2s;"
                       onmouseover="if(this.style.background === 'transparent') this.style.color = 'var(--primary)';"
                       onmouseout="if(this.style.background === 'transparent') this.style.color = 'var(--ink-muted-48)';">
                        &raquo;
                    </a>
                </li>
                
            </ul>
        </nav>
    </div>
</body>
</html>
