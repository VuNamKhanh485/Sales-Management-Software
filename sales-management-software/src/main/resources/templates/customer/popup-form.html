<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 10px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .form-label { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
        .form-control { font-size: 13px; padding: 6px 10px; border-radius: 6px; }
        .btn-primary { background: #0d6efd; border: none; font-size: 13px; padding: 6px 16px; border-radius: 6px; font-weight: 500; }
        .btn-cancel { background: #f1f3f5; color: #495057; border: none; font-size: 13px; padding: 6px 16px; border-radius: 6px; font-weight: 500; }
    </style>
</head>
<body>
    <div th:if="${error}" class="alert alert-danger py-1 px-2 small mb-2" th:text="${error}"></div>
    
    <form th:action="@{/customer/popup-form}" th:object="${customerDTO}" method="POST">
        <div class="row g-2 mb-2">
            <div class="col-6">
                <label class="form-label">Họ tên <span class="text-danger">*</span></label>
                <input type="text" th:field="*{fullName}" class="form-control" required placeholder="Nguyễn Văn A">
            </div>
            <div class="col-6">
                <label class="form-label">Số điện thoại <span class="text-danger">*</span></label>
                <input type="text" th:field="*{phone}" class="form-control" required placeholder="0901234567">
            </div>
        </div>
        
        <div class="row g-2 mb-2">
            <div class="col-6">
                <label class="form-label">Giới tính</label>
                <select th:field="*{gender}" class="form-select form-select-sm" style="font-size: 13px; border-radius: 6px;">
                    <option th:each="g : ${genders}" th:value="${g.name()}" th:text="${g.name()}"></option>
                </select>
            </div>
            <div class="col-6">
                <label class="form-label">Ngày sinh</label>
                <input type="date" th:field="*{dob}" class="form-control">
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Địa chỉ</label>
            <input type="text" th:field="*{address}" class="form-control">
        </div>
        
        <div class="text-end border-top pt-2 mt-2">
            <button type="button" class="btn-cancel" onclick="window.parent.closeCustomerModal()">Hủy</button>
            <button type="submit" class="btn-primary">Lưu khách hàng</button>
        </div>
    </form>
</body>
</html>
