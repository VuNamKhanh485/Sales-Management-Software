<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${customerDTO.id == null ? 'Thêm Khách hàng — SMS' : 'Sửa Khách hàng — SMS'}"></title>
    <link rel="stylesheet" th:href="@{/css/core/apple-design.css}">
    <link rel="stylesheet" th:href="@{/css/customer/customer.css}">
</head>

<body>

    <!-- Thanh điều hướng -->
    <div th:replace="~{component/navbar :: global-nav('customer')}"></div>

    <!-- Thanh phụ -->
    <div class="sub-nav">
        <a href="/customers" class="sub-nav__back">Khách hàng</a>
        <span class="sub-nav__sep">›</span>
        <h1 class="sub-nav__title" th:text="${customerDTO.id == null ? 'Thêm mới' : 'Chỉnh sửa'}" style="margin:0;">
        </h1>
    </div>

    <main class="form-page">
        <div class="form-card">
            <div class="form-card__header">
                <h1 class="form-card__title"
                    th:text="${customerDTO.id == null ? 'Thêm Khách hàng' : 'Cập nhật Khách hàng'}"></h1>
            </div>

            <!-- Thông báo nhanh -->
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <form th:action="@{/customers/save}" th:object="${customerDTO}" method="POST">
                <input type="hidden" th:field="*{id}" />

                <div class="form-grid">

                    <div class="form-group">
                        <label class="form-label">Họ và tên <span class="required-mark">*</span></label>
                        <input type="text" class="form-input" th:field="*{fullName}" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Số điện thoại <span class="required-mark">*</span></label>
                        <input type="text" class="form-input" th:field="*{phone}" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" th:field="*{email}">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Hạng thẻ (Tự động cập nhật)</label>
                        <input type="text" class="form-input" th:value="${currentRankName}" readonly disabled>
                        <input type="hidden" th:field="*{customerRankId}">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Giới tính</label>
                        <select class="form-select" th:field="*{gender}">
                            <option th:each="g : ${genders}" th:value="${g.name()}" th:text="${g.name()}"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Ngày sinh</label>
                        <input type="date" class="form-input" th:field="*{dob}">
                    </div>

                    <div class="form-group" th:if="${customerDTO.id != null}">
                        <label class="form-label">Trạng thái</label>
                        <select class="form-select" th:field="*{status}">
                            <option value="ACTIVE">Hoạt động</option>
                            <option value="INACTIVE">Ngừng hoạt động</option>
                        </select>
                    </div>

                    <div class="form-group form-group--full">
                        <label class="form-label">Địa chỉ</label>
                        <input type="text" class="form-input" th:field="*{address}">
                    </div>

                    <div class="form-group form-group--full">
                        <label class="form-label">Ghi chú</label>
                        <textarea class="form-textarea" th:field="*{note}" rows="3"></textarea>
                    </div>

                </div>

                <div class="form-actions">
                    <a href="/customers" class="btn-cancel">Hủy</a>
                    <button type="submit" class="btn-primary">Lưu khách hàng</button>
                </div>
            </form>
        </div>
    </main>

</body>

</html>
