<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Khách Hàng</title>
</head>
<body>

<h1>THÊM KHÁCH HÀNG MỚI</h1>
<p><a th:href="@{/customers}">Quay lại danh sách</a></p>

<div th:if="${error}" style="color: red; margin-bottom: 15px;">
    <p><b>Lỗi:</b> <span th:text="${error}">Thông báo lỗi ở đây</span></p>
</div>

<form th:action="@{/customers/create}" th:object="${customerReq}" method="post">

    <table cellpadding="8" cellspacing="0">
        <tr>
            <td><label>Họ và Tên (*):</label></td>
            <td><input type="text" th:field="*{fullName}" required placeholder="Nhập họ và tên"></td>
        </tr>
        <tr>
            <td><label>Số Điện Thoại (*):</label></td>
            <td><input type="text" th:field="*{phone}" required placeholder="Nhập số điện thoại"></td>
        </tr>
        <tr>
            <td><label>Email (Không bắt buộc):</label></td>
            <td><input type="email" th:field="*{email}" placeholder="example@gmail.com (có thể bỏ trống)"></td>
        </tr>
        <tr>
            <td><label>Địa Chỉ:</label></td>
            <td><input type="text" th:field="*{address}" placeholder="Nhập địa chỉ cư trú"></td>
        </tr>
        <tr>
            <td><label>Hạng Khách Hàng ban đầu:</label></td>
            <td>
                <select th:field="*{customerRankId}">
                    <option value="">-- Mặc định (Không xét hạng) --</option>
                    <option th:each="rank : ${ranks}" th:value="${rank.id}" th:text="${rank.name}"></option>
                </select>
            </td>
        </tr>
        <tr>
            <td><label>Ghi chú:</label></td>
            <td><textarea th:field="*{note}" rows="4" cols="30" placeholder="Thông tin lưu ý thêm..."></textarea></td>
        </tr>
        <tr>
            <td></td>
            <td>
                <button type="submit" style="padding: 6px 20px; font-weight: bold;">LƯU THÔNG TIN</button>
                <button type="reset" style="padding: 6px 10px;">Xóa nhập lại</button>
            </td>
        </tr>
    </table>

</form>

</body>
</html>
