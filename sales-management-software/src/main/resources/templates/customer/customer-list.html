<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Khách Hàng</title>
</head>
<body>

<h1>DANH SÁCH KHÁCH HÀNG</h1>

<p>
    <a th:href="@{/customers/create}">Thêm Khách Hàng Mới</a> |
    <a th:href="@{/orders}">Quay lại màn hình bán hàng</a>
</p>

<div style="margin-bottom: 20px;">
    <form th:action="@{/customers}" method="get">
        <input type="text" name="keyword" th:value="${keyword}"
               placeholder="Nhập SĐT hoặc mã khách hàng..." style="width: 250px; padding: 5px;">
        <button type="submit" style="padding: 5px 15px;">Tìm kiếm</button>
        <a th:href="@{/customers}" th:if="${keyword != null}" style="margin-left: 10px; color: gray; text-decoration: none;">Xóa bộ lọc</a>
    </form>
</div>

<table border="1" cellpadding="8" cellspacing="0" width="100%">
    <thead>
    <tr style="background-color: #f2f2f2;">
        <th>Mã KH</th>
        <th>Họ và Tên</th>
        <th>Số Điện Thoại</th>
        <th>Email</th>
        <th>Địa Chỉ</th>
        <th>Hạng</th>
        <th>Điểm Tích Lũy</th>
        <th>Doanh Thu Đóng Góp</th>
        <th>Trạng Thái</th>
        <th>Hành Động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="cus : ${customers}">
        <td th:text="${cus.customerCode}"></td>
        <td th:text="${cus.fullName}"></td>
        <td th:text="${cus.phone}"></td>
        <td th:text="${cus.email ?: '---'}"></td>
        <td th:text="${cus.address ?: '---'}"></td>
        <td th:text="${cus.customerRank != null ? cus.customerRank.name : 'Chưa xếp hạng'}"></td>
        <td th:text="${cus.totalPoint - cus.usedPoint}"></td>
        <td th:text="${#numbers.formatDecimal(cus.totalRevenue, 1, 'DEFAULT', 0, 'DEFAULT')} + ' đ'"></td>
        <td>
            <span th:if="${cus.status.name() == 'ACTIVE'}" style="color: green; font-weight: bold;">Hoạt động</span>
            <span th:if="${cus.status.name() == 'INACTIVE'}" style="color: red;">Ngừng hoạt động</span>
        </td>
        <td>
            <a th:href="@{/customers/update/{id}(id=${cus.id})}">Sửa</a> |
            <a th:href="@{/customers/toggle-status/{id}(id=${cus.id})}"
               th:text="${cus.status.name() == 'ACTIVE' ? 'Khóa' : 'Mở khóa'}"
               onclick="return confirm('Bạn có chắc chắn muốn đổi trạng thái khách hàng này?')">Đổi trạng thái</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(customers)}">
        <td colspan="10" align="center">Không tìm thấy khách hàng nào khớp với từ khóa.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
