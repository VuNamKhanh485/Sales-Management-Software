<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo cáo Tổng hợp — SMS</title>
    <link rel="stylesheet" th:href="@{/css/core/apple-design.css}">
    <link rel="stylesheet" th:href="@{/css/report/report.css}">
    <link rel="stylesheet" th:href="@{/css/data-table.css}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div th:replace="~{component/navbar :: global-nav('report')}"></div>

    <div class="sub-nav">
        <h1 class="sub-nav__title">Báo cáo Tổng hợp</h1>
    </div>

    <main class="page-wrap">

        <form action="/reports/overview" method="get" class="search-bar search-bar-center mb-4">
            <select name="branchId" class="filter-select" th:if="${isOwner}">
                <option value="">Tất cả chi nhánh</option>
                <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}" th:selected="${b.id == selectedBranchId}"></option>
            </select>
            <th:block th:if="${!isOwner && isManager}">
                <input type="hidden" name="branchId" th:value="${selectedBranchId}" />
                <span class="filter-text" style="font-weight: 500; font-size: 14px; padding: 0.5rem 1rem; background-color: #f1f3f5; border-radius: 8px; border: 1px solid #e2e8f0; color: #475569;" 
                      th:each="b : ${branches}" th:if="${b.id == selectedBranchId}" th:text="${b.name}">Chi nhánh</span>
            </th:block>
            
            <input type="date" name="startDate" class="filter-date" th:value="${startDate}">
            <span class="date-separator">đến</span>
            <input type="date" name="endDate" class="filter-date" th:value="${endDate}">
            
            <button type="submit" class="btn btn-primary btn-primary--sm">Xem báo cáo</button>
        </form>

        <!-- Phần Lợi nhuận và Dòng tiền -->
        <th:block th:if="${isManager}">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; margin-top: 2rem;">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <h2 class="t-lead" style="margin: 0; font-weight: 600;">Lợi nhuận & Dòng tiền</h2>
                    <a th:href="@{/reports/cashflow(branchId=${selectedBranchId}, startDate=${startDate}, endDate=${endDate})}" class="btn btn-secondary btn-secondary--sm" style="padding: 4px 12px; font-size: 13px;">Chi tiết</a>
                </div>
                <div>
                    <select id="chartTypeSelect" class="filter-select" style="padding: 0.25rem 0.5rem; font-size: 14px;">
                        <option value="bar">Biểu đồ kết hợp (Cột & Đường)</option>
                        <option value="line">Biểu đồ Đường (Line)</option>
                        <option value="bar-only">Biểu đồ Cột (Bar)</option>
                        <option value="pie">Biểu đồ Tròn (Pie)</option>
                    </select>
                </div>
            </div>
            
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-card__label">Tổng Doanh Thu</div>
                    <div class="stat-card__value value-revenue" th:text="${#numbers.formatDecimal(profitData.totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card__label">Tổng Chi Phí</div>
                    <div class="stat-card__value value-expense" th:text="${#numbers.formatDecimal(profitData.totalExpense, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card__label">Lợi Nhuận Ròng</div>
                    <div class="stat-card__value value-profit" th:text="${#numbers.formatDecimal(profitData.netProfit, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</div>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="cashFlowChart"></canvas>
            </div>
        </th:block>

    </main>

    <script th:inline="javascript">
        /*<![CDATA[*/
        window.reportData = {
            labels: /*[[${profitData.labels}]]*/ [],
            revenue: /*[[${profitData.revenueData}]]*/ [],
            expense: /*[[${profitData.expenseData}]]*/ [],
            profit: /*[[${profitData.profitData}]]*/ [],
            totalRevenue: /*[[${profitData.totalRevenue}]]*/ 0,
            totalExpense: /*[[${profitData.totalExpense}]]*/ 0,
            totalProfit: /*[[${profitData.netProfit}]]*/ 0
        };
        /*]]>*/
    </script>

    <script th:src="@{/js/report/report-profit.js}"></script>
</body>
</html>
