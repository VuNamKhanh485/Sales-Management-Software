<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Cập nhật nhân viên' : 'Thêm nhân viên'">Thêm nhân viên</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-shell">
    <div th:replace="~{component/navbar :: sidebar-component}"></div>
    <main class="admin-main">
        <header class="admin-topbar">
            <div>
                <h1 th:text="${isEdit} ? 'Cập nhật nhân viên' : 'Thêm nhân viên'">Thêm nhân viên</h1>
            </div>
        </header>

        <section class="admin-content">
            <div class="form-panel">
                <form th:action="@{/employee/save}" th:object="${employee}" method="post">
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="form-group-row">
                        <div class="form-group">
                            <label>Mã nhân viên</label>
                            <input type="text" th:field="*{employeeCode}" class="form-control" readonly required>
                        </div>

                        <div class="form-group">
                            <label>Họ và tên</label>
                            <input type="text" th:field="*{fullName}" class="form-control" required>
                        </div>
                    </div>

                    <div class="form-group-row">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" th:field="*{email}" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label th:text="${isEdit} ? 'Mật khẩu mới (để trống nếu giữ nguyên)' : 'Mật khẩu'">Mật khẩu</label>
                            <input type="password" th:field="*{passwordHash}" class="form-control" th:required="${!isEdit}">
                        </div>
                    </div>

                    <div class="form-group-row">
                        <div class="form-group">
                            <label>Số điện thoại</label>
                            <input type="text" th:field="*{phone}" class="form-control">
                        </div>

                        <div class="form-group">
                            <label>Địa chỉ</label>
                            <input type="text" th:field="*{address}" class="form-control">
                        </div>
                    </div>

                    <div class="form-group-row">
                        <div class="form-group">
                            <label>Giới tính</label>
                            <select th:field="*{gender}" class="form-select">
                                <option value="">-- Chọn giới tính --</option>
                                <option th:each="g : ${genders}" th:value="${g}" th:text="${g}"></option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Ngày sinh</label>
                            <input type="date" th:field="*{dob}" class="form-control">
                        </div>
                    </div>

                    <div class="form-group-row">
                        <div class="form-group">
                            <label>Ngày vào làm</label>
                            <input type="date" th:field="*{hiredDate}" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label>Lương cơ bản</label>
                            <input type="number" th:field="*{baseSalary}" class="form-control" step="0.01">
                        </div>
                    </div>

                    <div class="form-group-row">
                        <div class="form-group">
                            <label>Chi nhánh</label>
                            <select name="branchId" class="form-select">
                                <option value="">-- Chưa phân chi nhánh --</option>
                                <option th:each="b : ${branches}" 
                                        th:value="${b.id}" 
                                        th:text="${b.name}"
                                        th:selected="${employee.branch != null && employee.branch.id == b.id}"></option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Vai trò</label>
                            <select name="roleCode" class="form-select" required>
                                <option value="">-- Chọn vai trò --</option>
                                <option th:each="r : ${roles}" 
                                        th:value="${r.code}" 
                                        th:text="${r.name}"
                                        th:selected="${employee.role != null && employee.role.code == r.code}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group-row">
                        <div class="form-group">
                            <label>Trạng thái làm việc</label>
                            <div class="radio-group">
                                <label class="radio-option">
                                    <input type="radio" th:field="*{workStatus}" value="ACTIVE" id="statusActive">
                                    <span>Đang làm việc</span>
                                </label>
                                <label class="radio-option">
                                    <input type="radio" th:field="*{workStatus}" value="INACTIVE" id="statusInactive">
                                    <span>Nghỉ việc</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group-row">
                        <div class="form-group full-width">
                            <label>Ghi chú</label>
                            <textarea th:field="*{note}" class="form-control" rows="3" style="width: 100%; resize: vertical; min-height: 80px;"></textarea>
                        </div>
                    </div>

                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">Lưu</button>
                        <a th:href="@{/employee}" class="btn btn-secondary">Hủy</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
</body>
</html>
