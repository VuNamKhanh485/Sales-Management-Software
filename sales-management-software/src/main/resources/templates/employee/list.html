<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý nhân viên — SMS</title>
    <link rel="stylesheet" th:href="@{/css/core/apple-design.css}">
    <link rel="stylesheet" th:href="@{/css/employee/employee.css}">
</head>

<body>

    <div th:replace="~{component/navbar :: global-nav('employee')}"></div>

    <div class="sub-nav">
        <h1 class="sub-nav__title">Quản lý nhân viên</h1>
        <div class="sub-nav__actions">
            <a th:href="@{/employee/new}" class="btn btn-primary btn-primary--sm">Thêm nhân viên</a>
        </div>
    </div>

    <main class="page-content">

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/employee}" method="get" class="search-bar" style="align-items: center;">

            <div class="search-input-wrap">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                </svg>
                <input type="text"
                       name="keyword"
                       class="search-input"
                       placeholder="Tìm mã, tên, email, SĐT"
                       th:value="${keyword}">
            </div>

            <select th:if="${session.loggedInUser.roleCode == 'OWNER'}" name="branchId" class="filter-select">
                <option value="">-- Chi nhánh --</option>
                <option th:each="b : ${branches}"
                        th:value="${b.id}"
                        th:text="${b.name}"
                        th:selected="${branchId != null and branchId == b.id}">
                </option>
            </select>

            <select name="roleId" class="filter-select">
                <option value="">-- Vai trò --</option>
                <option th:each="r : ${roles}"
                        th:value="${r.id}"
                        th:text="${r.code == 'OWNER' ? 'Chủ cửa hàng' : (r.code == 'BRANCH_MANAGER' ? 'Quản lý chi nhánh' : (r.code == 'WAREHOUSE_STAFF' ? 'Nhân viên kho' : (r.code == 'SALE_STAFF' ? 'Nhân viên bán hàng' : r.code)))}"
                        th:selected="${roleId != null and roleId == r.id}">
                </option>
            </select>

            <select name="status" class="filter-select">
                <option value="">-- Trạng thái --</option>
                <option th:each="s : ${statuses}"
                        th:value="${s}"
                        th:text="${s.name() == 'ACTIVE' ? 'Hoạt động' : (s.name() == 'INACTIVE' ? 'Ngừng hoạt động' : s)}"
                        th:selected="${status != null and status == s}">
                </option>
            </select>

            <button type="submit" class="btn btn-primary btn-primary--sm">Tìm kiếm</button>
            <a th:href="@{/employee}" class="btn btn-secondary btn-secondary--sm">Reset</a>
        </form>

        <div class="card-panel">
            <div class="table-scroll">
                <table>
                    <thead>
                    <tr>
                        <th>STT</th>
                        <th>Mã NV</th>
                        <th>Họ tên</th>
                        <th>Email</th>
                        <th>SĐT</th>
                        <th>Chi nhánh</th>
                        <th>Vai trò</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:if="${employeePage.totalElements == 0}">
                        <td colspan="9">
                            <div class="empty-state">
                                <h3 class="empty-state__title">Không có nhân viên nào</h3>
                            </div>
                        </td>
                    </tr>
                    <tr th:each="e, stat : ${employeePage.content}">
                        <td th:text="${employeePage.number * employeePage.size + stat.index + 1}"></td>
                        <td><span class="code-chip" th:text="${e.employeeCode}"></span></td>
                        <td th:text="${e.fullName}"></td>
                        <td th:text="${e.email}"></td>
                        <td th:text="${e.phone}"></td>
                        <td th:text="${e.branch != null ? e.branch.name : ''}"></td>
                        <td th:text="${e.role != null ? (e.role.code == 'OWNER' ? 'Chủ cửa hàng' : (e.role.code == 'BRANCH_MANAGER' ? 'Quản lý chi nhánh' : (e.role.code == 'WAREHOUSE_STAFF' ? 'Nhân viên kho' : (e.role.code == 'SALE_STAFF' ? 'Nhân viên bán hàng' : e.role.code)))) : ''}"></td>

                        <td>
                            <span class="badge" th:classappend="${e.workStatus.name() == 'ACTIVE'} ? 'badge-active' : 'badge-inactive'" th:text="${e.workStatus.name() == 'ACTIVE' ? 'Hoạt động' : 'Ngừng hoạt động'}"></span>
                        </td>

                        <td>
                            <div class="actions">
                                <a th:href="@{/employee/{id}/edit(id=${e.id})}"
                                   class="action-edit">Sửa</a>

                                <form th:action="@{/employee/{id}/toggle-status(id=${e.id})}"
                                      method="post"
                                      class="d-inline" style="margin: 0;">
                                    <button type="submit"
                                            class="action-btn action-toggle"
                                            th:text="${e.workStatus.name() == 'ACTIVE' ? 'Khóa' : 'Mở'}">
                                    </button>
                                </form>

                                
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${employeePage.totalPages > 1}" class="pagination-bar">
                <nav>
                    <ul class="pagination">
                        <li th:each="i : ${#numbers.sequence(0, employeePage.totalPages - 1)}"
                            th:classappend="${i == employeePage.number} ? 'active'">
                            <a th:href="@{/employee(page=${i}, keyword=${keyword}, branchId=${branchId}, roleId=${roleId}, status=${status})}"
                               th:text="${i + 1}">
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>

</body>
</html>
