<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý nhân viên</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-shell">
    <div th:replace="~{component/navbar :: sidebar-component}"></div>
    <main class="admin-main">
        <header class="admin-topbar">
            <div>
                <p class="admin-kicker">Admin Panel</p>
                <h1>Quản lý nhân viên</h1>
            </div>
        </header>
        <section class="admin-content">
    <div class="table-toolbar">
        <div>
            <h2>Danh sách nhân viên</h2>
            <p th:text="'Tổng cộng ' + ${employees != null ? #lists.size(employees) : 0} + ' nhân viên'">Tổng cộng 0 nhân viên</p>
        </div>
        <a th:href="@{/employee/create}" class="primary-action">Thêm nhân viên</a>
    </div>

    <div class="data-panel">
        <table class="admin-table">
            <thead>
            <tr>
                <th>Mã NV</th>
                <th>Họ tên</th>
                <th>Email</th>
                <th>SĐT</th>
                <th>Chi nhánh</th>
                <th>Vai trò</th>
                <th>Trạng thái</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="employee : ${employees}">
                <td th:text="${employee.employeeCode}"></td>
                <td th:text="${employee.fullName}"></td>
                <td th:text="${employee.email}"></td>
                <td th:text="${employee.phone}"></td>
                <td th:text="${employee.branch != null ? employee.branch.name : 'Chưa phân chi nhánh'}"></td>
                <td th:text="${employee.role != null ? employee.role.name : 'Chưa có vai trò'}"></td>
                <td th:text="${employee.workStatus != null ? employee.workStatus : 'N/A'}"></td>
                <td class="action-cell">
                    <a th:href="@{/employee/edit/{id}(id=${employee.id})}">Sửa</a>
                    <a th:href="@{/employee/delete/{id}(id=${employee.id})}" class="danger-link">Xóa</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="8" class="empty-row">Chưa có nhân viên nào.</td>
            </tr>
            </tbody>
        </table>
    </div>
        </section>
    </main>
</div>
</body>
</html>
