<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-4">

    <h3 th:text="${employeeForm.id == null ? 'Thêm nhân viên' : 'Sửa nhân viên'}"></h3>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:object="${employeeForm}"
          th:action="${employeeForm.id == null}
                    ? @{/employee/new}
                    : @{/employee/{id}/edit(id=${employeeForm.id})}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">Mã nhân viên</label>
                <input type="text" th:field="*{employeeCode}" class="form-control">
                <div class="text-danger" th:errors="*{employeeCode}"></div>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Họ tên</label>
                <input type="text" th:field="*{fullName}" class="form-control">
                <div class="text-danger" th:errors="*{fullName}"></div>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control">
                <div class="text-danger" th:errors="*{email}"></div>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">
                    Mật khẩu
                    <span th:if="${employeeForm.id != null}" class="text-muted">
                        (để trống nếu không đổi)
                    </span>
                </label>
                <input type="password" th:field="*{password}" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Số điện thoại</label>
                <input type="text" th:field="*{phone}" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Địa chỉ</label>
                <input type="text" th:field="*{address}" class="form-control">
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">Giới tính</label>
                <select th:field="*{gender}" class="form-select">
                    <option value="">-- Chọn --</option>
                    <option th:each="g : ${genders}"
                            th:value="${g}"
                            th:text="${g}">
                    </option>
                </select>
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">Ngày sinh</label>
                <input type="date" th:field="*{dob}" class="form-control">
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">Ngày vào làm</label>
                <input type="date" th:field="*{hiredDate}" class="form-control">
                <div class="text-danger" th:errors="*{hiredDate}"></div>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Lương cơ bản</label>
                <input type="number" step="1000" th:field="*{baseSalary}" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Trạng thái</label>
                <select th:field="*{workStatus}" class="form-select">
                    <option th:each="s : ${statuses}"
                            th:value="${s}"
                            th:text="${s}">
                    </option>
                </select>
                <div class="text-danger" th:errors="*{workStatus}"></div>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Vai trò</label>
                <select th:field="*{roleId}" class="form-select">
                    <option value="">-- Chọn vai trò --</option>

                    <option th:each="r : ${roles}"
                            th:if="${session.loggedInUser.roleCode == 'OWNER' || r.code != 'OWNER'}"
                            th:value="${r.id}"
                            th:text="${r.code}">
                    </option>
                </select>
                <div class="text-danger" th:errors="*{roleId}"></div>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Chi nhánh</label>

                <select th:if="${session.loggedInUser.roleCode == 'OWNER'}"
                        th:field="*{branchId}"
                        class="form-select">
                    <option value="">-- Chọn chi nhánh --</option>
                    <option th:each="b : ${branches}"
                            th:value="${b.id}"
                            th:text="${b.name}">
                    </option>
                </select>

                <select th:if="${session.loggedInUser.roleCode == 'BRANCH_MANAGER'}"
                        th:field="*{branchId}"
                        class="form-select"
                        disabled>
                    <option th:each="b : ${branches}"
                            th:if="${b.id == session.loggedInUser.branchId}"
                            th:value="${b.id}"
                            th:text="${b.name}">
                    </option>
                </select>

                <input th:if="${session.loggedInUser.roleCode == 'BRANCH_MANAGER'}"
                       type="hidden"
                       th:field="*{branchId}">
            </div>

            <div class="col-md-12 mb-3">
                <label class="form-label">Ghi chú</label>
                <textarea th:field="*{note}" class="form-control" rows="3"></textarea>
            </div>

        </div>

        <button type="submit" class="btn btn-primary">Lưu</button>
        <a th:href="@{/employee}" class="btn btn-secondary">Quay lại</a>

    </form>

</div>
</body>
</html>
