<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo yêu cầu nhập hàng — SMS</title>
    <link rel="stylesheet" th:href="@{/css/core/apple-design.css}">
    <link rel="stylesheet" th:href="@{/css/payment/cashbook.css}">
    <link rel="stylesheet" th:href="@{/css/inventory/imports.css}">
</head>
<body>

    <div th:replace="~{component/navbar :: global-nav('imports')}"></div>

    <div class="sub-nav">
        <a href="/imports" class="sub-nav__back">Quản lý nhập hàng</a>
        <span class="sub-nav__sep">›</span>
        <h1 class="sub-nav__title">Tạo yêu cầu nhập hàng</h1>
    </div>

    <main class="page-content form-page" style="max-width: 1000px;">
<body>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/imports/save}" th:object="${importRequest}" method="post" id="import-form">
            
            <div class="form-card">
                <h2 class="form-card__title">Thông tin chung</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Chi nhánh nhập hàng <span class="text-danger">*</span></label>
                        <div th:if="${sessionUser != null and sessionUser.branchId != null}">
                            <select class="form-select" disabled>
                                <option th:each="b : ${branches}" 
                                        th:value="${b.id}" 
                                        th:selected="${b.id == sessionUser.branchId}"
                                        th:text="${b.name}"></option>
                            </select>
                            <input type="hidden" th:field="*{branchId}" />
                        </div>
                        <div th:if="${sessionUser == null or sessionUser.branchId == null}">
                            <select class="form-select" th:field="*{branchId}" id="branchId" required>
                                <option value="">-- Chọn chi nhánh --</option>
                                <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}"></option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="supplierId" class="form-label">Nhà cung cấp <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{supplierId}" id="supplierId" required>
                            <option value="">-- Chọn nhà cung cấp --</option>
                            <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"></option>
                        </select>
                    </div>

                    <div class="form-group form-group--full">
                        <label for="note" class="form-label">Ghi chú</label>
                        <input type="text" class="form-input" th:field="*{note}" id="note" placeholder="Nhập ghi chú hoặc lý do nhập hàng..." />
                    </div>
                </div>
            </div>

            <div class="form-card">
                <h2 class="form-card__title">Thêm sản phẩm nhập kho</h2>
                <div class="search-bar" style="align-items: flex-end;">
                    <div style="flex: 2; position: relative;">
                        <label class="form-label">Chọn sản phẩm <span class="text-danger">*</span></label>
                        <div class="search-input-wrap">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                            </svg>
                            <input type="text" id="quick-product-search" class="search-input" placeholder="Nhập tên, SKU..." autocomplete="off" />
                        </div>
                        <input type="hidden" id="quick-product-id" />
                        <div id="quick-product-dropdown" class="product-dropdown-list" style="display: none; max-height: 250px; overflow-y: auto;"></div>
                    </div>

                    <div style="flex: 1;">
                        <label class="form-label">Đơn vị <span class="text-danger">*</span></label>
                        <select id="quick-unit-select" class="filter-select w-100" disabled>
                            <option value="">-- Đơn vị --</option>
                        </select>
                    </div>

                    <div style="flex: 1;">
                        <label class="form-label">Số lượng <span class="text-danger">*</span></label>
                        <input type="number" id="quick-quantity" class="form-input" min="1" value="1" />
                    </div>

                    <div style="flex: 1;">
                        <label class="form-label">Giá nhập (đ) <span class="text-danger">*</span></label>
                        <input type="number" id="quick-price" class="form-input" min="0" step="1000" placeholder="Giá..." />
                    </div>

                    <div>
                        <button type="button" id="quick-add-btn" class="btn btn-primary" style="height: 42px; padding: 0 16px;">
                            Thêm
                        </button>
                    </div>
                </div>
            </div>

            <div class="form-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--hairline);">
                    <h2 class="form-card__title" style="margin: 0;">Danh sách sản phẩm đã chọn</h2>
                    <div>
                        <a th:href="@{/product/form(from='/imports/create')}" class="btn btn-secondary btn-secondary--sm">
                            + Thêm sản phẩm mới
                        </a>
                    </div>
                </div>

                <div class="card-panel">
                    <div class="table-scroll">
                        <table id="item-table">
                            <thead>
                                <tr>
                                    <th style="width: 50px;">STT</th>
                                    <th>Tên sản phẩm</th>
                                    <th>SKU</th>
                                    <th>Đơn vị</th>
                                    <th>Số lượng</th>
                                    <th>Giá nhập (đ)</th>
                                    <th>Thành tiền</th>
                                    <th>Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="item-table-body">
                                <tr id="empty-table-row">
                                    <td colspan="8">
                                        <div class="empty-state">
                                            <h3 class="empty-state__title">Chưa có sản phẩm nào được thêm.</h3>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="summary-block">
                    <div class="summary-item">
                        <div class="summary-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.5v-3zm8 0A1.5 1.5 0 0 1 10.5 1h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.5v-3zm-8 8A1.5 1.5 0 0 1 2.5 9h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5v-3zm8 0A1.5 1.5 0 0 1 10.5 9h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 13.5v-3z"/>
                            </svg>
                        </div>
                        <div>
                            <div class="summary-label">Mặt hàng (SKU)</div>
                            <div class="summary-value" id="summary-skus">0</div>
                        </div>
                    </div>
                    
                    <div class="summary-item">
                        <div class="summary-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M5.757 1.071a.5.5 0 0 1 .172.686L3.383 6h9.234L10.07 1.757a.5.5 0 1 1 .858-.514L13.783 6H15.5a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5H.5a.5.5 0 0 1-.5-.5v-1A.5.5 0 0 1 .5 6h1.717L5.07 1.243a.5.5 0 0 1 .686-.172zM3.394 15l-1.48-6h-.97l1.525 6.426A1.5 1.5 0 0 0 3.93 16h8.14a1.5 1.5 0 0 0 1.46-1.174L15.056 9h-.97l-1.479 6H3.394z"/>
                            </svg>
                        </div>
                        <div>
                            <div class="summary-label">Tổng số lượng</div>
                            <div class="summary-value" id="summary-qty">0</div>
                        </div>
                    </div>

                    <div class="summary-item summary-item--primary">
                        <div class="summary-icon summary-icon--primary">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M1 3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1H1zm7 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
                                <path d="M0 5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V5zm3 0a2 2 0 0 1-2 2v4a2 2 0 0 1 2 2h10a2 2 0 0 1 2-2V7a2 2 0 0 1-2-2H3z"/>
                            </svg>
                        </div>
                        <div>
                            <div class="summary-label" style="color: var(--primary);">Tổng tiền phiếu nhập</div>
                            <div class="summary-value summary-value--large" id="grand-total">0 đ</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-actions" style="margin-top: 24px;">
                <button type="submit" class="btn btn-primary" id="submit-btn">Gửi yêu cầu nhập hàng</button>
                <a th:href="@{/imports}" class="btn btn-secondary">Hủy</a>
            </div>
        </form>
    </main>

    <script th:inline="javascript">
        /*<![CDATA[*/
        window.activeProducts = /*[[${activeProducts}]]*/ [];
        /*]]>*/
    </script>
    <script th:src="@{/js/inventory/imports-form.js}"></script>
</body>
</html>
