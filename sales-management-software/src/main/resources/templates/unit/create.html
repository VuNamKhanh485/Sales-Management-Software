<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <title>Thêm Đơn vị tính</title>
</head>
<body>

<h2>Thêm Đơn vị tính</h2>

<a th:href="@{/unit}">← Quay lại</a>

<br/><br/>

<form th:action="@{/unit/create}" th:object="${unit}" method="post">

    <label>Tên đơn vị:</label><br/>
    <input type="text" th:field="*{name}"/><br/><br/>

    <button type="submit">Lưu</button>
    <a th:href="@{/unit}">Hủy</a>

</form>

</body>
</html>
