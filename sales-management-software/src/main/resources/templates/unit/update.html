<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <title>Cập nhật Đơn vị tính</title>
</head>
<body>

<h2>Cập nhật Đơn vị tính</h2>

<a th:href="@{/unit}">← Quay lại</a>

<br/><br/>

<form th:action="@{/unit/update/{id}(id=${unitResponse.id})}" method="post">

    <label>Tên đơn vị:</label><br/>
    <input type="text" name="name" th:value="${unitResponse.name}"/><br/><br/>

    <button type="submit">Lưu thay đổi</button>
    <a th:href="@{/unit}">Hủy</a>

</form>

</body>
</html>
