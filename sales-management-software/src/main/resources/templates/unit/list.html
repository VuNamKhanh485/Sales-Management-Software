<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <title>Danh sách Đơn vị tính</title>
</head>
<body>

<h2>Danh sách Đơn vị tính</h2>

<form th:action="@{/unit}" method="get">
    <label>
        Search:
        <input type="text" name="keyword" placeholder="Nhập tên ..." th:value="${keyword}">
    </label>
    <button type="submit">Tìm kiếm</button>
</form>

<a th:href="@{/unit/form/{id}(id=0)}">+ Thêm đơn vị tính</a>

<table style="border: 1px solid black; border-collapse: collapse; border-spacing: 5px;">
    <thead>
    <tr>
        <th>#</th>
        <th>
            <a th:href="@{/category(
                keyword=${keyword},
                page=${currentPage},
                size=${size},
                sortField='name',
                sortDir=${reverseSortDir})}">
            Tên đơn vị
            </a>
        </th>
        <th>Thao tác</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${unitPage.content.isEmpty()}">
        <td colspan="3">Chưa có đơn vị tính nào.</td>
    </tr>
    <tr th:each="u, stat : ${unitPage.content}">
        <td th:text="${stat.index + 1}"></td>
        <td th:text="${u.name}"></td>
        <td>
            <a th:href="@{/unit/form/{id}(id=${u.id})}">Sửa</a>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${unitPage.totalPages > 1}">
    <span th:each="i : ${#numbers.sequence(0, unitPage.totalPages - 1)}">

        <a th:if="${i != currentPage}"
           th:href="@{/brand(
                keyword=${keyword},
                page=${i},
                size=${size},
                sortField=${sortField},
                sortDir=${sortDir})}"
           th:text="${i + 1}">
        </a>

        <span th:if="${i == currentPage}"
              th:text="${i + 1}">
        </span>

        &nbsp;
    </span>
</div>

</body>
</html>
