<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${id != null} ? 'Cập nhật Sản phẩm — SMS' : 'Thêm Sản phẩm — SMS'">Sản phẩm — SMS</title>
    <link rel="stylesheet" th:href="@{/css/core/apple-design.css}">
    <!-- Select2 & jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/product/product-form.css}">
</head>

<body>

    <!-- ── Global Nav ── -->
    <div th:replace="~{component/navbar :: global-nav('product')}"></div>

    <!-- ── Sub Nav ── -->
    <div class="sub-nav">
        <div style="display: flex; align-items: center;">
            <a href="/product" style="color:var(--primary); text-decoration:none; font-size:14px; margin-right:8px;">Sản
                phẩm</a>
            <span style="color:var(--ink-muted-48); font-size:12px; margin-right:8px;">›</span>
            <h1 style="font-size:21px; font-weight:600; margin:0;"
                th:text="${id != null} ? 'Sửa sản phẩm' : 'Thêm sản phẩm mới'">Sửa sản phẩm</h1>
        </div>
    </div>

    <main class="form-page">
        <div class="form-card">
            <div class="form-card__header">
                <h1 class="form-card__title" th:text="${id != null} ? 'Cập nhật Sản phẩm' : 'Thêm Sản phẩm mới'"></h1>
            </div>

            <form
                th:action="${id != null} ? @{/product/form/{id}(id=${id}, from=${from})} : @{/product/form(from=${from})}"
                method="post" th:object="${productRequest}" enctype="multipart/form-data">
                <div class="form-grid">

                    <div class="section-title">Thông tin cơ bản</div>

                    <div class="form-group form-group--full">
                        <label class="form-label">
                            Tên sản phẩm
                            <input type="text" class="form-input" th:field="*{name}" placeholder="VD: Sữa chua Vinamilk"
                                required />
                        </label>
                        <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            Danh mục
                            <select class="form-select select2-init" id="categoryId" th:field="*{categoryId}" required>
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="c : ${categoryList}" th:value="${c.id}" th:text="${c.name}"></option>
                            </select>
                        </label>
                        <div class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}">
                        </div>

                        <button type="button" class="add-link" onclick="openModal('modalCategory'); return false;">
                            + Thêm danh mục mới
                        </button>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            Thương hiệu
                            <select class="form-select select2-init" id="brandId" th:field="*{brandId}" required>
                                <option value="">-- Chọn thương hiệu --</option>
                                <option th:each="b : ${brandList}" th:value="${b.id}" th:text="${b.name}"></option>
                            </select>
                        </label>
                        <div class="field-error" th:if="${#fields.hasErrors('brandId')}" th:errors="*{brandId}"></div>

                        <button type="button" class="add-link" onclick="openModal('modalBrand'); return false;">
                            + Thêm thương hiệu mới
                        </button>
                    </div>

                    <div class="form-group form-group--full">
                        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 8px;">
                            <label class="form-label" style="margin: 0; white-space: nowrap;">Nhà cung cấp</label>
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <input type="text" id="supplierSearch" placeholder="Tìm kiếm..."
                                    style="border: 1px solid #ccc; border-radius: 4px; padding: 4px 10px; width: 200px; height: 32px; font-size: 13px; outline: none;"
                                    oninput="filterSuppliers()">
                                <button type="button" class="btn btn-secondary" onclick="filterSuppliers()"
                                    style="height: 32px; padding: 0 12px; display: flex; align-items: center; gap: 4px;">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor"
                                        viewBox="0 0 16 16">
                                        <path
                                            d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" />
                                    </svg>
                                    Tìm
                                </button>
                            </div>
                        </div>
                        <div id="supplierListContainer"
                            style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background-color: #fff; max-height: 200px; overflow-y: auto;">
                            <div th:each="sup : ${supplierList}" class="supplier-item"
                                style="display: flex; align-items: center; gap: 8px;">
                                <input type="checkbox" th:id="${'sup_' + sup.id}" th:value="${sup.id}"
                                    th:field="*{supplierIds}"
                                    style="width: 16px; height: 16px; cursor: pointer; margin: 0;">
                                <label th:for="${'sup_' + sup.id}" th:text="${sup.name}"
                                    style="margin: 0; font-weight: normal; cursor: pointer; font-size: 14px;"></label>
                            </div>
                        </div>
                        <div class="field-error" th:if="${#fields.hasErrors('supplierIds')}" th:errors="*{supplierIds}">
                        </div>
                    </div>

                    <div class="form-group form-group--full">
                        <label class="form-label">
                            Ảnh
                            <input type="file" class="form-input" th:field="*{imageFile}" accept="image/*"
                                onchange="previewImage(this)">
                        </label>

                        <div style="display:flex; gap:20px; margin-bottom:10px;">
                            <!-- Ảnh cũ: chỉ hiện khi đang update -->
                            <div th:if="${id != null}">
                                <p>Ảnh hiện tại</p>
                                <img th:src="@{'/images/product-image/' + *{imageName}}" alt="Ảnh cũ"
                                    style="max-width:200px;" />
                            </div>

                            <!-- Ảnh mới: ẩn cho tới khi người dùng chọn file -->
                            <div id="previewFrame" style="display:none">
                                <p>Ảnh mới</p>
                                <img id="imagePreview" src="#" alt="Ảnh mới" style="max-width:200px;" />
                            </div>
                        </div>
                    </div>

                    <div class="field-error" th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}"></div>

                    <div class="form-group form-group--full">
                        <label class="form-label">
                            Mô tả
                            <textarea class="form-textarea" rows="3" th:field="*{description}"></textarea>
                        </label>
                        <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">
                        </div>
                    </div>

                    <div class="form-group form-group--full">
                        <label class="form-label">
                            Ghi chú
                            <textarea class="form-textarea" rows="2" th:field="*{note}"></textarea>
                        </label>
                        <div class="field-error" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label ">
                            Trạng thái
                            <select class="form-select select2-no-search no-custom" th:field="*{status}">
                                <option th:each="s : ${T(com.g4fpt.sms.product.enums.ProductStatus).values()}"
                                    th:value="${s}" th:text="${s.name() == 'ACTIVE' ? 'Hoạt động' : 'Ngừng hoạt động'}"></option>
                            </select>
                        </label>
                        <div class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                    </div>

                    <div class="section-title">Quy đổi Đơn vị tính</div>
                    <span class="field-error" th:if="${#fields.hasErrors('productUnitsRequest')}"
                        th:errors="*{productUnitsRequest}"></span>
                    <div class="form-group--full" style="overflow-x:auto;">
                        <table class="unit-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Đơn vị</th>
                                    <th>Quy đổi</th>
                                    <th>Giá bán</th>
                                    <th>SKU</th>
                                    <th>Barcode</th>
                                    <th>Cơ bản</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="unitTable">
                                <tr th:if="${#lists.isEmpty(productRequest.productUnitsRequest)}" id="no-unit-row">
                                    <td colspan="8" style="text-align:center; color:var(--ink-muted-48); padding:16px;">
                                        Chưa có đơn vị tính nào.</td>
                                </tr>
                                <tr th:each="pu, stat : ${productRequest.productUnitsRequest}">
                                    <td th:text="${stat.index + 1}" class="row-index"></td>
                                    <input type="hidden" th:field="*{productUnitsRequest[__${stat.index}__].id}">

                                    <td>
                                        <select class="form-select unit-select2"
                                            th:field="*{productUnitsRequest[__${stat.index}__].unitId}"
                                            style="padding:4px 20px 4px 8px; font-size:13px; min-width:100px;">
                                            <option value="">-- Chọn --</option>
                                            <option th:each="unit : ${unitList}" th:value="${unit.id}"
                                                th:text="${unit.name}"></option>
                                        </select>

                                        <div class="field-error"
                                            th:if="${#fields.hasErrors('productUnitsRequest[__${stat.index}__].unitId')}"
                                            th:errors="*{productUnitsRequest[__${stat.index}__].unitId}"></div>

                                        <button type="button" class="btn-link" onclick="openModal('modalUnit',this)">
                                            + Thêm
                                        </button>
                                    </td>

                                    <td>
                                        <input type="number" class="form-input"
                                            th:field="*{productUnitsRequest[__${stat.index}__].conventionValue}"
                                            style="padding:4px 8px; font-size:13px; width:70px;">

                                        <div class="field-error"
                                            th:if="${#fields.hasErrors('productUnitsRequest[__${stat.index}__].conventionValue')}"
                                            th:errors="*{productUnitsRequest[__${stat.index}__].conventionValue}"></div>
                                    </td>

                                    <td>
                                        <input type="number" class="form-input"
                                            th:field="*{productUnitsRequest[__${stat.index}__].price}"
                                            style="padding:4px 8px; font-size:13px; width:100px;">

                                        <div class="field-error"
                                            th:if="${#fields.hasErrors('productUnitsRequest[__${stat.index}__].price')}"
                                            th:errors="*{productUnitsRequest[__${stat.index}__].price}"></div>
                                    </td>

                                    <td>
                                        <input type="text" class="form-input sku-input"
                                            th:field="*{productUnitsRequest[__${stat.index}__].sku}"
                                            style="padding:4px 8px; font-size:13px; width:100px;">

                                        <div class="field-error"
                                            th:if="${#fields.hasErrors('productUnitsRequest[__${stat.index}__].sku')}"
                                            th:errors="*{productUnitsRequest[__${stat.index}__].sku}"></div>
                                    </td>

                                    <td class="barcode-cell">
                                        <input type="text" class="form-input barcode-input"
                                            th:field="*{productUnitsRequest[__${stat.index}__].barcodeUnit}"
                                            style="padding:4px 8px; font-size:13px; width:100px;">

                                        <div class="field-error"
                                            th:if="${#fields.hasErrors('productUnitsRequest[__${stat.index}__].barcodeUnit')}"
                                            th:errors="*{productUnitsRequest[__${stat.index}__].barcodeUnit}"></div>

                                        <div class="barcode-preview-box">
                                            <svg class="barcode-svg"></svg>
                                            <div class="barcode-text"></div>
                                        </div>
                                    </td>

                                    <td style="text-align:center;">
                                        <input type="checkbox"
                                            th:field="*{productUnitsRequest[__${stat.index}__].isBaseUnit}">

                                        <div class="field-error"
                                            th:if="${#fields.hasErrors('productUnitsRequest[__${stat.index}__].isBaseUnit')}"
                                            th:errors="*{productUnitsRequest[__${stat.index}__].isBaseUnit}"></div>
                                    </td>
                                    <td>
                                        <button type="button" class="btn-icon"
                                            style="width:24px; height:24px; font-size:12px; color:var(--danger); background:transparent;"
                                            onclick="removeUnitRow(this)">
                                            ✕
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <button type="button" class="btn-secondary btn-secondary--sm" style="margin-top:12px;"
                            onclick="addUnitRow()">
                            + Thêm đơn vị tính
                        </button>
                    </div>
                </div>
                <div class="form-actions">
                    <a href="/product" class="btn-cancel" style="padding:10px 20px; font-size:15px;">Hủy</a>
                    <button type="submit" class="btn-primary" style="padding:10px 24px; font-size:15px;">Lưu thay
                        đổi</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Modal Category -->
    <div id="modalCategory" class="modal-overlay">
        <div class="modal-box" style="padding:0; overflow:hidden;">
            <div class="modal-header" style="padding: 20px 20px 0; margin-bottom: 0;">
                <span>Thêm danh mục mới</span>
                <button class="modal-close" onclick="closeModal('modalCategory')">×</button>
            </div>
            <iframe src="/category/popup-form" title="Biểu mẫu tạo danh mục"
                style="width:100%; border:none; height:320px;"></iframe>
        </div>
    </div>

    <!-- Modal Brand -->
    <div id="modalBrand" class="modal-overlay">
        <div class="modal-box" style="padding:0; overflow:hidden;">
            <div class="modal-header" style="padding: 20px 20px 0; margin-bottom: 0;">
                <span>Thêm Thương hiệu mới</span>
                <button class="modal-close" onclick="closeModal('modalBrand')">×</button>
            </div>
            <iframe src="/brand/popup-form" title="Biểu mẫu tạo nhãn hàng"
                style="width:100%; border:none; height:250px;"></iframe>
        </div>
    </div>

    <!-- Modal Unit -->
    <div id="modalUnit" class="modal-overlay">
        <div class="modal-box" style="padding:0; overflow:hidden;">
            <div class="modal-header" style="padding: 20px 20px 0; margin-bottom: 0;">
                <span>Thêm Đơn vị tính mới</span>
                <button class="modal-close" onclick="closeModal('modalUnit')">×</button>
            </div>
            <iframe src="/unit/popup-form" title="Biểu mẫu tạo đơn vị"
                style="width:100%; border:none; height:180px;"></iframe>
        </div>
    </div>



    <script th:src="@{/js/vendor/JsBarcode.all.min.js}"></script>
    <script th:inline="javascript">
        const unitList = /*[[${unitList}]]*/[];
        let rowIndex = document.querySelectorAll('#unitTable tr:not(#no-unit-row)').length;
        let currentUnitSelect = null;
    </script>
    <script th:src="@{/js/product/product-form.js}"></script>
</body>

</html>
