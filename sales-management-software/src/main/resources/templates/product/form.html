<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <title>Cập nhật Sản phẩm</title>
</head>
<body>

<h2>Sản phẩm</h2>

<a th:href="@{/product}">← Quay lại</a>

<br/><br/>

<form th:action="@{/product/form/{id}(id=${id})}" method="post" th:object="${productRequest}">
    <label>Tên sản phẩm:</label><br/>
    <input type="text" name="name" th:field="*{name}"/>

    <label>Danh mục:</label><br/>
    <select name="categoryId" th:field="*{categoryId}">
        <option value="">-- Chọn danh mục --</option>
        <option th:each="c : ${categoryList}"
                th:value="${c.id}"
                th:text="${c.name}">
        </option>
    </select><br/><br/>

    <label>Thương hiệu:</label><br/>
    <select name="brandId" th:field="*{brandId}">
        <option value="">-- Chọn thương hiệu --</option>
        <option th:each="b : ${brandList}"
                th:value="${b.id}"
                th:text="${b.name}">
        </option>
    </select><br/><br/>

    <label>Ảnh (URL):</label><br/>
    <input type="text" name="imageUrl" th:value="*{imageUrl}"/><br/><br/>

    <label>Mô tả:</label><br/>
    <textarea name="description" rows="3" cols="40" th:text="*{description}"></textarea><br/><br/>

    <label>Ghi chú:</label><br/>
    <textarea name="note" rows="3" cols="40" th:text="*{note}"></textarea><br/><br/>

    <label>Trạng thái:</label><br/>
    <select name="status" th:field="*{status}">
        <option value="">-- Chọn trạng thái --</option>
        <option th:each="s : ${T(com.g4fpt.sms.product.enums.ProductStatus).values()}"
                th:value="${s}"
                th:text="${s}">
        </option>
    </select><br/><br/>

    <hr/>
    <h3>Đơn vị tính</h3>

    <table border="1" cellpadding="6" cellspacing="0">
        <thead>
        <tr>
            <th>#</th>
            <th>Đơn vị</th>
            <th>Giá trị quy đổi</th>
            <th>Giá</th>
            <th>Barcode</th>
            <th>SKU</th>
            <th>Đơn vị cơ bản</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(productRequest.productUnitsRequest)}">
            <td colspan="7">Chưa có đơn vị tính nào.</td>
        </tr>
        <tr th:each="pu, stat : ${productRequest.productUnitsRequest}">
            <td th:text="${stat.index + 1}"></td>

            <input type="hidden"
                   th:field="*{productUnitsRequest[__${stat.index}__].id}">

            <select th:field="*{productUnitsRequest[__${stat.index}__].unitId}">
                <option th.each="unit : ${unitList}"
                        th.value="${unit.id}"
                        th:text="${unit.name}">
                </option>
            </select>
            <td>
                <input type="number"
                       th:field="*{productUnitsRequest[__${stat.index}__].conventionValue}">
            </td>

            <td>
                <input type="number"
                       th:field="*{productUnitsRequest[__${stat.index}__].price}">
            </td>

            <td>
                <input type="text"
                       th:field="*{productUnitsRequest[__${stat.index}__].barcodeUnit}">
            </td>
            <td>
                <input type="text"
                       th:field="*{productUnitsRequest[__${stat.index}__].sku}">
            </td>
            <td style="text-align:center">
                <input type="checkbox"
                       th:field="*{productUnitsRequest[__${stat.index}__].isBaseUnit}">
            </td>
        </tr>
        </tbody>
    </table>

    <br/><br/>
    <button type="submit">Lưu thay đổi</button>
    <a th:href="@{/product}">Hủy</a>

</form>

</body>
</html>
