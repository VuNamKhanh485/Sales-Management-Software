<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <title>Thêm Sản phẩm</title>
</head>
<body>

<h2>Thêm Sản phẩm</h2>

<a th:href="@{/product}">← Quay lại</a>

<br/><br/>

<form th:action="@{/product/create}" method="post">

    <label>Tên sản phẩm:</label><br/>
    <input type="text" name="name"/><br/><br/>

    <label>Danh mục:</label><br/>
    <select name="categoryId">
        <option value="">-- Chọn danh mục --</option>
        <option th:each="c : ${categoryList}"
                th:value="${c.id}"
                th:text="${c.name}">
        </option>
    </select><br/><br/>

    <label>Thương hiệu:</label><br/>
    <select name="brandId">
        <option value="">-- Chọn thương hiệu --</option>
        <option th:each="b : ${brandList}"
                th:value="${b.id}"
                th:text="${b.name}">
        </option>
    </select><br/><br/>

    <label>Ảnh (URL):</label><br/>
    <input type="text" name="imageUrl"/><br/><br/>

    <label>Mô tả:</label><br/>
    <textarea name="description" rows="3" cols="40"></textarea><br/><br/>

    <label>Ghi chú:</label><br/>
    <textarea name="note" rows="3" cols="40"></textarea><br/><br/>

    <label>Trạng thái:</label><br/>
    <select name="status">
        <option value="">-- Chọn trạng thái --</option>
        <option th:each="s : ${T(com.g4fpt.sms.product.enums.ProductStatus).values()}"
                th:value="${s}"
                th:text="${s}">
        </option>
    </select><br/><br/>

    <hr/>
    <h3>Đơn vị tính</h3>

    <table border="1" cellpadding="6" cellspacing="0" id="unitTable">
        <thead>
        <tr>
            <th>#</th>
            <th>Đơn vị</th>
            <th>Giá trị quy đổi</th>
            <th>Giá</th>
            <th>Barcode</th>
            <th>SKU</th>
            <th>Đơn vị cơ bản</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="unitTableBody">
        <!-- rows added by JS -->
        </tbody>
    </table>

    <br/>
    <button type="button" onclick="addUnitRow()">+ Thêm đơn vị</button>

    <br/><br/>
    <button type="submit">Lưu sản phẩm</button>
    <a th:href="@{/product}">Hủy</a>

</form>

<script th:inline="javascript">
    const units = /*[[${unitList}]]*/ [];
    let rowIndex = 0;

    function addUnitRow() {
        const tbody = document.getElementById('unitTableBody');
        const i = rowIndex++;

        let options = '<option value="">-- Chọn --</option>';
        units.forEach(u => {
            options += `<option value="${u.id}">${u.name}</option>`;
        });

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${i + 1}</td>
            <td><select name="productUnitsRequest[${i}].unitId">${options}</select></td>
            <td><input type="number" name="productUnitsRequest[${i}].conventionValue" value="1" min="1" style="width:70px"/></td>
            <td><input type="number" name="productUnitsRequest[${i}].price" step="0.01" style="width:100px"/></td>
            <td><input type="text" name="productUnitsRequest[${i}].barcodeUnit" style="width:120px"/></td>
            <td><input type="text" name="productUnitsRequest[${i}].sku" style="width:100px"/></td>
            <td style="text-align:center"><input type="checkbox" name="productUnitsRequest[${i}].isBaseUnit" value="true"/></td>
            <td><button type="button" onclick="this.closest('tr').remove()">Xóa</button></td>
        `;
        tbody.appendChild(tr);
    }
</script>

</body>
</html>
