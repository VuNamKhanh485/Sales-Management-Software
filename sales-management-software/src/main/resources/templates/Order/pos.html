<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Màn hình Thu Ngân - POS</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; background-color: #f4f6f8; display: flex; flex-direction: column; height: 100vh; }
        .header { background-color: #d13c62; padding: 15px; color: white; display: flex; align-items: center; }
        .search-form { display: flex; gap: 10px; }
        .search-input { padding: 10px; width: 400px; border-radius: 4px; border: none; outline: none;}
        .btn-add { background: white; color: #d13c62; font-weight: bold; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }

        .main-content { display: flex; flex: 1; overflow: hidden; }
        .col-left { flex: 7; display: flex; flex-direction: column; background: white; border-right: 2px solid #ddd; }
        .col-right { flex: 3; display: flex; flex-direction: column; background: #fff; padding: 15px; }

        .table-wrapper { flex: 1; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: #f9f9f9; padding: 12px; position: sticky; top: 0; border-bottom: 2px solid #eee; }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; }
        .btn-del { color: white; background: #dc3545; border: none; border-radius: 4px; padding: 5px 10px; cursor: pointer; font-weight: bold;}

        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 16px; }
        .summary-row.total { font-weight: bold; font-size: 20px; color: #d13c62; border-top: 1px dotted #ccc; padding-top: 15px; }

        .btn-checkout { width: 100%; background: #d13c62; color: white; font-size: 18px; font-weight: bold; padding: 15px; border: none; border-radius: 4px; cursor: pointer; margin-top: 20px; }

        .alert { padding: 15px; margin-bottom: 15px; border-radius: 4px; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="header">
    <form th:action="@{/pos/add}" method="post" class="search-form">
        <input type="text" name="passsword" class="search-input" placeholder="🔍 Quét mã vạch hoặc nhập ID sản phẩm..." autofocus required>
        <button type="submit" class="btn-add">Thêm vào đơn</button>
    </form>
</div>

<div class="main-content">
    <div class="col-left">
        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>STT</th>
                    <th>Mã SKU</th>
                    <th>Tên sản phẩm</th>
                    <th>Đơn vị</th>
                    <th>Số lượng</th>
                    <th>Đơn giá</th>
                    <th>Thành tiền</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item, stat : ${cart.items}">
                    <td th:text="${stat.count}">1</td>
                    <td th:text="${item.sku}">SKU</td>
                    <td th:text="${item.name}">Tên SP</td>
                    <td th:text="${item.unitName}">Cái</td>
                    <td th:text="${item.quantity}">1</td>
                    <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')}">10,000</td>
                    <td style="font-weight:bold; color: #d13c62;" th:text="${#numbers.formatDecimal(item.getSubTotal(), 0, 'COMMA', 0, 'POINT')}">10,000</td>
                    <td>
                        <form th:action="@{/pos/remove}" method="post">
                            <input type="hidden" name="index" th:value="${stat.index}">
                            <button type="submit" class="btn-del">Xóa</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(cart.items)}">
                    <td colspan="8" style="text-align: center; padding: 30px; color: #777;">Giỏ hàng đang trống! Nhập ID sản phẩm để bắt đầu.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div style="padding: 15px; border-top: 1px solid #ddd; background: #f9f9f9;">
            <form th:action="@{/pos/clear}" method="post">
                <button type="submit" style="padding: 10px 15px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Xóa toàn bộ giỏ hàng</button>
            </form>
        </div>
    </div>

    <div class="col-right">

        <div th:if="${param.success}" class="alert alert-success">
            Thanh toán thành công! Mã đơn: <strong th:text="${param.success}"></strong>
        </div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}">Lỗi!</div>
        <div th:if="${param.error == 'empty_cart'}" class="alert alert-danger">Giỏ hàng trống! Không thể thanh toán.</div>

        <form th:action="@{/pos/checkout}" method="post">
            <div class="summary-row">
                <span>Tổng tiền hàng:</span>
                <span th:text="${#numbers.formatDecimal(cart.getTotalAmount(), 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
            </div>

            <div class="summary-row total">
                <span>KHÁCH PHẢI TRẢ:</span>
                <span th:text="${#numbers.formatDecimal(cart.getTotalAmount(), 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
            </div>

            <hr style="margin: 20px 0; border: 0; border-top: 1px dashed #ccc;">

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; display: block; margin-bottom: 8px;">Hình thức thanh toán:</label>
                <select name="paymentMethodId" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; outline: none;">
                    <option value="2">Chuyển khoản (Mặc định)</option>
                    <option value="1">Tiền mặt</option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; display: block; margin-bottom: 8px;">Ghi chú hóa đơn:</label>
                <textarea name="note" placeholder="Nhập ghi chú..." style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; height: 80px; outline: none; resize: none;"></textarea>
            </div>

            <button type="submit" class="btn-checkout">THANH TOÁN (Chốt đơn)</button>
        </form>

    </div>
</div>

</body>
</html>
