<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý tồn kho</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Quản lý tồn kho</h2>
        <a th:href="@{/inventory}" class="btn btn-secondary">
            Làm mới
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <table class="table table-bordered table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Chi nhánh</th>
                    <th>Sản phẩm</th>
                    <th>SKU</th>
                    <th>Tồn kho</th>
                    <th>Tồn tối thiểu</th>
                    <th>Tồn tối đa</th>
                    <th>Vị trí</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="inventory : ${inventories}">
                    <td th:text="${inventory.id}"></td>
                    <td th:text="${inventory.branchName}"></td>
                    <td th:text="${inventory.productName}"></td>
                    <td th:text="${inventory.sku}"></td>
                    <td th:text="${inventory.stock}"></td>
                    <td th:text="${inventory.minStock}"></td>
                    <td th:text="${inventory.maxStock != null ? inventory.maxStock : '-'}"></td>
                    <td th:text="${inventory.positionInShop != null ? inventory.positionInShop : '-'}"></td>

                    <td>
                        <span th:if="${inventory.stockStatus == 'LOW_STOCK'}"
                              class="badge bg-danger">
                            Sắp hết hàng
                        </span>

                        <span th:if="${inventory.stockStatus == 'OK'}"
                              class="badge bg-success">
                            Bình thường
                        </span>
                    </td>

                    <td>
                        <a th:href="@{/inventory/{id}(id=${inventory.id})}"
                           class="btn btn-sm btn-primary">
                            Chi tiết
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(inventories)}">
                    <td colspan="10" class="text-center text-muted">
                        Chưa có dữ liệu tồn kho
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>

</body>
</html>
