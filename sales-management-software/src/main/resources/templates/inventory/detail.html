<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết tồn kho</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Chi tiết tồn kho</h2>

        <a th:href="@{/inventory}" class="btn btn-secondary">
            Quay lại
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            Thông tin tồn kho
        </div>

        <div class="card-body">

            <table class="table table-bordered">
                <tr>
                    <th style="width: 30%">ID</th>
                    <td th:text="${inventory.id}"></td>
                </tr>

                <tr>
                    <th>Chi nhánh</th>
                    <td th:text="${inventory.branchName}"></td>
                </tr>

                <tr>
                    <th>Sản phẩm</th>
                    <td th:text="${inventory.productName}"></td>
                </tr>

                <tr>
                    <th>SKU</th>
                    <td th:text="${inventory.sku}"></td>
                </tr>

                <tr>
                    <th>Số lượng tồn</th>
                    <td th:text="${inventory.stock}"></td>
                </tr>

                <tr>
                    <th>Tồn kho tối thiểu</th>
                    <td th:text="${inventory.minStock}"></td>
                </tr>

                <tr>
                    <th>Tồn kho tối đa</th>
                    <td th:text="${inventory.maxStock != null ? inventory.maxStock : '-'}"></td>
                </tr>

                <tr>
                    <th>Vị trí trong cửa hàng</th>
                    <td th:text="${inventory.positionInShop != null ? inventory.positionInShop : '-'}"></td>
                </tr>

                <tr>
                    <th>Trạng thái</th>
                    <td>
                        <span th:if="${inventory.stockStatus == 'LOW_STOCK'}"
                              class="badge bg-danger">
                            Sắp hết hàng
                        </span>

                        <span th:if="${inventory.stockStatus == 'OK'}"
                              class="badge bg-success">
                            Bình thường
                        </span>
                    </td>
                </tr>
            </table>

        </div>
    </div>

</div>

</body>
</html>
