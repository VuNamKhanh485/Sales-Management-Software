<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết Danh mục — SMS</title>
    <link rel="stylesheet" th:href="@{/css/apple-design.css}">
</head>
<body>
    <!-- ── Global Nav ── -->
    <div th:replace="~{component/navbar :: global-nav('product')}"></div>

    <!-- ── Sub Nav ── -->
    <div class="sub-nav">
        <div style="max-width: 800px; margin: 0 auto; width: 100%; display: flex; justify-content: space-between; align-items: center;">
            <span class="sub-nav__title" th:text="${id == 0 ? 'Thêm Danh mục mới' : 'Cập nhật Danh mục'}"></span>
            <div class="sub-nav__actions">
                <a th:href="@{/category}" class="btn-cancel">Quay lại</a>
            </div>
        </div>
    </div>

    <!-- ── Page Content ── -->
    <main class="page-wrap" style="max-width: 800px;">
        <div class="form-card">
            <div class="form-card__header">
                <h2 class="form-card__title">Thông tin cơ bản</h2>
            </div>

            <form th:action="@{/category/form/{id}(id=${id})}" th:object="${categoryRequest}" method="post">
                <div class="form-grid">
                    
                    <div class="form-group form-group--full">
                        <label class="form-label">Tên danh mục <span style="color:red">*</span></label>
                        <input type="text" class="form-input" th:field="*{categoryName}" placeholder="VD: Sữa chua, Đồ uống..." />
                        <div th:if="${#fields.hasErrors('categoryName')}" th:errors="*{categoryName}" style="color:var(--danger); font-size:13px; margin-top:4px;"></div>
                    </div>
                    
                    <div class="form-group form-group--full">
                        <label class="form-label">Mô tả</label>
                        <textarea class="form-textarea" rows="4" th:field="*{description}" placeholder="Mô tả danh mục..."></textarea>
                    </div>

                    <div class="form-group form-group--full">
                        <label class="form-label">Trạng thái <span style="color:red">*</span></label>
                        <select class="form-select-field" th:field="*{categoryStatus}">
                            <option value="">-- Chọn trạng thái --</option>
                            <option th:each="status : ${T(com.g4fpt.sms.product.enums.CategoryStatus).values()}"
                                    th:value="${status}"
                                    th:text="${status.name() == 'ACTIVE' ? 'Hoạt động' : 'Ngừng hoạt động'}">
                            </option>
                        </select>
                        <div th:if="${#fields.hasErrors('categoryStatus')}" th:errors="*{categoryStatus}" style="color:var(--danger); font-size:13px; margin-top:4px;"></div>
                    </div>

                </div>

                <div class="form-actions">
                    <a th:href="@{/category}" class="btn-cancel">Hủy</a>
                    <button type="submit" class="btn-primary">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
