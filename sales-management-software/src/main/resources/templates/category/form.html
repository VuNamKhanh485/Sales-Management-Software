<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <title>Chi tiết Danh mục</title>
</head>
<body>

<h2>Chi tiết Danh mục</h2>

<a th:href="@{/category}">← Quay lại</a>

<br/><br/>

<form th:action="@{/category/form/{id}(id=${id})}" th:object="${categoryRequest}" method="post">

    <label>Tên danh mục:
        <input type="text" name="categoryName" th:field="*{categoryName}"/>
    </label>
    <div th:errors="*{categoryName}" style="color:red"></div>
    <label>Mô tả:
        <textarea name="description" rows="4" cols="40" th:field="*{description}"></textarea><br/><br/>
    </label>
    <label>Trạng thái:
        <select name="categoryStatus" th:field="*{categoryStatus}">
            <option value="">-- Chọn trạng thái --</option>
            <option th:each="status : ${T(com.g4fpt.sms.product.enums.CategoryStatus).values()}"
                    th:value="${status}"
                    th:text="${status}">
            </option>
        </select>
    </label>
    <div th:errors="*{categoryStatus}" style="color:red"></div>
    <button type="submit">Lưu thay đổi</button>
    <a th:href="@{/category}">Hủy</a>

</form>

</body>
</html>
