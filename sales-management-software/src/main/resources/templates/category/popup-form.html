<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Popup Thêm Danh mục</title>
    <link rel="stylesheet" th:href="@{/css/apple-design.css}">
    <style>
        body { background: transparent; padding: 20px; margin: 0; }
    </style>
</head>
<body>
    <form th:action="@{/category/popup-form}" th:object="${categoryRequest}" method="post">
        <div class="form-grid">
            <div class="form-group form-group--full">
                <label class="form-label">Tên danh mục <span style="color:red">*</span></label>
                <input type="text" class="form-input" th:field="*{categoryName}" placeholder="VD: Sữa chua, Đồ uống..." />
                <div th:if="${#fields.hasErrors('categoryName')}" th:errors="*{categoryName}" style="color:var(--danger); font-size:13px; margin-top:4px;"></div>
            </div>
            <div class="form-group form-group--full">
                <label class="form-label">Mô tả</label>
                <textarea class="form-textarea" rows="2" th:field="*{description}" placeholder="Mô tả danh mục..."></textarea>
            </div>
            <div class="form-group form-group--full">
                <label class="form-label">Trạng thái <span style="color:red">*</span></label>
                <select class="form-select" th:field="*{categoryStatus}">
                    <option value="ACTIVE">Hoạt động</option>
                    <option value="INACTIVE">Ngừng hoạt động</option>
                </select>
                <div th:if="${#fields.hasErrors('categoryStatus')}" th:errors="*{categoryStatus}" style="color:var(--danger); font-size:13px; margin-top:4px;"></div>
            </div>
        </div>
        <div class="form-actions" style="margin-top: 20px;">
            <button type="button" class="btn-cancel" onclick="window.parent.closeModal('modalCategory')">Hủy</button>
            <button type="submit" class="btn-primary">Tạo mới</button>
        </div>
    </form>
</body>
</html>
