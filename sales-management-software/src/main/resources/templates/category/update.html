<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <title>Cập nhật Danh mục</title>
</head>
<body>

<h2>Cập nhật Danh mục</h2>

<a th:href="@{/category}">← Quay lại</a>

<br/><br/>

<form th:action="@{/category/update/{id}(id=${categoryResponse.id})}" method="post">

    <label>Tên danh mục:</label><br/>
    <input type="text" name="categoryName" th:value="${categoryResponse.name}"/><br/><br/>

    <label>Mô tả:</label><br/>
    <textarea name="description" rows="4" cols="40" th:text="${categoryResponse.description}"></textarea><br/><br/>

    <label>Trạng thái:</label><br/>
    <select name="categoryStatus">
        <option value="">-- Chọn trạng thái --</option>
        <option th:each="status : ${T(com.g4fpt.sms.product.enums.CategoryStatus).values()}"
                th:value="${status}"
                th:text="${status}"
                th:selected="${categoryResponse.categoryStatus == status}">
        </option>
    </select><br/><br/>

    <button type="submit">Lưu thay đổi</button>
    <a th:href="@{/category}">Hủy</a>

</form>

</body>
</html>
