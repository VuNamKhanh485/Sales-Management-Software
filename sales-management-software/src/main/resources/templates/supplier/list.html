<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Nhà cung cấp — SMS</title>
    <link rel="stylesheet" th:href="@{/css/core/apple-design.css}">
    <link rel="stylesheet" th:href="@{/css/inventory/supplier.css}">
</head>
<body>
    <div th:replace="~{component/navbar :: global-nav('supplier')}"></div>

    <div class="sub-nav">
        <div class="supplier-container header-layout">
            <span class="sub-nav__title">Nhà cung cấp</span>
            <div class="sub-nav__actions">
                <a th:href="@{/supplier/form/0}" class="btn-primary btn-primary--sm">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 1V11M1 6H11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    </svg>
                    Thêm nhà cung cấp
                </a>
            </div>
        </div>
    </div>

    <main class="page-wrap supplier-container">
        
        <form method="get" th:action="@{/supplier}" class="search-bar">
            <div class="search-input-wrap">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.5" />
                    <path d="M10 10L13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
                <input type="text" name="keyword" class="search-input" placeholder="Tìm theo tên/mã nhà cung cấp…" th:value="${keyword}" autocomplete="off">
            </div>
            <button type="submit" class="btn-primary btn-primary--sm">Tìm kiếm</button>
            <a th:href="@{/supplier}" class="btn-clear-link">Xóa lọc</a>
        </form>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="card-panel">
            <table class="supplier-table">
                <thead>
                    <tr>
                        <th style="width:44px">#</th>
                        <th>
                            <a class="sort-link" th:href="@{/supplier(keyword=${keyword},page=${currentPage},size=${size},sortField='code',sortDir=${reverseSortDir})}">
                                Mã NCC
                            </a>
                        </th>
                        <th>
                            <a class="sort-link" th:href="@{/supplier(keyword=${keyword},page=${currentPage},size=${size},sortField='name',sortDir=${reverseSortDir})}">
                                Tên nhà cung cấp
                                <svg width="11" height="11" viewBox="0 0 11 11" fill="none" th:if="${sortField == 'name'}">
                                    <path th:if="${sortDir == 'asc'}" d="M5.5 8V3m0 0L3 5.5m2.5-2.5L8 5.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path th:if="${sortDir == 'desc'}" d="M5.5 3v5m0 0L3 5.5m2.5 2.5L8 5.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </a>
                        </th>
                        <th>Điện thoại</th>
                        <th>Email</th>
                        <th>
                            <a class="sort-link" th:href="@{/supplier(keyword=${keyword},page=${currentPage},size=${size},sortField='status',sortDir=${reverseSortDir})}">
                                Trạng thái
                            </a>
                        </th>
                        <th style="width:120px">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s, stat : ${supplierPage.content}">
                        <td class="text-muted text-sm" th:text="${currentPage * size + stat.index + 1}"></td>
                        <td><span class="badge badge-inactive" th:text="${s.code}"></span></td>
                        <td><span class="font-semibold" th:text="${s.name}"></span></td>
                        <td th:text="${s.phone}"></td>
                        <td th:text="${s.email}"></td>
                        <td>
                            <span th:class="${s.status != null and s.status.name() == 'ACTIVE'} ? 'badge badge-active' : 'badge badge-inactive'"
                                  th:text="${s.status != null and s.status.name() == 'ACTIVE'} ? 'Hoạt động' : 'Ngừng hoạt động'"></span>
                        </td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/supplier/form/{id}(id=${s.id})}" class="action-edit">
                                    <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                                        <path d="M9.5 1.5L11.5 3.5L4.5 10.5H2.5V8.5L9.5 1.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
                                    </svg>
                                    Sửa
                                </a>
                                <form th:action="@{/supplier/delete}" method="post" class="delete-form">
                                    <input type="hidden" name="id" th:value="${s.id}">
                                    <button type="submit" class="action-delete btn-delete-action">Xóa</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${supplierPage.content.isEmpty()}">
                        <td colspan="7" class="empty-state-cell">
                            <div class="empty-state">
                                <div class="empty-state__icon">🏢</div>
                                <div class="empty-state__title">Không tìm thấy nhà cung cấp nào</div>
                                <p class="empty-state__sub">Thử thay đổi bộ lọc hoặc thêm nhà cung cấp mới.</p>
                                <a th:href="@{/supplier/form/0}" class="btn-primary btn-primary--sm">Thêm nhà cung cấp</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${supplierPage.totalPages > 1}" class="pagination-wrapper">
            <ul class="pagination">
                <li th:each="i : ${#numbers.sequence(0, supplierPage.totalPages - 1)}" th:class="${i == currentPage} ? 'active' : ''">
                    <a th:if="${i != currentPage}" th:href="@{/supplier(keyword=${keyword},page=${i},size=${size},sortField=${sortField},sortDir=${sortDir})}" th:text="${i + 1}"></a>
                    <strong th:if="${i == currentPage}" th:text="${i + 1}"></strong>
                </li>
            </ul>
        </div>
    </main>

    <script th:src="@{/js/inventory/supplier-list.js}"></script>
</body>
</html>
