<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit ? 'Chỉnh sửa chi nhánh' : 'Thêm chi nhánh'}">
        Chi nhánh
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/branch/form.css}">
</head>

<body>

<div class="container mt-4">

    <!-- Header -->
    <div class="page-header d-flex justify-content-between align-items-center mb-4">

        <h1 th:text="${isEdit ? 'Chỉnh sửa chi nhánh' : 'Thêm chi nhánh'}">
        </h1>

        <a th:href="@{/branch}"
           class="btn btn-secondary">
            Quay lại
        </a>

    </div>

    <div class="form-card">

        <form th:action="@{/branch/save}"
              th:object="${branch}"
              method="post">

            <!-- hidden id khi edit -->
            <input type="hidden"
                   name="id"
                   th:if="${isEdit}"
                   th:value="${branch.id}">

            <div class="row">

                <!-- Mã chi nhánh -->
                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Mã chi nhánh
                    </label>

                    <input type="text"
                           th:field="*{branchCode}"
                           class="form-control"
                           required
                           th:readonly="${isEdit}">

                </div>

                <!-- Tên chi nhánh -->
                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Tên chi nhánh
                    </label>

                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           required>

                </div>

                <!-- Số điện thoại -->
                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Số điện thoại
                    </label>

                    <input type="text"
                           th:field="*{phone}"
                           class="form-control">

                </div>

                <!-- Email -->
                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           th:field="*{email}"
                           class="form-control">

                </div>

                <!-- Địa chỉ -->
                <div class="col-12 mb-3">

                    <label class="form-label">
                        Địa chỉ
                    </label>

                    <input type="text"
                           th:field="*{address}"
                           class="form-control"
                           required>

                </div>

                <!-- Trạng thái -->
                <div class="col-md-6 mb-3">

                    <label class="form-label d-block">
                        Trạng thái
                    </label>

                    <label class="me-3">

                        <input type="radio"
                               th:field="*{status}"
                               value="ACTIVE">

                        Hoạt động

                    </label>

                    <label>

                        <input type="radio"
                               th:field="*{status}"
                               value="INACTIVE">

                        Ngừng hoạt động

                    </label>

                </div>

                <!-- Ghi chú -->
                <div class="col-12 mb-3">

                    <label class="form-label">
                        Ghi chú
                    </label>

                    <textarea th:field="*{note}"
                              rows="4"
                              class="form-control">
                    </textarea>

                </div>

            </div>

            <!-- Error -->
            <div th:if="${errors}"
                 class="alert alert-danger">

                <ul class="mb-0">

                    <li th:each="error : ${errors}"
                        th:text="${error}">
                    </li>

                </ul>

            </div>

            <!-- Buttons -->
            <div class="mt-4 d-flex gap-2">

                <button type="submit"
                        class="btn btn-primary"
                        th:text="${isEdit ? 'Cập nhật' : 'Lưu'}">
                </button>

                <a th:href="@{/branch}"
                   class="btn btn-outline-secondary">
                    Hủy
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
