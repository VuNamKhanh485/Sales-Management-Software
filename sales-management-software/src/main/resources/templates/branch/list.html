<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/branch/list.css}">

    <title>Danh sách chi nhánh</title>

</head>
<body>
<div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar">
        <h4 class="text-center mb-4">SMS</h4>

        <a th:href="@{/dashboard}" class="menu-item">
            Dashboard
        </a>

        <a th:href="@{/branch}" class="menu-item active">
            Quản lý Chi Nhánh
        </a>

        <a th:href="@{/employee}" class="menu-item">
            Nhân viên
        </a>

        <a th:href="@{/product}" class="menu-item">
            Sản phẩm
        </a>

        <a th:href="@{/order}" class="menu-item">
            Đơn hàng
        </a>
    </div>

    <div class="container mt-4">
        <h1 class="page-title">Danh sách chi nhánh</h1>

        <div class="mb-4">
            <a th:href="@{/branch/create}"
               class="btn btn-primary">
                Thêm chi nhánh
            </a>
        </div>

        <div class="branch-card">
            <table class="table">
                <thead>
                <tr>
                    <th>Mã Chi Nhánh</th>
                    <th>Tên Chi Nhánh</th>
                    <th>Địa Chỉ</th>
                    <th>Trạng Thái</th>
                    <th>SĐT</th>
                    <th>Thao Tác</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="branch : ${branches}">
                    <td th:text="${branch.branchCode}"></td>
                    <td th:text="${branch.name}"></td>
                    <td th:text="${branch.address}"></td>
                    <td th:text="${branch.status}"></td>
                    <td th:text="${branch.phone}"></td>
                    <td>
                        <a th:href="@{/branch/detail/{id}(id=${branch.id})}"
                           class="btn btn-sm btn-info">
                            Chi tiết
                        </a>
                        |
                        <a th:href="@{/branch/edit/{id}(id=${branch.id})}"
                           class="btn btn-sm btn-warning">
                            Sửa
                        </a>
                        |
                        <a th:href="@{/branch/delete/{id}(id=${branch.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa chi nhánh này không?');">
                            Xóa
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
