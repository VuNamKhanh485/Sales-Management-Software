<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách chi nhánh</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-shell">
    <div th:replace="~{component/navbar :: sidebar-component}"></div>
    <main class="admin-main">
        <header class="admin-topbar">
            <div>
                <p class="admin-kicker">Admin Panel</p>
                <h1>Quản lý chi nhánh</h1>
            </div>
        </header>
        <section class="admin-content">
            <div class="table-toolbar">
                <div>
                    <h2>Danh sách chi nhánh</h2>
                    <p th:text="'Tổng cộng ' + ${branchPage.totalElements} + ' chi nhánh'">
                        Tổng cộng 0 chi nhánh
                    </p>
                </div>
                <div class="d-flex gap-2">
                    <form th:action="@{/branch}"
                          class="d-flex gap-2">

                        <select name="searchType"
                                class="form-select"
                                style="width: 180px">

                            <option value="branchCode"
                                    th:selected="${searchType == 'branchCode'}">
                                Mã Chi Nhánh
                            </option>

                            <option value="name"
                                    th:selected="${searchType == 'name'}">
                                Tên Chi Nhánh
                            </option>
                        </select>

                        <input type="text"
                               name="keyword"
                               th:value="${keyword}"
                               placeholder="Nhập từ khóa..."
                               class="form-control">

                        <button type="submit"
                                class="btn btn-primary">
                            Tìm Kiếm
                        </button>

                        <a th:href="@{/branch}">Làm Mới</a>
                    </form>


                </div>
                <a sec:authorize="hasRole('OWNER')" th:href="@{/branch/create}" class="primary-action">Thêm chi
                    nhánh</a>
            </div>

            <div th:if="${successMessage}"
                 class="alert alert-success alert-dismissible fade show"
                 role="alert">

                <span th:text="${successMessage}"></span>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>
            </div>

            <div class="data-panel">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>Mã Chi Nhánh</th>
                        <th>Tên Chi Nhánh</th>
                        <th>Địa Chỉ</th>
                        <th>Trạng Thái</th>
                        <th>SĐT</th>
                        <th>Thao Tác</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="branch : ${branchPage.content}">
                        <td th:text="${branch.branchCode}"></td>
                        <td th:text="${branch.name}"></td>
                        <td th:text="${branch.address}"></td>
                        <td th:text="${branch.status != null ? branch.status : 'N/A'}"></td>
                        <td th:text="${branch.phone}"></td>
                        <td class="action-cell">
                            <a th:href="@{/branch/detail/{id}(id=${branch.id})}">Chi tiết</a>
                            <a sec:authorize="hasRole('OWNER')" th:href="@{/branch/edit/{id}(id=${branch.id})}">Sửa</a>
                            <a sec:authorize="hasRole('OWNER')" th:href="@{/branch/delete/{id}(id=${branch.id})}"
                               class="danger-link"
                               onclick="return confirm('Bạn có chắc chắn muốn xóa chi nhánh này?')">Xóa</a>
                        </td>
                    </tr>
                    <tr th:if="${branchPage.empty}">
                        <td colspan="6" class="empty-row">Chưa có chi nhánh nào.</td>
                    </tr>
                    </tbody>
                </table>


                <div th:if="${branchPage.totalPages > 1}">

                    <a th:if="${!branchPage.first}"
                       th:href="@{/branch(page=${branchPage.number - 1}, keyword=${keyword}, searchType=${searchType})}">
                        Trước
                    </a>

                    <span th:each="i : ${#numbers.sequence(0, branchPage.totalPages - 1)}">

                        <a th:if="${i != branchPage.number}"
                           th:text="${i + 1}"
                           th:href="@{/branch(page=${i}, keyword=${keyword}, searchType=${searchType})}">
                        </a>

                        <strong th:if="${i == branchPage.number}"
                                th:text="${i + 1}">
                        </strong>

                    </span>

                    <a th:if="${!branchPage.last}"
                       th:href="@{/branch(page=${branchPage.number + 1}, keyword=${keyword}, searchType=${searchType})}">
                        Sau
                    </a>
                </div>


            </div>
        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
