<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách chi nhánh — SMS</title>
    <link rel="stylesheet" th:href="@{/css/core/apple-design.css}">
    <link rel="stylesheet" th:href="@{/css/admin/branch.css}">
</head>
<body>

    <!-- ── Global Nav ── -->
    <div th:replace="~{component/navbar :: global-nav('branch')}"></div>

    <!-- ── Sub Nav ── -->
    <div class="sub-nav">
        <h1 class="sub-nav__title">Quản lý Chi nhánh</h1>
    </div>

    <main class="page-content">

        <!-- Flash messages -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <div class="header-actions">
            <form th:action="@{/branch}" method="GET" class="search-bar" style="margin-bottom:0; flex:1;">
                <select name="searchType" class="filter-select" style="min-width: 150px;">
                    <option value="branchCode" th:selected="${searchType == 'branchCode'}">Mã Chi Nhánh</option>
                    <option value="name" th:selected="${searchType == 'name'}">Tên Chi Nhánh</option>
                </select>

                <div class="search-input-wrap">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path fill-rule="evenodd" d="M11.742 10.342a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                    </svg>
                    <input type="text" name="keyword" class="search-input" th:value="${keyword}" placeholder="Nhập từ khóa...">
                </div>
                <button type="submit" class="btn-secondary btn-secondary--sm">Tìm kiếm</button>
                <a th:href="@{/branch}" class="btn-clear-link">Làm mới</a>
            </form>
            
            <a th:if="${sessionUser != null and sessionUser.hasRole('OWNER')}" th:href="@{/branch/create}" class="btn-primary btn-primary--sm">+ Thêm chi nhánh</a>
        </div>

        <div class="card-panel">
            <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--hairline);">
                <span class="usage" style="font-size:14px; font-weight:500;">
                    Danh sách chi nhánh (<span th:text="${branchPage.totalElements}"></span>)
                </span>
            </div>

            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Mã Chi Nhánh</th>
                            <th>Tên Chi Nhánh</th>
                            <th>Địa Chỉ</th>
                            <th>SĐT</th>
                            <th>Trạng Thái</th>
                            <th style="text-align:right;">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${branchPage.empty}">
                            <td colspan="6">
                                <div class="empty-state">
                                    <div class="empty-state__icon">🏢</div>
                                    <h3 class="empty-state__title">Chưa có chi nhánh nào</h3>
                                </div>
                            </td>
                        </tr>
                        <tr th:each="branch : ${branchPage.content}">
                            <td><span class="code-chip" th:text="${branch.branchCode}"></span></td>
                            <td style="font-weight:600; color:var(--ink);" th:text="${branch.name}"></td>
                            <td style="color:var(--ink-muted-80);" th:text="${branch.address}"></td>
                            <td th:text="${branch.phone}"></td>
                            <td>
                                <span class="badge" th:classappend="${branch.status != null and branch.status.name() == 'ACTIVE'} ? 'badge-active' : 'badge-inactive'" th:text="${branch.status != null and branch.status.name() == 'ACTIVE' ? 'Hoạt động' : (branch.status != null and branch.status.name() == 'INACTIVE' ? 'Ngừng hoạt động' : 'N/A')}"></span>
                            </td>
                            <td>
                                <div class="actions" style="justify-content:flex-end;">
                                    <a th:href="@{/branch/detail/{id}(id=${branch.id})}" class="action-edit" style="color:var(--ink-muted-80);">Chi tiết</a>
                                    <a th:if="${sessionUser != null and sessionUser.hasRole('OWNER')}" th:href="@{/branch/edit/{id}(id=${branch.id})}" class="action-edit">Sửa</a>
                                    <a th:if="${sessionUser != null and sessionUser.hasRole('OWNER')}" th:href="@{/branch/delete/{id}(id=${branch.id})}" class="action-delete" onclick="return confirm('Bạn có chắc chắn muốn xóa chi nhánh này?')">Xóa</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div th:if="${branchPage.totalPages > 1}" style="padding:16px; border-top:1px solid var(--hairline); display:flex; justify-content:center;">
                <nav>
                    <ul class="pagination">
                        <li th:if="${!branchPage.first}">
                            <a th:href="@{/branch(page=${branchPage.number - 1}, keyword=${keyword}, searchType=${searchType})}">Trước</a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(0, branchPage.totalPages - 1)}">
                            <a th:if="${i != branchPage.number}" th:text="${i + 1}" th:href="@{/branch(page=${i}, keyword=${keyword}, searchType=${searchType})}"></a>
                            <strong th:if="${i == branchPage.number}" th:text="${i + 1}"></strong>
                        </li>
                        <li th:if="${!branchPage.last}">
                            <a th:href="@{/branch(page=${branchPage.number + 1}, keyword=${keyword}, searchType=${searchType})}">Sau</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

    </main>
</body>
</html>
