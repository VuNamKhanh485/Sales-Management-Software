<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách chi nhánh</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
<div class="admin-shell">
    <div th:replace="~{component/navbar :: sidebar-component}"></div>

    <main class="admin-main">
        <header class="admin-topbar">
            <div>
                <h1>Quản lý chi nhánh</h1>
            </div>
        </header>

        <section class="admin-content">
            <div class="table-toolbar">
                <div>
                    <h2>Danh sách chi nhánh</h2>
                    <p th:text="'Tổng cộng ' + ${branches != null ? #lists.size(branches) : 0} + ' chi nhánh'">
                        Tổng cộng 0 chi nhánh
                    </p>
                </div>

                <a th:if="${session.loggedInUser != null
                           and session.loggedInUser.roleCode == 'OWNER'}"
                   th:href="@{/branch/create}"
                   class="primary-action">
                    Thêm chi nhánh
                </a>
            </div>

            <div class="data-panel">
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>Mã Chi Nhánh</th>
                        <th>Tên Chi Nhánh</th>
                        <th>Địa Chỉ</th>
                        <th>Trạng Thái</th>
                        <th>SĐT</th>
                        <th>Thao Tác</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="branch : ${branches}">
                        <td th:text="${branch.branchCode}">BR001</td>
                        <td th:text="${branch.name}">Chi nhánh Hà Nội</td>
                        <td th:text="${branch.address}">Hà Nội</td>
                        <td th:text="${branch.status != null ? branch.status : 'N/A'}">ACTIVE</td>
                        <td th:text="${branch.phone}">0123456789</td>

                        <td class="action-cell">
                            <a th:href="@{/branch/detail/{id}(id=${branch.id})}">
                                Chi tiết
                            </a>

                            <a th:if="${session.loggedInUser != null
                                       and session.loggedInUser.roleCode == 'OWNER'}"
                               th:href="@{/branch/edit/{id}(id=${branch.id})}">
                                Sửa
                            </a>

                            <a th:if="${session.loggedInUser != null
                                       and session.loggedInUser.roleCode == 'OWNER'}"
                               th:href="@{/branch/delete/{id}(id=${branch.id})}"
                               class="danger-link"
                               onclick="return confirm('Bạn có chắc chắn muốn xóa chi nhánh này không?')">
                                Xóa
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${branches == null or #lists.isEmpty(branches)}">
                        <td colspan="6" class="empty-row">Chưa có chi nhánh nào.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
