<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Chi tiết chi nhánh</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/branch/detail.css}">
</head>

<body>

<div class="container mt-4">

    <!-- Header -->

    <div class="page-header">

        <h1>Chi tiết chi nhánh</h1>

        <a th:href="@{/branch}"
           class="btn btn-secondary">
            Quay lại
        </a>

    </div>

    <!-- Card -->

    <div class="detail-card">

        <div class="row">

            <div class="col-md-6 mb-4">

                <label>Mã chi nhánh</label>

                <div class="info-box"
                     th:text="${branch.branchCode}">
                </div>

            </div>

            <div class="col-md-6 mb-4">

                <label>Tên chi nhánh</label>

                <div class="info-box"
                     th:text="${branch.name}">
                </div>

            </div>

            <div class="col-md-6 mb-4">

                <label>Số điện thoại</label>

                <div class="info-box"
                     th:text="${branch.phone}">
                </div>

            </div>

            <div class="col-md-6 mb-4">

                <label>Email</label>

                <div class="info-box"
                     th:text="${branch.email}">
                </div>

            </div>

            <div class="col-12 mb-4">

                <label>Địa chỉ</label>

                <div class="info-box"
                     th:text="${branch.address}">
                </div>

            </div>

            <div class="col-md-6 mb-4">

                <label>Trạng thái</label>

                <div class="info-box">

                    <span th:if="${branch.status.name() == 'ACTIVE'}"
                          class="status-active">
                        Hoạt động
                    </span>

                    <span th:if="${branch.status.name() == 'INACTIVE'}"
                          class="status-inactive">
                        Ngừng hoạt động
                    </span>

                </div>

            </div>

            <div class="col-md-6 mb-4">

                <label>Ngày mở cửa</label>

                <div class="info-box"
                     th:text="${branch.openedAt}">
                </div>

            </div>

            <div class="col-md-6 mb-4">

                <label>Ngày đóng cửa</label>

                <div class="info-box"
                     th:text="${branch.closedAt}">
                </div>

            </div>

            <div class="col-md-6 mb-4">

                <label>Ngày tạo</label>

                <div class="info-box"
                     th:text="${branch.createdAt}">
                </div>

            </div>

            <div class="col-md-6 mb-4">

                <label>Cập nhật lần cuối</label>

                <div class="info-box"
                     th:text="${branch.updatedAt}">
                </div>

            </div>

            <div class="col-12 mb-4">

                <label>Ghi chú</label>

                <div class="info-box note-box"
                     th:text="${branch.note}">
                </div>

            </div>

        </div>

        <div class="action-group">

            <a th:href="@{/branch/edit/{id}(id=${branch.id})}"
               class="btn btn-warning">

                Chỉnh sửa

            </a>

            <a th:href="@{/branch/delete/{id}(id=${branch.id})}"
               class="btn btn-danger">

                Xóa

            </a>

        </div>

    </div>

</div>

</body>
</html>
