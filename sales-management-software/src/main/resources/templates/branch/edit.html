<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa chi nhánh</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/branch/edit.css}">
</head>

<body>

<div class="container mt-4">

    <div class="page-header">

        <h1>Chỉnh sửa chi nhánh</h1>

        <a th:href="@{/branch}"
           class="btn btn-secondary">
            Quay lại
        </a>

    </div>

    <div class="form-card">

        <form th:action="@{/branch/edit/{id}(id=${id})}"
              th:object="${branch}"
              method="post">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Mã chi nhánh
                    </label>

                    <input type="text"
                           th:field="*{branchCode}"
                           class="form-control"
                           readonly>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Tên chi nhánh
                    </label>

                    <input type="text"
                           th:field="*{name}"
                           class="form-control">

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Số điện thoại
                    </label>

                    <input type="text"
                           th:field="*{phone}"
                           class="form-control">

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           th:field="*{email}"
                           class="form-control">

                </div>

                <div class="col-12 mb-3">

                    <label class="form-label">
                        Địa chỉ
                    </label>

                    <input type="text"
                           th:field="*{address}"
                           class="form-control">

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label d-block">
                        Trạng thái
                    </label>

                    <label class="me-3">
                        <input type="radio"
                               th:field="*{status}"
                               value="ACTIVE">
                        Hoạt động
                    </label>

                    <label>
                        <input type="radio"
                               th:field="*{status}"
                               value="INACTIVE">
                        Ngừng hoạt động
                    </label>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Ngày mở cửa
                    </label>

                    <input type="date"
                           th:field="*{openedAt}"
                           class="form-control">

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Ngày đóng cửa
                    </label>

                    <input type="date"
                           th:field="*{closedAt}"
                           class="form-control">

                </div>

                <div class="col-12 mb-3">

                    <label class="form-label">
                        Ghi chú
                    </label>

                    <textarea th:field="*{note}"
                              rows="4"
                              class="form-control">
                    </textarea>

                </div>

            </div>

            <div class="button-group">

                <div th:if="${errors}"
                     class="alert alert-danger">

                    <ul class="mb-0">

                        <li th:each="error : ${errors}"
                            th:text="${error}">
                        </li>

                    </ul>
                </div>

                <button type="submit"
                        class="btn btn-warning">
                    Cập nhật
                </button>

                <a th:href="@{/branch}"
                   class="btn btn-outline-secondary">
                    Hủy
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
