<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác nhận xóa</title>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-card: #ffffff;
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --danger-color: #ff3b30;
            --danger-hover: #e03126;
            --btn-gray: #e8e8ed;
            --btn-gray-hover: #d2d2d7;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--apple-bg);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .dialog-container {
            width: 100%;
            max-width: 400px;
            background: var(--apple-card);
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        h3 {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 12px 0;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 14px;
            color: #333333;
            line-height: 1.5;
            margin: 0 0 8px 0;
        }
        .warning-text {
            color: var(--danger-color) !important;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 24px !important;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-direction: row-reverse; /* Đưa nút xác nhận sang phải đúng chuẩn UI */
        }
        .btn-delete {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            flex: 1;
        }
        .btn-delete:hover {
            background-color: var(--danger-hover);
        }
        .btn-cancel {
            background-color: var(--btn-gray);
            color: var(--text-main);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
            flex: 1;
            box-sizing: border-box;
            display: inline-block;
        }
        .btn-cancel:hover {
            background-color: var(--btn-gray-hover);
        }
    </style>
</head>
<body>
<div class="dialog-container">
    <h3>Xác nhận xóa</h3>
    <p>Bạn có chắc muốn xóa voucher <strong th:text="${voucher.code}"></strong> không?</p>
    <p class="warning-text">Hành động này không thể hoàn tác.</p>

    <div class="action-buttons">
        <form th:action="@{/vouchers/delete/{id}(id=${voucher.id})}" method="post" style="flex: 1;">
            <button type="submit" class="btn-delete">Xác nhận xóa</button>
        </form>
        <a href="/vouchers" class="btn-cancel">Hủy</a>
    </div>
</div>
</body>
</html>
