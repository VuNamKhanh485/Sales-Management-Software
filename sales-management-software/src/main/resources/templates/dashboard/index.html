<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng quan hệ thống — SMS</title>
    <meta name="description" content="Hệ thống quản lý bán hàng SMS.">

    <style>
        /* ─────────────────────────────────────────
           DESIGN TOKENS  (DESIGN-apple.md)
        ───────────────────────────────────────── */
        :root {
            --primary:          #0066cc;
            --primary-focus:    #0071e3;
            --ink:              #1d1d1f;
            --ink-muted-80:     #333333;
            --ink-muted-48:     #7a7a7a;
            --divider-soft:     #f0f0f0;
            --hairline:         #e0e0e0;
            --canvas:           #ffffff;
            --canvas-parchment: #f5f5f7;
            --surface-pearl:    #fafafc;
            --on-primary:       #ffffff;
            --success:          #34c759;
            --danger:           #ff3b30;

            --font-display: "SF Pro Display", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            --font-text:    "SF Pro Text",    system-ui, -apple-system, BlinkMacSystemFont, sans-serif;

            --r-sm: 8px; --r-md: 11px; --r-lg: 18px; --r-pill: 9999px;
            --sp-xs: 8px; --sp-sm: 12px; --sp-md: 17px; --sp-lg: 24px; --sp-xl: 32px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-text);
            font-size: 15px;
            line-height: 1.47;
            letter-spacing: -0.224px;
            color: var(--ink);
            background-color: var(--canvas-parchment);
            min-height: 100vh;
            display: flex;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 260px;
            background-color: var(--canvas);
            border-right: 1px solid var(--hairline);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100vh;
            position: sticky;
            top: 0;
            padding: var(--sp-lg) 0;
        }

        .sidebar-brand {
            padding: 0 var(--sp-lg) var(--sp-lg) var(--sp-lg);
            border-bottom: 1px solid var(--divider-soft);
            margin-bottom: var(--sp-md);
        }

        .brand-title {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-subtitle {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--ink-muted-48);
            margin-top: 4px;
        }

        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 0 12px;
            overflow-y: auto;
            flex: 1;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            color: var(--ink-muted-80);
            text-decoration: none;
            border-radius: var(--r-sm);
            font-weight: 500;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .menu-link svg {
            color: var(--ink-muted-48);
            transition: color 0.15s ease;
        }

        .menu-link:hover {
            background-color: var(--canvas-parchment);
            color: var(--ink);
        }

        .menu-link:hover svg {
            color: var(--ink-muted-80);
        }

        .menu-link.active {
            background-color: rgba(0, 102, 204, 0.08);
            color: var(--primary);
        }

        .menu-link.active svg {
            color: var(--primary);
        }

        /* ── Main content area ── */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }

        /* Top header bar */
        .top-bar {
            height: 60px;
            background-color: var(--canvas);
            border-bottom: 1px solid var(--hairline);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--sp-xl);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .search-wrapper {
            position: relative;
            max-width: 400px;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ink-muted-48);
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            height: 38px;
            background-color: var(--canvas-parchment);
            border: 1px solid transparent;
            border-radius: var(--r-pill);
            padding: 8px 16px 8px 40px;
            font-family: var(--font-text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s, background-color 0.15s;
        }

        .search-input:focus {
            background-color: var(--canvas);
            border-color: var(--primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--ink-muted-80);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: background-color 0.15s;
        }

        .action-btn:hover {
            background-color: var(--canvas-parchment);
            color: var(--ink);
        }

        .badge-dot {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 7px;
            height: 7px;
            background-color: var(--danger);
            border-radius: 50%;
            border: 1.5px solid var(--canvas);
        }

        .branch-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--ink-muted-80);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: var(--r-sm);
            border: 1px solid var(--hairline);
            background-color: var(--surface-pearl);
            font-size: 13px;
        }

        .branch-selector:hover {
            background-color: var(--canvas-parchment);
        }

        /* ── Content area ── */
        .content-body {
            padding: var(--sp-xl);
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: var(--sp-xl);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .page-title h1 {
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--ink);
            margin-bottom: 6px;
        }

        .page-title p {
            font-size: 16px;
            color: var(--ink-muted-48);
        }

        .action-row {
            display: flex;
            gap: var(--sp-sm);
        }

        .btn-utility {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--canvas);
            color: var(--ink-muted-80);
            border: 1px solid var(--hairline);
            border-radius: var(--r-sm);
            padding: 10px 18px;
            font-family: var(--font-text);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.1s;
        }

        .btn-utility:hover {
            background-color: var(--surface-pearl);
            color: var(--ink);
        }

        .btn-utility:active {
            transform: scale(0.98);
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--primary);
            color: var(--on-primary);
            border: none;
            border-radius: var(--r-sm);
            padding: 10px 18px;
            font-family: var(--font-text);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.1s;
        }

        .btn-primary:hover {
            background-color: var(--primary-focus);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--sp-lg);
            margin-bottom: var(--sp-xl);
        }

        .summary-card {
            background-color: var(--canvas);
            border: 1px solid var(--hairline);
            border-radius: var(--r-lg);
            padding: var(--sp-lg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 125px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--sp-sm);
        }

        .card-icon-wrap {
            width: 40px;
            height: 40px;
            border-radius: var(--r-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-blue { background-color: rgba(0, 102, 204, 0.08); color: var(--primary); }
        .icon-green { background-color: rgba(52, 199, 89, 0.08); color: var(--success); }
        .icon-orange { background-color: rgba(255, 149, 0, 0.08); color: #ff9500; }
        .icon-red { background-color: rgba(255, 59, 48, 0.08); color: var(--danger); }

        .card-trend {
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .trend-up { color: var(--success); }
        .trend-down { color: var(--danger); }

        .card-body {
            margin-top: auto;
        }

        .card-label {
            font-size: 13px;
            color: var(--ink-muted-48);
            margin-bottom: 4px;
        }

        .card-value {
            font-family: var(--font-display);
            font-size: 26px;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: -0.5px;
        }

        .card-value.danger-text {
            color: var(--danger);
        }

        .card-subtext {
            font-size: 12px;
            color: var(--ink-muted-48);
            margin-top: 2px;
        }

        /* Dashboard Placeholder Panel */
        .placeholder-panel {
            background-color: var(--canvas);
            border: 1px solid var(--hairline);
            border-radius: var(--r-lg);
            padding: 80px var(--sp-xl);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .placeholder-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: var(--canvas-parchment);
            color: var(--ink-muted-48);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--sp-lg);
        }

        .placeholder-panel h3 {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 600;
            margin-bottom: var(--sp-xs);
            color: var(--ink);
        }

        .placeholder-panel p {
            font-size: 15px;
            color: var(--ink-muted-48);
            max-width: 480px;
            line-height: 1.5;
            margin-bottom: var(--sp-lg);
        }

        /* Responsive */
        @media (max-width: 1100px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--hairline); padding: var(--sp-sm) 0; }
            .sidebar-brand { border-bottom: none; margin-bottom: 0; padding: 0 var(--sp-md); }
            .menu-list { display: none; } /* On mobile, collapse menu in home for simplicity */
            .main-container { height: auto; }
            .top-bar { padding: 0 var(--sp-md); }
            .cards-grid { grid-template-columns: 1fr; }
            .content-body { padding: var(--sp-md); }
            .page-header { flex-direction: column; align-items: flex-start; gap: var(--sp-sm); }
        }
    </style>
</head>
<body>

<!-- Left Sidebar Navigation -->
<div th:replace="~{component/navbar :: sidebar-component}" th:with="page='dashboard'"></div>

<!-- Main Container -->
<div class="main-container">
    
    <!-- Top header bar -->
    <header class="top-bar">
        <div class="search-wrapper">
            <span class="search-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </span>
            <input type="text" placeholder="Tìm kiếm sản phẩm, đơn hàng..." class="search-input">
        </div>
        
        <div class="header-actions">
            <button class="action-btn" aria-label="Thông báo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="badge-dot"></span>
            </button>
            
            <button class="action-btn" aria-label="Cài đặt">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
            
            <div class="branch-selector">
                <span>Chi nhánh: Quận 1</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="content-body">
        
        <div class="page-header">
            <div class="page-title">
                <h1>Tổng quan hệ thống</h1>
                <p>Xin chào Admin, đây là tình hình kinh doanh hôm nay.</p>
            </div>
            
            <div class="action-row">
                <button class="btn-utility">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span>Xuất báo cáo</span>
                </button>
                <button class="btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Thêm sản phẩm</span>
                </button>
            </div>
        </div>

        <!-- Empty canvas content space -->
        <div class="empty-canvas" style="background-color: var(--canvas); border: 1px solid var(--hairline); border-radius: var(--r-lg); min-height: calc(100vh - 180px); display: flex; align-items: center; justify-content: center; color: var(--ink-muted-48); font-size: 15px;">
            Không có nội dung hiển thị
        </div>
    </main>

</div>

</body>
</html>
