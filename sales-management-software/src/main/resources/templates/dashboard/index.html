<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung tâm Phê duyệt — System Owner</title>
    <meta name="description" content="Trang chủ dành cho System Owner">
    <link rel="stylesheet" th:href="@{/css/core/apple-design.css}">
    <style>
        .home-layout {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 var(--sp-lg);
        }

        .welcome-header {
            margin-bottom: 32px;
        }

        .welcome-header h1 {
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: -0.5px;
            margin: 0 0 8px 0;
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 600;
            color: var(--ink);
            margin: 0 0 20px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .approval-table-card {
            background: var(--canvas);
            border: 1px solid var(--hairline);
            border-radius: var(--r-lg);
            overflow: hidden;
        }

        .empty-state-nice {
            padding: 60px 24px;
            text-align: center;
            background: var(--surface-pearl);
        }

        .empty-state-nice svg {
            color: var(--success);
            opacity: 0.8;
            margin-bottom: 16px;
        }

        .empty-state-nice h3 {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 600;
            color: var(--ink);
            margin: 0 0 8px 0;
        }

        .empty-state-nice p {
            color: var(--ink-muted-48);
            margin: 0;
            font-size: 15px;
        }
        
        .badge-type-import {
            background: rgba(0, 102, 204, 0.1);
            color: var(--primary);
        }
        
        .badge-type-return {
            background: rgba(255, 159, 10, 0.1);
            color: var(--warning);
        }
    </style>
</head>

<body>

    <!-- Header Navigation -->
    <div th:replace="~{component/navbar :: global-nav('dashboard')}"></div>

    <main class="home-layout">

        <div class="welcome-header">
            <h1>Trung tâm Phê duyệt</h1>
        </div>

        <!-- Bảng danh sách yêu cầu cần duyệt -->
        <div id="approvals">
            <h2 class="section-title">
                Danh sách yêu cầu chờ duyệt
                <span class="badge badge-inactive" th:if="${pendingApprovals.size() > 0}"
                    th:text="${pendingApprovals.size()}" style="font-size: 16px; padding: 4px 10px;">2</span>
            </h2>

            <div class="approval-table-card">

                <!-- Hiển thị khi có dữ liệu -->
                <div th:if="${pendingApprovals.size() > 0}" class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>Loại yêu cầu</th>
                                <th>Mã phiếu</th>
                                <th>Thông tin (Đơn hàng/Chi nhánh)</th>
                                <th>Người tạo</th>
                                <th>Ngày tạo</th>
                                <th style="text-align: right; padding-right: 24px;">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="req : ${pendingApprovals}">
                                <td>
                                    <span th:if="${req.type == 'Nhập hàng'}" class="badge badge-type-import">Nhập hàng</span>
                                    <span th:if="${req.type == 'Trả hàng'}" class="badge badge-type-return">Trả hàng</span>
                                </td>
                                <td style="font-weight: 600; color: var(--primary);" th:text="${req.code}">IMP-123</td>
                                <td th:text="${req.info}">Thông tin</td>
                                <td th:text="${req.creator}">Người tạo</td>
                                <td th:text="${#temporals.format(req.createdAt, 'dd-MM-yyyy HH:mm')}">20-07-2026</td>
                                <td style="text-align: right; padding-right: 24px;">
                                    <a th:href="@{${req.url}}" class="btn-primary"
                                        style="padding: 6px 14px; font-size: 13px; font-weight: 500;">Xem chi tiết</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Hiển thị khi trống -->
                <div th:if="${pendingApprovals.size() == 0}" class="empty-state-nice">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor"
                        viewBox="0 0 16 16">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z" />
                        <path
                            d="M10.97 4.97a.235.235 0 0 0-.02.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-1.071-1.05z" />
                    </svg>
                    <h3>Tuyệt vời!</h3>
                    <p>Hiện tại không có yêu cầu nào đang chờ bạn xử lý.</p>
                </div>

            </div>
        </div>

    </main>

</body>

</html>
