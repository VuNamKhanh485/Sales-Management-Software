<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết hóa đơn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>body { padding: 10px; background-color: #f8f9fa; }</style>
</head>
<body>
    <div class="mt-1 mb-3">
        <button class="btn btn-secondary btn-sm" onclick="window.history.back()">
            <i class="bi bi-arrow-left"></i> Quay lại danh sách
        </button>
    </div>
    <div class="bg-white p-4 shadow-sm rounded border receipt-container text-dark" style="font-family: 'Courier New', Courier, monospace; font-size: 13px; line-height: 1.4;">
        <div class="text-center mb-3">
            <h5 class="fw-bold mb-1" style="font-family: inherit;" th:text="${branchName}">SMS STORE</h5>
            <p class="mb-0 text-muted" style="font-size: 11px;" th:text="${branchAddress}">Địa chỉ</p>
            <p class="mb-0 text-muted" style="font-size: 11px;" th:text="'SĐT: ' + ${branchPhone}">SĐT</p>
            <div class="my-2" style="border-top: 1px dashed #ccc;"></div>
            <h6 class="fw-bold my-2" style="font-family: inherit;">HÓA ĐƠN BÁN HÀNG</h6>
        </div>
        
        <p class="mb-1"><strong>Mã hóa đơn:</strong> <span th:text="${order.code}"></span></p>
        <p class="mb-1"><strong>Ngày tạo:</strong> <span th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>
        <p class="mb-1"><strong>Khách hàng:</strong> <span th:text="${order.customer != null ? order.customer.fullName : 'Khách lẻ'}"></span></p>
        <div class="my-2" style="border-top: 1px dashed #ccc;"></div>
        
        <table class="w-100 mb-2" style="font-size: 12px; border-collapse: collapse;">
            <thead>
                <tr style="border-bottom: 1px solid #ddd;">
                    <th class="text-start pb-1">Tên SP</th>
                    <th class="text-center pb-1" style="width: 40px;">SL</th>
                    <th class="text-end pb-1" style="width: 80px;">Đơn giá</th>
                    <th class="text-end pb-1" style="width: 80px;">T.Tiền</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${order.details}">
                    <td class="py-1 text-start" th:text="${item.productUnit.product.name}"></td>
                    <td class="py-1 text-center" th:text="${item.quantity}"></td>
                    <td class="py-1 text-end" th:text="${#numbers.formatDecimal(item.salePrice, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td>
                    <td class="py-1 text-end" th:text="${#numbers.formatDecimal(item.totalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td>
                </tr>
            </tbody>
        </table>
        
        <div class="my-2" style="border-top: 1px dashed #ccc;"></div>
        <div class="d-flex justify-content-between mb-1">
            <span>Tổng tiền hàng:</span>
            <span th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
        </div>
        <div th:if="${order.discountAmount.compareTo(T(java.math.BigDecimal).ZERO) > 0}" class="d-flex justify-content-between mb-1 text-danger">
            <span>Giảm giá:</span>
            <span th:text="'-' + ${#numbers.formatDecimal(order.discountAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
        </div>
        <div class="d-flex justify-content-between mb-1">
            <span>Thuế VAT (2%):</span>
            <span th:text="${#numbers.formatDecimal(order.finalAmount.add(order.discountAmount).subtract(order.totalAmount), 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
        </div>
        <div class="d-flex justify-content-between mb-1 fw-bold text-primary" style="font-size: 14px;">
            <span>KHÁCH PHẢI TRẢ:</span>
            <span th:text="${#numbers.formatDecimal(order.finalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
        </div>
        <div class="d-flex justify-content-between mb-1">
            <span>Tiền khách đưa:</span>
            <span th:text="${#numbers.formatDecimal(order.paidAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
        </div>
        <div class="d-flex justify-content-between mb-1 text-success fw-bold">
            <span>Tiền thừa:</span>
            <span th:text="${#numbers.formatDecimal(order.changeAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
        </div>
        <div class="my-2" style="border-top: 1px dashed #ccc;"></div>
        <div class="text-center mt-3 small text-muted">
            <p class="mb-0">Cảm ơn quý khách. Hẹn gặp lại!</p>
        </div>
    </div>
</body>
</html>
