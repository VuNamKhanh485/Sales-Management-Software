<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu cầu trả hàng — SMS</title>
    <meta name="description" content="Tạo yêu cầu trả/đổi hàng trong hệ thống SMS.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/core/apple-design.css}">
    <link rel="stylesheet" th:href="@{/css/order/return.css}">
</head>
<body>
    <!-- ── Global Nav ── -->
    <div th:replace="~{component/navbar :: global-nav('return')}"></div>

    <main class="return-container">
        <div class="card-panel">
            <div style="margin-bottom: var(--sp-xl);">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                    <a href="javascript:history.back()" style="color: var(--primary); text-decoration: none; font-size: 14px; font-weight: 400;">Quay lại</a>
                </div>
                <h1 class="t-display-md mb-2">Yêu cầu trả / đổi hàng</h1>
                <p class="t-body" style="color: var(--ink-muted-48);" th:text="${autoOrderCode != null ? 'Đã có mã đơn hàng' : 'Nhập mã đơn hàng để bắt đầu'}"></p>
            </div>

            <!-- Thông báo lỗi/thành công -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle me-1"></i><span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Bước 1: Tìm đơn hàng (Form GET) -->
                <form method="GET" action="/return" class="search-section" style="margin-bottom: var(--sp-lg);">
                    <label class="t-body-strong mb-2" style="display: block;"><i class="bi bi-search me-1"></i>Tìm đơn hàng</label>
                    <div style="display: flex; gap: var(--sp-sm); align-items: center;">
                        <input type="text" name="orderCode" class="search-input"
                               placeholder="Nhập mã đơn hàng (VD: ORD-2025...)"
                               th:value="${autoOrderCode}" style="flex: 1;">
                        <button type="submit" class="btn-primary">
                            <i class="bi bi-search me-1"></i>Tìm
                        </button>
                    </div>
                </form>

                <!-- Kết quả tìm kiếm -->
                <div th:if="${order != null}" class="mt-3">
                    <div class="order-info">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="fw-bold mb-1" th:text="${order.code}"></h6>
                                <small class="text-muted" th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
                            </div>
                            <span class="badge bg-success" th:if="${order.status == 'COMPLETED'}">Hoàn thành</span>
                            <span class="badge bg-warning" th:unless="${order.status == 'COMPLETED'}" th:text="${order.status == 'PENDING' ? 'Chờ xử lý' : (order.status == 'CANCELLED' ? 'Đã hủy' : (order.status == 'RETURNED' ? 'Đã trả hàng' : order.status))}"></span>
                        </div>
                        <p class="mb-0 mt-1">
                            <i class="bi bi-person me-1"></i>
                            <span th:text="${order.customer != null ? order.customer.fullName : 'Khách lẻ'}"></span>
                        </p>
                    </div>

                    <!-- Bước 2: Form gửi yêu cầu trả hàng (Form POST) -->
                    <form method="POST" th:action="@{/return/create}" enctype="multipart/form-data" class="mt-3">
                        <input type="hidden" name="orderId" th:value="${order.id}">

                        <div class="mb-3">
                            <label class="fw-semibold mb-2"><i class="bi bi-box-seam me-1"></i>Chọn sản phẩm muốn trả</label>
                            <div id="productList">
                                <div th:each="detail : ${order.details}" class="item-check d-flex align-items-center gap-3 mb-2">
                                    <input type="checkbox" class="form-check-input item-cb"
                                           name="detailIds" th:value="${detail.id}" checked>
                                    <div class="flex-grow-1">
                                        <div class="fw-semibold small" th:text="${detail.productUnit.product.name} + (${detail.productUnit.unit != null} ? ' (' + ${detail.productUnit.unit.name} + ')' : '')"></div>
                                        <small class="text-muted">
                                            SL: <span th:text="${detail.quantity}"></span> |
                                            Giá: <span th:text="${#numbers.formatDecimal(detail.salePrice, 0, 'COMMA', 0, 'POINT')}"></span>đ
                                        </small>
                                    </div>
                                    <div>
                                        <label class="small text-muted mb-0">SL trả:</label>
                                        <input type="number" class="form-control form-control-sm qty-input"
                                               style="width:70px"
                                               name="quantities"
                                               th:value="${detail.quantity}"
                                               min="1" th:max="${detail.quantity}">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="fw-semibold mb-1"><i class="bi bi-pencil me-1"></i>Lý do trả hàng <span class="text-danger">*</span></label>
                            <textarea name="reason" class="form-control reason-box" placeholder="Mô tả lý do trả hàng..." required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="fw-semibold mb-2"><i class="bi bi-camera me-1"></i>Hình ảnh sản phẩm lỗi <span class="text-muted">(không bắt buộc)</span></label>
                            <input type="file" name="images" multiple accept="image/*" class="form-control" onchange="previewImages(this)">
                            
                            <!-- Preview khu vực ảnh -->
                            <div id="previewContainer" class="d-flex flex-wrap gap-2 mt-3" style="display:none;"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-send me-1"></i>Gửi yêu cầu trả hàng
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/order/return-request.js}"></script>
</body>
</html>
