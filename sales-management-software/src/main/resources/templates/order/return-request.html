<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu cầu trả hàng — SMS</title>
    <meta name="description" content="Tạo yêu cầu trả/đổi hàng trong hệ thống SMS.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/return.css}">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-arrow-return-left fs-4"></i>
                    <div>
                        <h5 class="mb-0 fw-bold">Yêu cầu trả / đổi hàng</h5>
                        <small class="opacity-75" th:text="${autoOrderCode != null ? 'Đã có mã đơn hàng' : 'Nhập mã đơn hàng để bắt đầu'}"></small>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <!-- Thông báo lỗi/thành công -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle me-1"></i><span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Bước 1: Tìm đơn hàng (Form GET) -->
                <form method="GET" action="/return" class="search-section">
                    <label class="fw-semibold mb-2"><i class="bi bi-search me-1"></i>Tìm đơn hàng</label>
                    <div class="search-input-group">
                        <input type="text" name="orderCode" class="form-control"
                               placeholder="Nhập mã đơn hàng (VD: ORD-2025...)"
                               th:value="${autoOrderCode}">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-search me-1"></i>Tìm
                        </button>
                    </div>
                </form>

                <!-- Kết quả tìm kiếm -->
                <div th:if="${order != null}" class="mt-3">
                    <div class="order-info">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="fw-bold mb-1" th:text="${order.code}"></h6>
                                <small class="text-muted" th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
                            </div>
                            <span class="badge bg-success" th:if="${order.status == 'COMPLETED'}">COMPLETED</span>
                            <span class="badge bg-warning" th:unless="${order.status == 'COMPLETED'}" th:text="${order.status}"></span>
                        </div>
                        <p class="mb-0 mt-1">
                            <i class="bi bi-person me-1"></i>
                            <span th:text="${order.customer != null ? order.customer.fullName : 'Khách lẻ'}"></span>
                        </p>
                    </div>

                    <!-- Bước 2: Form gửi yêu cầu trả hàng (Form POST) -->
                    <form method="POST" th:action="@{/return/create}" enctype="multipart/form-data" class="mt-3">
                        <input type="hidden" name="orderId" th:value="${order.id}">

                        <div class="mb-3">
                            <label class="fw-semibold mb-2"><i class="bi bi-box-seam me-1"></i>Chọn sản phẩm muốn trả</label>
                            <div id="productList">
                                <div th:each="detail : ${order.details}" class="item-check d-flex align-items-center gap-3 mb-2">
                                    <input type="checkbox" class="form-check-input item-cb"
                                           name="detailIds" th:value="${detail.id}" checked>
                                    <div class="flex-grow-1">
                                        <div class="fw-semibold small" th:text="${detail.productUnit.product.name}"></div>
                                        <small class="text-muted">
                                            SL: <span th:text="${detail.quantity}"></span> |
                                            Giá: <span th:text="${#numbers.formatDecimal(detail.salePrice, 0, 'COMMA', 0, 'POINT')}"></span>đ
                                        </small>
                                    </div>
                                    <div>
                                        <label class="small text-muted mb-0">SL trả:</label>
                                        <input type="number" class="form-control form-control-sm qty-input"
                                               style="width:70px"
                                               name="quantities"
                                               th:value="${detail.quantity}"
                                               min="1" th:max="${detail.quantity}">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="fw-semibold mb-1"><i class="bi bi-pencil me-1"></i>Lý do trả hàng <span class="text-danger">*</span></label>
                            <textarea name="reason" class="form-control reason-box" placeholder="Mô tả lý do trả hàng..." required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="fw-semibold mb-2"><i class="bi bi-camera me-1"></i>Hình ảnh sản phẩm lỗi <span class="text-muted">(không bắt buộc)</span></label>
                            <input type="file" name="images" multiple accept="image/*" class="form-control" onchange="previewImages(this)">
                            
                            <!-- Preview khu vực ảnh -->
                            <div id="previewContainer" class="d-flex flex-wrap gap-2 mt-3" style="display:none;"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-send me-1"></i>Gửi yêu cầu trả hàng
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentUrls = [];

        function previewImages(input) {
            const container = document.getElementById('previewContainer');
            container.innerHTML = '';
            
            // Hủy các đường dẫn tạm cũ để giải phóng RAM
            currentUrls.forEach(url => URL.revokeObjectURL(url));
            currentUrls = [];

            if (input.files && input.files.length > 0) {
                container.style.display = 'flex';
                Array.from(input.files).forEach(file => {
                    const url = URL.createObjectURL(file);
                    currentUrls.push(url);

                    const div = document.createElement('div');
                    div.style.position = 'relative';
                    div.style.width = '100px';
                    div.style.height = '100px';
                    
                    const img = document.createElement('img');
                    img.src = url;
                    img.className = 'w-100 h-100 object-fit-cover rounded border';
                    
                    div.appendChild(img);
                    container.appendChild(div);
                });
            } else {
                container.style.display = 'none';
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            const checkboxes = document.querySelectorAll('.item-cb');
            checkboxes.forEach(cb => {
                const toggleInput = () => {
                    const qtyInput = cb.closest('.item-check').querySelector('.qty-input');
                    if (qtyInput) {
                        qtyInput.disabled = !cb.checked;
                    }
                };
                cb.addEventListener('change', toggleInput);
                toggleInput(); // Run on init
            });
        });
    </script>
</body>
</html>
