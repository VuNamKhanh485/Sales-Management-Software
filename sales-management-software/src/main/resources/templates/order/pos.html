<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quản lý bán hàng - POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/pos.css}" rel="stylesheet">
</head>
<body>
<div class="d-flex">

    <!-- SIDEBAR -->
    <div th:replace="~{component/navbar :: sidebar-component}" th:with="page='pos'"></div>

    <!-- NỘI DUNG CHÍNH -->
    <div class="flex-grow-1 d-flex flex-column" style="min-height: 100vh;">

        <!-- Top bar -->
        <div class="bg-white border-bottom px-4 py-2 d-flex justify-content-between align-items-center">
            <div>
                <span class="text-muted small">Admin Panel /</span>
                <span class="fw-bold ms-1">Quản lý bán hàng</span>
            </div>
            <!-- Quét SKU/barcode dùng GET thay POST -->
            <form th:action="@{/pos/add}" method="GET" class="d-flex gap-2">
                <input type="text" name="keyword"
                       class="form-control form-control-sm"
                       placeholder="Quét SKU / barcode..."
                       style="width: 220px;" autofocus>
                <button type="submit" class="btn btn-primary btn-sm">
                    <i class="bi bi-upc-scan"></i>
                </button>
            </form>
        </div>

        <!-- Flash messages -->
        <div th:if="${error}"
             class="alert alert-danger alert-dismissible mx-3 mt-2 py-2" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${success}"
             class="alert alert-success alert-dismissible mx-3 mt-2 py-2" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex flex-grow-1">

            <!-- ========== LEFT: Product Grid ========== -->
            <div class="flex-grow-1 p-3">

                <!-- Category tabs -->
                <ul class="nav category-tabs mb-3 flex-wrap">
                    <li class="nav-item">
                        <a class="nav-link"
                           th:classappend="${selectedCategoryId == null} ? 'active'"
                           th:href="@{/pos}">Tất cả</a>
                    </li>
                    <li class="nav-item" th:each="cat : ${categories}">
                        <a class="nav-link"
                           th:classappend="${selectedCategoryId != null and selectedCategoryId == cat.id} ? 'active'"
                           th:href="@{/pos(categoryId=${cat.id})}"
                           th:text="${cat.name}"></a>
                    </li>
                </ul>

                <!-- Search -->
                <form th:action="@{/pos}" method="GET" class="d-flex gap-2 mb-3">
                    <input type="text" name="keyword" th:value="${keyword}"
                           class="form-control form-control-sm"
                           placeholder="Tìm theo tên sản phẩm...">
                    <button type="submit" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-search"></i> Tìm
                    </button>
                    <a th:if="${keyword != null and !#strings.isEmpty(keyword)}"
                       th:href="@{/pos}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-x"></i> Xóa
                    </a>
                </form>

                <!-- Product grid -->
                <div class="product-grid-wrapper">
                    <div class="row g-2">
                        <div class="col-6 col-md-4 col-lg-3"
                             th:each="pu : ${products}">
                            <div class="card h-100 border-0 product-card rounded position-relative">
                                <!-- Badge tồn kho -->
                                <span class="badge bg-success position-absolute"
                                      style="top:6px;left:6px;font-size:10px;z-index:1">
                                    Còn hàng
                                </span>
                                <!-- Ảnh bấm được -->
                                <a th:href="@{/pos/add-by-id(productUnitId=${pu.id})}"
                                   style="text-decoration:none">
                                    <img th:src="${pu.product.imageUrl != null ?
                                            pu.product.imageUrl :
                                            'https://via.placeholder.com/150x100?text=No+Image'}"
                                         class="card-img-top rounded-top"
                                         alt="product"
                                         style="height:120px;object-fit:cover">
                                </a>
                                <div class="card-body p-2">
                                    <div class="small fw-semibold text-truncate"
                                         th:text="${pu.product.name}"></div>
                                    <div class="text-muted" style="font-size:11px"
                                         th:text="'Mã: ' + ${pu.sku}"></div>
                                    <div class="d-flex justify-content-between align-items-center mt-1">
                                        <div class="product-price small fw-bold"
                                             th:text="${#numbers.formatDecimal(pu.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">
                                        </div>
                                        <!-- Nút thêm vào giỏ -->
                                        <a th:href="@{/pos/add-by-id(productUnitId=${pu.id})}"
                                           class="btn btn-primary btn-sm"
                                           style="width:30px;height:30px;padding:0;line-height:28px;text-align:center">
                                            <i class="bi bi-cart-plus" style="font-size:13px"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div th:if="${#lists.isEmpty(products)}"
                             class="col-12 text-center text-muted py-5">
                            <i class="bi bi-box-seam fs-1"></i>
                            <p class="mt-2">Không tìm thấy sản phẩm nào</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ========== RIGHT: Invoice Panel ========== -->
            <div class="invoice-panel" style="width: 360px; min-width: 360px;">

                <!-- Header -->
                <div class="invoice-header d-flex justify-content-between align-items-center">
                    <div>
                        <i class="bi bi-receipt me-1"></i>
                        <span class="fw-bold">Hóa đơn hiện tại</span>
                    </div>
                    <a th:href="@{/pos/clear}"
                       class="btn btn-sm btn-outline-light"
                       onclick="return confirm('Xóa toàn bộ giỏ hàng?')">
                        <i class="bi bi-trash"></i> Xóa hết
                    </a>
                </div>

                <!-- Customer section -->
                <div class="px-3 pt-2 pb-2 border-bottom">
                    <div th:if="${cart.customerId == null}">
                        <div class="d-flex gap-2 mb-1">
                            <input type="text" id="customerPhone"
                                   class="form-control form-control-sm"
                                   placeholder="SĐT khách hàng...">
                            <button class="btn btn-outline-primary btn-sm px-2"
                                    onclick="findCustomer()" title="Tìm khách">
                                <i class="bi bi-search"></i>
                            </button>
                            <!-- Nút thêm khách hàng mới -->
                            <a th:href="@{/customers/create}"
                               class="btn btn-outline-success btn-sm px-2"
                               target="_blank" title="Thêm khách mới">
                                <i class="bi bi-person-plus"></i>
                            </a>
                        </div>
                        <div id="customerResult"></div>
                    </div>
                    <div th:unless="${cart.customerId == null}"
                         class="customer-badge d-flex justify-content-between align-items-center">
                        <div>
                            <i class="bi bi-person-fill text-primary me-1"></i>
                            <span class="fw-semibold small"
                                  th:text="${cart.customerName}"></span>
                            <div class="text-muted" style="font-size:11px"
                                 th:text="${cart.customerPhone}"></div>
                        </div>
                        <a th:href="@{/pos/remove-customer}"
                           class="btn btn-sm btn-outline-danger">
                            <i class="bi bi-x"></i>
                        </a>
                    </div>
                </div>

                <!-- Cart items -->
                <div class="invoice-items">
                    <div th:if="${#lists.isEmpty(cart.items)}"
                         class="text-center text-muted py-4">
                        <i class="bi bi-cart fs-2"></i>
                        <p class="small mt-1">Chưa có sản phẩm</p>
                    </div>
                    <div th:each="item, stat : ${cart.items}" class="cart-item">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="flex-grow-1 me-2">
                                <div class="small fw-semibold text-truncate"
                                     th:text="${item.name}"></div>
                                <div class="text-muted" style="font-size:11px"
                                     th:text="${item.sku} + ' | ' + ${item.unitName}"></div>
                                <div class="text-primary small fw-bold"
                                     th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-1">
                                <!-- Giảm số lượng -->
                                <a th:href="@{/pos/update-qty(index=${stat.index},quantity=${item.quantity - 1})}"
                                   class="btn btn-sm btn-outline-secondary"
                                   style="width:26px;height:26px;padding:0;line-height:24px;text-align:center">-</a>

                                <span class="fw-bold small"
                                      style="min-width:24px;text-align:center"
                                      th:text="${item.quantity}"></span>

                                <!-- Tăng số lượng -->
                                <a th:href="@{/pos/update-qty(index=${stat.index},quantity=${item.quantity + 1})}"
                                   class="btn btn-sm btn-outline-primary"
                                   style="width:26px;height:26px;padding:0;line-height:24px;text-align:center">+</a>

                                <!-- Xóa item -->
                                <a th:href="@{/pos/remove(index=${stat.index})}"
                                   class="btn btn-sm btn-outline-danger"
                                   style="width:26px;height:26px;padding:0;line-height:24px;text-align:center">
                                    <i class="bi bi-trash" style="font-size:11px"></i>
                                </a>
                            </div>
                        </div>
                        <div class="text-end small text-muted mt-1">
                            = <span class="text-dark fw-semibold"
                                    th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <div class="invoice-footer">

                    <!-- Voucher -->
                    <div class="mb-2">
                        <div th:if="${cart.voucherCode == null}" class="d-flex gap-2">
                            <input type="text" id="voucherCode"
                                   class="form-control form-control-sm"
                                   placeholder="Nhập mã giảm giá...">
                            <button class="btn btn-outline-primary btn-sm"
                                    onclick="applyVoucher()">Áp dụng</button>
                        </div>
                        <div th:unless="${cart.voucherCode == null}"
                             class="d-flex justify-content-between align-items-center
                                    bg-success bg-opacity-10 rounded p-2">
                            <div class="small text-success">
                                <i class="bi bi-tag-fill me-1"></i>
                                <span th:text="${cart.voucherCode}"></span>
                            </div>
                            <a th:href="@{/pos/remove-voucher}"
                               class="btn btn-sm btn-outline-danger py-0">
                                <i class="bi bi-x"></i>
                            </a>
                        </div>
                        <div id="voucherMsg" class="small mt-1"></div>
                    </div>

                    <!-- Summary -->
                    <div class="mb-2">
                        <div class="summary-row">
                            <span>Tổng tiền hàng</span>
                            <span th:text="${#numbers.formatDecimal(cart.totalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
                        </div>
                        <div class="summary-row text-danger">
                            <span>Giảm giá (voucher)</span>
                            <span th:text="'- ' + ${#numbers.formatDecimal(cart.voucherDiscount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
                        </div>
                        <div class="summary-row">
                            <span>Thuế VAT (8%)</span>
                            <span th:text="${#numbers.formatDecimal(cart.vatAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
                        </div>
                        <div class="summary-row total">
                            <span>Khách phải trả</span>
                            <span th:text="${#numbers.formatDecimal(cart.finalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
                        </div>
                    </div>

                    <!-- Checkout form -->
                    <form th:action="@{/pos/checkout}" method="POST">

                        <!-- Payment method -->
                        <div class="mb-2">
                            <label class="form-label small fw-semibold mb-1">
                                Phương thức thanh toán
                            </label>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio"
                                           name="paymentMethodId" value="1"
                                           id="pmCash" checked>
                                    <label class="form-check-label small" for="pmCash">
                                        <i class="bi bi-cash"></i> Tiền mặt
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio"
                                           name="paymentMethodId" value="2"
                                           id="pmTransfer">
                                    <label class="form-check-label small" for="pmTransfer">
                                        <i class="bi bi-qr-code"></i> Chuyển khoản
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Tiền khách đưa -->
                        <div class="mb-2">
                            <label class="form-label small fw-semibold mb-1">
                                Tiền khách đưa
                            </label>
                            <input type="number" name="givenAmount" id="givenAmount"
                                   class="form-control form-control-sm"
                                   th:value="${cart.finalAmount}"
                                   min="0" step="1000"
                                   oninput="calcChange()">
                            <div class="d-flex flex-wrap gap-1 mt-1"
                                 id="amountSuggestions"></div>
                        </div>

                        <!-- Tiền thừa -->
                        <div class="summary-row mb-2">
                            <span class="small">Tiền thừa trả khách</span>
                            <span class="fw-bold text-success" id="changeDisplay">0đ</span>
                        </div>

                        <!-- Ghi chú -->
                        <div class="mb-2">
                            <input type="text" name="note"
                                   class="form-control form-control-sm"
                                   placeholder="Ghi chú đơn hàng...">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold mb-2">
                            <i class="bi bi-check-circle me-1"></i>
                            XÁC NHẬN THANH TOÁN
                        </button>
                    </form>

                    <!-- Yêu cầu hoàn trả -->
                    <a th:href="@{/orders}"
                       class="btn btn-outline-warning btn-sm w-100">
                        <i class="bi bi-arrow-return-left me-1"></i>
                        Xem đơn hàng / Hoàn trả
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const finalAmount = /*[[${cart.finalAmount}]]*/ 0;
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/pos.js}"></script>
</body>
</html>
