<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4" style="max-width: 800px;">

    <!-- Nút quay lại -->
    <a th:if="${order.customer != null}"
       th:href="@{/customers/detail/{id}(id=${order.customer.id})}"
       class="btn btn-outline-secondary mb-3">&larr; Quay lại</a>
    <a th:unless="${order.customer != null}"
       th:href="@{/customers}"
       class="btn btn-outline-secondary mb-3">&larr; Quay lại</a>

    <!-- Header bill -->
    <div class="card shadow-sm mb-3">
        <div class="card-header bg-primary text-white d-flex justify-content-between">
            <h5 class="mb-0">Đơn hàng: <span th:text="${order.code}"></span></h5>
            <span class="badge"
                  th:classappend="${order.status == 'COMPLETED'} ? 'bg-success' :
                                 (${order.status == 'CANCELLED'} ? 'bg-danger' :
                                 (${order.status == 'PENDING'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                  th:text="${order.status}">
            </span>
        </div>
        <div class="card-body row">
            <div class="col-md-6">
                <p><strong>Ngày tạo:</strong>
                    <span th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>
                <p><strong>Khách hàng:</strong>
                    <span th:text="${order.customer != null ? order.customer.fullName : 'Khách lẻ'}"></span></p>
                <p><strong>SĐT:</strong>
                    <span th:text="${order.customer != null ? order.customer.phone : '—'}"></span></p>
            </div>
            <div class="col-md-6">
                <p><strong>Mã voucher:</strong>
                    <span th:text="${order.voucher != null ? order.voucher.code : '—'}"></span></p>
                <p><strong>Ghi chú:</strong>
                    <span th:text="${order.note != null ? order.note : '—'}"></span></p>
            </div>
        </div>
    </div>

    <!-- Danh sách sản phẩm -->
    <div class="card shadow-sm mb-3">
        <div class="card-header"><h6 class="mb-0">Sản phẩm</h6></div>
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Sản phẩm</th>
                    <th>Đơn vị</th>
                    <th class="text-center">SL</th>
                    <th class="text-end">Đơn giá</th>
                    <th class="text-end">Giảm giá</th>
                    <th class="text-end">Thành tiền</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="detail : ${order.details}">
                    <td th:text="${detail.productUnit.product.name}"></td>
                    <td th:text="${detail.productUnit.unit.name}"></td>
                    <td class="text-center" th:text="${detail.quantity}"></td>
                    <td class="text-end"
                        th:text="${#numbers.formatDecimal(detail.salePrice, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td>
                    <td class="text-end"
                        th:text="${#numbers.formatDecimal(detail.discountAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td>
                    <td class="text-end"
                        th:text="${#numbers.formatDecimal(detail.totalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Tổng tiền -->
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="row justify-content-end">
                <div class="col-md-5">
                    <table class="table table-borderless mb-0">
                        <tr>
                            <td>Tổng tiền hàng:</td>
                            <td class="text-end fw-bold"
                                th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td>
                        </tr>
                        <tr>
                            <td>Giảm giá:</td>
                            <td class="text-end text-danger"
                                th:text="'- ' + ${#numbers.formatDecimal(order.discountAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td>
                        </tr>
                        <tr class="border-top">
                            <td><strong>Khách phải trả:</strong></td>
                            <td class="text-end fw-bold text-primary fs-5"
                                th:text="${#numbers.formatDecimal(order.finalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td>
                        </tr>
                        <tr>
                            <td>Tiền khách đưa:</td>
                            <td class="text-end"
                                th:text="${#numbers.formatDecimal(order.paidAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td>
                        </tr>
                        <tr>
                            <td>Tiền thừa:</td>
                            <td class="text-end"
                                th:text="${#numbers.formatDecimal(order.changeAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
