<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/apple-design.css}" rel="stylesheet">
    <link th:href="@{/css/pos-product-list.css}" rel="stylesheet">
</head>
<body>
    <form th:action="@{/pos/product-list}" method="GET" class="d-flex gap-2 mb-3 flex-wrap">
        <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-sm" placeholder="Tìm theo tên, SKU..." style="max-width:250px">
        <select name="categoryId" class="form-select form-select-sm" style="max-width:180px" onchange="this.form.submit()">
            <option value="">Tất cả danh mục</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == categoryId}"></option>
        </select>
        <button type="submit" class="btn btn-primary btn-sm px-3">Tìm kiếm</button>
    </form>

    <div class="row g-2">
        <div th:if="${#lists.isEmpty(products)}" class="col-12 text-center text-muted py-3">
            Không tìm thấy sản phẩm
        </div>
        <div th:each="p : ${products}" class="col-6 col-md-4 col-lg-3">
            <a th:href="@{/pos/add-by-id(productUnitId=${p.id})}" target="_parent" class="product-card-modal text-decoration-none">
                <img th:src="${p.product.imageUrl != null ? p.product.imageUrl : 'https://via.placeholder.com/150x80?text=No+Image'}" alt="Img">
                <div class="p-2">
                    <div class="small fw-semibold text-truncate" 
                         th:text="${p.product.name} + ' (' + (${p.unit != null ? p.unit.name : 'Mặc định'}) + ')'"
                         th:title="${p.product.name} + ' (' + (${p.unit != null ? p.unit.name : 'Mặc định'}) + ')'"></div>
                    <div class="text-muted" style="font-size:10px" th:text="${p.sku}"></div>
                    <div class="d-flex justify-content-between align-items-center mt-1">
                        <span class="text-primary fw-bold small" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
                        <span class="badge rounded-pill" 
                              th:classappend="${(stockMap.get(p.id) != null ? stockMap.get(p.id) : 0) > 0 ? 'bg-success' : 'bg-danger'}"
                              style="font-size: 10px;" 
                              th:text="'Tồn: ' + ${(stockMap.get(p.id) != null ? stockMap.get(p.id) : 0)}"></span>
                    </div>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
