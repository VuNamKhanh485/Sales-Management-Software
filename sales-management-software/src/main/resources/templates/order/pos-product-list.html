<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/apple-design.css}" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 15px; }
        .product-card-modal {
            background: #fff; border-radius: 8px; border: 1px solid #dee2e6;
            overflow: hidden; cursor: pointer; transition: 0.2s; height: 100%;
        }
        .product-card-modal:hover { border-color: #0d6efd; box-shadow: 0 4px 8px rgba(0,0,0,0.1); transform: translateY(-2px); }
        .product-card-modal img { width: 100%; height: 80px; object-fit: contain; background: #f8f9fa; border-bottom: 1px solid #dee2e6; }
    </style>
</head>
<body>
    <form th:action="@{/pos/product-list}" method="GET" class="d-flex gap-2 mb-3 flex-wrap">
        <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-sm" placeholder="Tìm theo tên, SKU..." style="max-width:250px">
        <select name="categoryId" class="form-select form-select-sm" style="max-width:180px" onchange="this.form.submit()">
            <option value="">Tất cả danh mục</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == categoryId}"></option>
        </select>
        <button type="submit" class="btn btn-primary btn-sm px-3">Tìm kiếm</button>
    </form>

    <div class="row g-2">
        <div th:if="${#lists.isEmpty(products)}" class="col-12 text-center text-muted py-3">
            Không tìm thấy sản phẩm
        </div>
        <div th:each="p : ${products}" class="col-6 col-md-4 col-lg-3">
            <div class="product-card-modal" th:onclick="'window.parent.location.href=\'/pos/add-by-id?productUnitId=' + ${p.id} + '\''">
                <img th:src="${p.product.imageUrl != null ? p.product.imageUrl : 'https://via.placeholder.com/150x80?text=No+Image'}" alt="Img">
                <div class="p-2">
                    <div class="small fw-semibold text-truncate" th:text="${p.product.name}"></div>
                    <div class="text-muted" style="font-size:10px" th:text="${p.sku}"></div>
                    <div class="text-primary fw-bold small" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + 'đ'"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
