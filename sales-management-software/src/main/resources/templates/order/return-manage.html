<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý yêu cầu trả hàng — SMS</title>
    <meta name="description" content="Quản lý và duyệt yêu cầu trả/đổi hàng.">
    <!-- Keep Bootstrap for Modal JS functionality, but we will override styles with apple-design -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/core/apple-design.css}">
    <style>
        .page-layout {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 var(--sp-lg);
        }
        
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .header-title {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 600;
            color: var(--ink);
            margin: 0 0 4px 0;
            letter-spacing: -0.5px;
        }
        
        .header-subtitle {
            font-size: 15px;
            color: var(--ink-muted-48);
            margin: 0;
        }
        
        /* Modal overrides for Apple design */
        .modal-content {
            border: none;
            border-radius: var(--r-xl);
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .modal-header {
            background: var(--surface-pearl);
            border-bottom: 1px solid var(--hairline);
            padding: 20px 24px;
        }
        .modal-title {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 600;
            color: var(--ink);
        }
        .modal-body {
            padding: 24px;
        }
        .modal-footer {
            border-top: 1px solid var(--hairline);
            padding: 16px 24px;
            background: var(--canvas);
        }
        
        .detail-label {
            font-size: 13px;
            color: var(--ink-muted-48);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }
        .detail-value {
            font-size: 15px;
            color: var(--ink);
            font-weight: 500;
            margin-bottom: 16px;
        }
        
        .item-table th {
            font-size: 12px;
            color: var(--ink-muted-48);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--hairline);
            padding-bottom: 8px;
        }
        .item-table td {
            font-size: 14px;
            color: var(--ink);
            padding: 12px 0;
            border-bottom: 1px solid var(--hairline);
        }
    </style>
</head>

<body>
    <div th:replace="~{component/navbar :: global-nav('returns')}"></div>
    
    <main class="page-layout">
        
        <!-- Thông báo -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert" style="border-radius: var(--r-md); background: #fee2e2; border: 1px solid #fecaca; color: #991b1b; padding: 16px; margin-bottom: 24px;">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert" style="border-radius: var(--r-md); background: #dcfce7; border: 1px solid #bbf7d0; color: #166534; padding: 16px; margin-bottom: 24px;">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="header-section">
            <div>
                <h1 class="header-title">Quản lý yêu cầu trả hàng</h1>
                <p class="header-subtitle">Tổng cộng <span th:text="${#lists.size(requests)}">0</span> yêu cầu trong hệ thống</p>
            </div>
            
            <div th:if="${pendingCount > 0}" style="background: rgba(255, 159, 10, 0.1); color: var(--warning); padding: 8px 16px; border-radius: var(--r-pill); font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255, 159, 10, 0.2);">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71V3.5z"/>
                    <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0z"/>
                </svg>
                <span th:text="${pendingCount}">0</span> yêu cầu chờ duyệt
            </div>
        </div>

        <div class="card-panel" style="padding: 0; overflow: hidden;">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px; text-align: center;">STT</th>
                            <th>Mã yêu cầu</th>
                            <th>Đơn hàng</th>
                            <th>Người tạo</th>
                            <th>Lý do</th>
                            <th>Ngày tạo</th>
                            <th>Trạng thái</th>
                            <th style="text-align: right; padding-right: 24px;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="req, i : ${requests}">
                            <td style="text-align: center; color: var(--ink-muted-48);" th:text="${i.index + 1}">1</td>
                            <td style="font-weight: 600; color: var(--primary);">#<span th:text="${req.id}"></span></td>
                            <td th:text="${req.order.code}"></td>
                            <td th:text="${req.requestedBy}"></td>
                            <td style="max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-muted-80);" th:text="${req.reason}"></td>
                            <td th:text="${#temporals.format(req.createdAt, 'dd-MM-yyyy HH:mm')}"></td>
                            <td>
                                <span th:if="${req.status == 'PENDING'}" class="badge badge-inactive" style="background: rgba(255,159,10,0.1); color: var(--warning);">Chờ duyệt</span>
                                <span th:if="${req.status == 'APPROVED'}" class="badge badge-active">Đã duyệt</span>
                                <span th:if="${req.status == 'REJECTED'}" class="badge" style="background: #fee2e2; color: #991b1b;">Đã từ chối</span>
                            </td>
                            <td style="text-align: right; padding-right: 24px;">
                                <a th:href="@{/return/{id}(id=${req.id})}" class="btn-secondary btn-secondary--sm" style="white-space: nowrap;">
                                    Chi tiết
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(requests)}">
                            <td colspan="8" style="text-align: center; padding: 40px 0; color: var(--ink-muted-48);">Chưa có yêu cầu trả hàng nào</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</body>
</html>
