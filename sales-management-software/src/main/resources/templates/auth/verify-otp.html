<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Xác minh OTP - Sales Management Software</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <h1 class="h3 mb-2">
                            Xác minh mã OTP
                        </h1>

                        <p class="text-muted mb-0">
                            Nhập mã OTP gồm 6 chữ số đã được gửi đến email của bạn.
                        </p>
                    </div>

                    <div th:if="${infoMessage}"
                         class="alert alert-info"
                         role="alert">
                        <span th:text="${infoMessage}"></span>
                    </div>

                    <div th:if="${errorMessage}"
                         class="alert alert-danger"
                         role="alert">
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <div class="alert alert-warning"
                         role="alert">
                        Mã OTP có hiệu lực trong 5 phút.
                        Không chia sẻ mã này với bất kỳ ai.
                    </div>

                    <form th:action="@{/auth/verify-otp}"
                          th:object="${verifyOtpForm}"
                          method="post"
                          novalidate>

                        <!-- Phải nằm bên trong form có th:object -->
                        <div th:if="${#fields.hasGlobalErrors()}"
                             class="alert alert-danger"
                             role="alert">

                            <div th:each="error : ${#fields.globalErrors()}"
                                 th:text="${error}">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="otp"
                                   class="form-label">
                                Mã OTP
                                <span class="text-danger">*</span>
                            </label>

                            <input type="text"
                                   id="otp"
                                   th:field="*{otp}"
                                   class="form-control text-center fs-4"
                                   th:classappend="${#fields.hasErrors('otp')}
                                       ? 'is-invalid' : ''"
                                   placeholder="000000"
                                   maxlength="6"
                                   minlength="6"
                                   inputmode="numeric"
                                   pattern="[0-9]{6}"
                                   autocomplete="one-time-code"
                                   autofocus>

                            <div th:if="${#fields.hasErrors('otp')}"
                                 th:errors="*{otp}"
                                 class="invalid-feedback">
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit"
                                    class="btn btn-primary">
                                Xác nhận OTP
                            </button>
                        </div>

                        <div class="text-center">
                            <p class="text-muted mb-2">
                                Không nhận được mã hoặc mã đã hết hạn?
                            </p>

                            <a th:href="@{/auth/forgot-password}"
                               class="text-decoration-none">
                                Yêu cầu gửi lại mã OTP
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
