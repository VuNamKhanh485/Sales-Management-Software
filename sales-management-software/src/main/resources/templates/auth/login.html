<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">
        <span th:text="${successMessage}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Đóng">
        </button>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card shadow-sm">
                <div class="card-header text-center">
                    <h4>Đăng nhập hệ thống</h4>
                </div>

                <div class="card-body">

                    <div th:if="${loginError}" class="alert alert-danger" th:text="${loginError}"></div>

                    <form th:action="@{/auth/login}" th:object="${loginForm}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" th:field="*{email}" class="form-control">
                            <div class="text-danger" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mật khẩu</label>
                            <input type="password" th:field="*{password}" class="form-control">
                            <div class="text-danger" th:errors="*{password}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>

                    </form>

                    <div class="text-end mt-2">
                        <a th:href="@{/auth/forgot-password}"
                           class="text-decoration-none">
                            Quên mật khẩu?
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
