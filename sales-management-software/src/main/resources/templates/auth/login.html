<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link rel="stylesheet" th:href="@{/css/auth/login.css}">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <h2>Đăng nhập</h2>
        <p class="subtitle">Vui lòng nhập tài khoản của bạn</p>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Nhập email"
                        required>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Nhập mật khẩu"
                        required>
            </div>

            <div th:if="${loginError}" class="message error">
                <span th:text="${loginError}"></span>
            </div>

            <div th:if="${loginSuccess}" class="message success">
                <span th:text="${loginSuccess}"></span>
            </div>

            <button type="submit">Đăng nhập</button>
        </form>
    </div>
</div>

</body>
</html>
