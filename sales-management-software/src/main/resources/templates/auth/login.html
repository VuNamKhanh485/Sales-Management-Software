<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - SMS</title>
    <link rel="stylesheet" th:href="@{/css/core/apple-design.css}">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--canvas-alt); /* Light gray */
            font-family: var(--font-text);
            color: var(--ink);
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 24px;
        }

        .login-card {
            background: var(--canvas);
            border-radius: var(--r-2xl);
            padding: 48px 40px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04), 0 1px 4px rgba(0, 0, 0, 0.04);
        }

        .brand-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo h1 {
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 700;
            color: var(--primary); /* Blue tone */
            margin: 0;
            letter-spacing: -0.5px;
        }
        
        .brand-logo p {
            color: var(--ink-muted-48);
            font-size: 15px;
            margin-top: 8px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .form-input-clean {
            width: 100%;
            padding: 12px 16px;
            background: #ffffff;
            border: 1px solid var(--hairline);
            border-radius: var(--r-lg);
            color: var(--ink);
            font-size: 15px;
            transition: all 0.2s ease;
            box-sizing: border-box;
            font-family: var(--font-text);
        }

        .form-input-clean:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15); /* Soft blue ring */
        }

        .form-input-clean::placeholder {
            color: var(--ink-muted-24);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--r-lg);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 16px;
            font-family: var(--font-text);
        }

        .btn-login:hover {
            background-color: #005bb5; /* Slightly darker primary */
        }
        
        .btn-login:active {
            transform: scale(0.98);
        }

        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #ef4444;
            padding: 12px 16px;
            border-radius: var(--r-md);
            font-size: 14px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .alert-success-custom {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #10b981;
            padding: 12px 16px;
            border-radius: var(--r-md);
            font-size: 14px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .forgot-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            
            <div class="brand-logo">
                <h1>SMS</h1>
            </div>

            <div th:if="${successMessage}" class="alert-success-custom">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                <span th:text="${successMessage}"></span>
            </div>

            <div th:if="${loginError}" class="alert-error">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span th:text="${loginError}"></span>
            </div>

            <form th:action="@{/auth/login}" th:object="${loginForm}" method="post">
                <div style="margin-bottom: 20px;">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-input-clean" placeholder="Nhập địa chỉ email" required>
                </div>

                <div style="margin-bottom: 24px;">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" th:field="*{password}" class="form-input-clean" placeholder="Nhập mật khẩu" required>
                </div>

                <button type="submit" class="btn-login">Đăng nhập</button>
            </form>

            <a th:href="@{/auth/forgot-password}" class="forgot-link">Quên mật khẩu?</a>

        </div>
    </div>

</body>
</html>
