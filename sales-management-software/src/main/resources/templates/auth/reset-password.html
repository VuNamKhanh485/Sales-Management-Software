<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Đặt lại mật khẩu - Sales Management Software</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <h1 class="h3 mb-2">
                            Đặt lại mật khẩu
                        </h1>

                        <p class="text-muted mb-0">
                            Nhập mật khẩu mới cho tài khoản của bạn.
                        </p>
                    </div>

                    <div th:if="${errorMessage}"
                         class="alert alert-danger"
                         role="alert">
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/auth/reset-password}"
                          th:object="${resetPasswordForm}"
                          method="post"
                          novalidate>

                        <div th:if="${#fields.hasGlobalErrors()}"
                             class="alert alert-danger"
                             role="alert">

                            <div th:each="error : ${#fields.globalErrors()}"
                                 th:text="${error}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="newPassword"
                                   class="form-label">
                                Mật khẩu mới
                                <span class="text-danger">*</span>
                            </label>

                            <input type="password"
                                   id="newPassword"
                                   th:field="*{newPassword}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('newPassword')}
                                       ? 'is-invalid' : ''"
                                   placeholder="Nhập mật khẩu mới"
                                   minlength="8"
                                   maxlength="72"
                                   autocomplete="new-password"
                                   autofocus>

                            <div class="form-text">
                                Mật khẩu phải có từ 8 đến 72 ký tự.
                            </div>

                            <div th:if="${#fields.hasErrors('newPassword')}"
                                 th:errors="*{newPassword}"
                                 class="invalid-feedback">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword"
                                   class="form-label">
                                Xác nhận mật khẩu
                                <span class="text-danger">*</span>
                            </label>

                            <input type="password"
                                   id="confirmPassword"
                                   th:field="*{confirmPassword}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('confirmPassword')}
                                       ? 'is-invalid' : ''"
                                   placeholder="Nhập lại mật khẩu mới"
                                   minlength="8"
                                   maxlength="72"
                                   autocomplete="new-password">

                            <div th:if="${#fields.hasErrors('confirmPassword')}"
                                 th:errors="*{confirmPassword}"
                                 class="invalid-feedback">
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit"
                                    class="btn btn-primary">
                                Đổi mật khẩu
                            </button>
                        </div>

                        <div class="text-center">
                            <a th:href="@{/auth/login}"
                               class="text-decoration-none">
                                Quay lại đăng nhập
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
