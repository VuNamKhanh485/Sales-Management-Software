<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quên mật khẩu - Sales Management Software</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <h1 class="h3 mb-2">
                            Quên mật khẩu
                        </h1>

                        <p class="text-muted mb-0">
                            Nhập email tài khoản để nhận mã OTP đặt lại mật khẩu.
                        </p>
                    </div>

                    <!-- Flash message nằm ngoài form được -->
                    <div th:if="${errorMessage}"
                         class="alert alert-danger"
                         role="alert">
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/auth/forgot-password}"
                          th:object="${forgotPasswordForm}"
                          method="post"
                          novalidate>

                        <!-- Global error phải nằm trong form có th:object -->
                        <div th:if="${#fields.hasGlobalErrors()}"
                             class="alert alert-danger"
                             role="alert">

                            <div th:each="error : ${#fields.globalErrors()}"
                                 th:text="${error}">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="email"
                                   class="form-label">
                                Email
                                <span class="text-danger">*</span>
                            </label>

                            <input type="email"
                                   id="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('email')}
                                       ? 'is-invalid' : ''"
                                   placeholder="Nhập email tài khoản"
                                   autocomplete="email"
                                   maxlength="255"
                                   autofocus>

                            <div th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"
                                 class="invalid-feedback">
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit"
                                    class="btn btn-primary">
                                Gửi mã OTP
                            </button>
                        </div>

                        <div class="text-center">
                            <a th:href="@{/auth/login}"
                               class="text-decoration-none">
                                Quay lại đăng nhập
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
