<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ quỹ — SMS</title>
    <link rel="stylesheet" th:href="@{/css/core/apple-design.css}">
    <link rel="stylesheet" th:href="@{/css/payment/cashbook.css}">
</head>
<body>

    <div th:replace="~{component/navbar :: global-nav('cashbook')}"></div>

    <div class="sub-nav">
        <h1 class="sub-nav__title">Sổ quỹ</h1>
        <div class="sub-nav__actions">
            <a href="#" onclick="exportExcel()" class="btn btn-secondary btn-secondary--sm">Xuất Excel</a>
            <a th:href="@{/cashbook/create}" class="btn btn-primary btn-primary--sm">Tạo phiếu thu/chi</a>
        </div>
    </div>

    <main class="page-content">
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-card__label">Tồn quỹ tiền mặt</div>
                <div class="stat-card__value value-cash" th:text="${#numbers.formatDecimal(cashBalance, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</div>
            </div>
            <div class="stat-card">
                <div class="stat-card__label">Tồn quỹ ngân hàng</div>
                <div class="stat-card__value value-bank" th:text="${#numbers.formatDecimal(bankBalance, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</div>
            </div>
        </div>

        <div class="card-panel">
            <form action="/cashbook" method="get" class="search-bar">
                <select name="branchId" class="filter-select" onchange="this.form.submit()">
                    <option value="">Tất cả chi nhánh</option>
                    <option th:each="b : ${branches}" th:value="${b.id}" th:text="${b.name}" th:selected="${b.id == selectedBranchId}"></option>
                </select>
                <select name="type" class="filter-select" onchange="this.form.submit()">
                    <option value="">Loại phiếu (Tất cả)</option>
                    <option value="IN" th:selected="${selectedType == 'IN'}">Phiếu Thu</option>
                    <option value="OUT" th:selected="${selectedType == 'OUT'}">Phiếu Chi</option>
                </select>
                <select name="method" class="filter-select" onchange="this.form.submit()">
                    <option value="">Phương thức (Tất cả)</option>
                    <option value="CASH" th:selected="${selectedMethod == 'CASH'}">Tiền mặt</option>
                    <option value="BANK" th:selected="${selectedMethod == 'BANK'}">Chuyển khoản</option>
                </select>
            </form>

            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Mã phiếu</th>
                            <th>Ngày tạo</th>
                            <th>Chi nhánh</th>
                            <th>Loại phiếu</th>
                            <th>Phương thức</th>
                            <th>Giá trị</th>
                            <th>Ghi chú</th>
                            <th>Người tạo</th>
                            <th>Trạng thái</th>
                            <th style="text-align: right; padding-right: 24px;">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${transactionPage.totalElements == 0}">
                            <td colspan="10">
                                <div class="empty-state">
                                    <h3 class="empty-state__title">Không có giao dịch</h3>
                                </div>
                            </td>
                        </tr>
                        <tr th:each="t : ${transactionPage.content}">
                            <td><span class="code-chip" th:text="${t.referenceCode != null ? t.referenceCode : 'CB-' + t.id}"></span></td>
                            <td th:text="${#temporals.format(t.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${t.branch.name}"></td>
                            <td>
                                <span class="badge" th:classappend="${t.transactionType == 'IN'} ? 'badge-active' : 'badge-inactive'" th:text="${t.transactionType == 'IN' ? 'Thu' : 'Chi'}"></span>
                            </td>
                            <td th:text="${t.paymentMethod == 'CASH' ? 'Tiền mặt' : 'Chuyển khoản'}"></td>
                            <td class="amount-cell" th:text="${#numbers.formatDecimal(t.amount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td th:text="${t.description}"></td>
                            <td th:text="${t.creator != null ? t.creator.fullName : ''}"></td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${t.status == 'COMPLETED'} ? 'badge-active' : (${t.status == 'REJECTED'} ? 'badge-inactive' : 'badge-warning')" 
                                      th:text="${t.status == 'COMPLETED' ? 'Đã duyệt' : (t.status == 'REJECTED' ? 'Từ chối' : 'Chờ duyệt')}"
                                      th:style="${t.status == 'PENDING'} ? 'background-color: #fef08a; color: #854d0e;' : ''"></span>
                            </td>
                            <td style="text-align: right; padding-right: 24px;">
                                <div style="display: flex; gap: 4px; justify-content: flex-end;">
                                    <a th:href="@{'/cashbook/' + ${t.id}}" class="btn-secondary btn-secondary--sm" style="white-space: nowrap;">Chi tiết</a>
                                    <div th:if="${isOwner and t.status == 'PENDING'}" style="display: flex; gap: 4px;">
                                        <form th:action="@{'/cashbook/' + ${t.id} + '/approve'}" method="post" style="display: inline;" onsubmit="event.preventDefault(); showConfirmModal('Bạn có chắc chắn duyệt phiếu này?', this, 'Duyệt phiếu');">
                                            <button type="submit" class="btn btn-primary btn-primary--sm">Duyệt</button>
                                        </form>
                                        <form th:action="@{'/cashbook/' + ${t.id} + '/reject'}" method="post" style="display: inline;" onsubmit="event.preventDefault(); showConfirmModal('Bạn có chắc chắn từ chối phiếu này?', this, 'Từ chối phiếu');">
                                            <button type="submit" class="btn btn-secondary btn-secondary--sm" style="color: #ef4444; border-color: #fca5a5;">Từ chối</button>
                                        </form>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div th:if="${transactionPage.totalPages > 1}" class="pagination-bar">
                <nav>
                    <ul class="pagination">
                        <li th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${i == currentPage} ? 'active'">
                            <a th:href="@{/cashbook(page=${i}, branchId=${selectedBranchId}, type=${selectedType}, method=${selectedMethod})}" th:text="${i}"></a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>

    <!-- Custom Confirm Modal -->
    <div id="customConfirmModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(4px);">
        <div style="background: var(--canvas, #ffffff); padding: 24px; border-radius: var(--r-lg, 16px); max-width: 400px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
            <h3 id="customConfirmTitle" style="margin-top: 0; font-size: 18px; font-weight: 600; color: var(--ink, #111827);">Xác nhận</h3>
            <p id="customConfirmMessage" style="color: var(--ink-muted, #4b5563); font-size: 15px; margin-bottom: 24px; line-height: 1.5;">Bạn có chắc chắn?</p>
            <div style="display: flex; justify-content: flex-end; gap: 12px;">
                <button type="button" class="btn btn-secondary" onclick="closeConfirmModal()" style="border-radius: var(--r-md, 8px); padding: 8px 16px; font-weight: 500;">Hủy</button>
                <button type="button" id="customConfirmBtn" class="btn btn-primary" style="border-radius: var(--r-md, 8px); padding: 8px 16px; font-weight: 500;">Đồng ý</button>
            </div>
        </div>
    </div>

    <script>
        let formToSubmit = null;
        function showConfirmModal(message, formElement, title = 'Xác nhận') {
            document.getElementById('customConfirmTitle').innerText = title;
            document.getElementById('customConfirmMessage').innerText = message;
            document.getElementById('customConfirmModal').style.display = 'flex';
            formToSubmit = formElement;
        }
        function closeConfirmModal() {
            document.getElementById('customConfirmModal').style.display = 'none';
            formToSubmit = null;
        }
        document.getElementById('customConfirmBtn').addEventListener('click', function() {
            if (formToSubmit) {
                formToSubmit.submit();
            }
        });
    </script>
    <script th:src="@{/js/payment/cashbook-list.js}"></script>
</body>
</html>
