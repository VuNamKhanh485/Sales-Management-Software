<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <title>Danh sách Thương hiệu</title>
</head>
<body>

<h2>Danh sách Thương hiệu</h2>

<a th:href="@{/brand/form/{id}(id=0)}">+ Thêm thương hiệu</a>

<br/><br/>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>#</th>
        <th>Tên thương hiệu</th>
        <th>Trạng thái</th>
        <th>Thao tác</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(brand)}">
        <td colspan="4">Chưa có thương hiệu nào.</td>
    </tr>
    <tr th:each="b, stat : ${brand}">
        <td th:text="${stat.index + 1}"></td>
        <td th:text="${b.name}"></td>
        <td th:text="${b.status}"></td>
        <td>
            <a th:href="@{/brand/form/{id}(id=${b.id})}">Sửa</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
