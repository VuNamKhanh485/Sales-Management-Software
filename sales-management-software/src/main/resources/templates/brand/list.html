<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <title>Danh sách Thương hiệu</title>
</head>
<body>

<h2>Danh sách Thương hiệu</h2>

<form th:action="@{/brand}" method="get">
    <input type="text" name="keyword" placeholder="Nhập tên thương hiệu..." th:value="${keyword}">

    <button type="submit">Tìm kiếm</button>
</form>

<a th:href="@{/brand/form/{id}(id=0)}">+ Thêm thương hiệu</a>

<br/><br/>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>#</th>

        <th>
            <a th:href="@{/brand(
                keyword=${keyword},
                page=${currentPage},
                size=${size},
                sortField='name',
                sortDir=${reverseSortDir})}"></a>
            Tên thương hiệu</th>
        <th>Trạng thái</th>
        <th>Thao tác</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${brandPage.content.isEmpty()}">
        <td colspan="4">Chưa có thương hiệu nào.</td>
    </tr>
    <tr th:each="b, stat : ${brandPage.content}">
        <td th:text="${currentPage * size + stat.index + 1}"></td>
        <td th:text="${b.name}"></td>
        <td th:text="${b.status}"></td>
        <td>
            <a th:href="@{/brand/form/{id}(id=${b.id})}">Sửa</a>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${brandPagr.totalPages > 1}">
    <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">

        <a th:if="${i != currentPage}"
           th:href="@{/brand(
                keyword=${keyword},
                page=${i},
                size=${size},
                sortField=${sortField},
                sortDir=${sortDir})}"
           th:text="${i + 1}">
        </a>

        <span th:if="${i == currentPage}"
              th:text="${i + 1}">
        </span>

        &nbsp;
    </span>
</div>

</body>
</html>
