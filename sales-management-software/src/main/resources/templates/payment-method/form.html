<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Sửa Phương thức Thanh toán' : 'Thêm Phương thức Thanh toán'"></title>
    <style>
        :root {
            --apple-blue: #0071e3;
            --apple-blue-hover: #0077ed;
            --apple-bg: #f5f5f7;
            --apple-card: #ffffff;
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --border-color: #d2d2d7;
            --danger-color: #ff3b30;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--apple-bg);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .form-container {
            width: 100%;
            max-width: 520px;
            background: var(--apple-card);
            padding: 36px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }
        h4 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 24px 0;
            letter-spacing: -0.5px;
        }
        .alert-danger {
            background-color: #fff2f1;
            color: var(--danger-color);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 500;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 6px;
        }
        input, select {
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            background-color: #fff;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus, select:focus {
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.12);
        }
        input.is-invalid {
            border-color: var(--danger-color);
        }
        input.is-invalid:focus {
            box-shadow: 0 0 0 4px rgba(255, 59, 48, 0.12);
        }
        .invalid-feedback {
            color: var(--danger-color);
            font-size: 12px;
            margin-top: 5px;
        }
        small {
            color: var(--text-sub);
            font-size: 12px;
            margin-top: 4px;
        }
        .action-bar {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f2;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-submit {
            background-color: var(--apple-blue);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: var(--apple-blue-hover);
        }
        .btn-cancel {
            background-color: #e8e8ed;
            color: var(--text-main);
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn-cancel:hover {
            background-color: #d2d2d7;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h4 th:text="${isEdit} ? 'Sửa Phương thức Thanh toán' : 'Thêm Phương thức Thanh toán'"></h4>

    <div th:if="${errorMessage}" class="alert-danger" th:text="${errorMessage}"></div>

    <form th:action="${isEdit} ? @{/payment-methods/edit/{id}(id=${paymentMethodId})} : @{/payment-methods/create}"
          th:object="${request}" method="post">

        <div class="form-group">
            <label>Mã phương thức *</label>
            <input type="text" th:field="*{code}"
                   th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                   placeholder="VD: CASH, BANK_TRANSFER, MOMO">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
            <small>Mã sẽ được tự động chuyển thành chữ HOA</small>
        </div>

        <div class="form-group">
            <label>Tên phương thức *</label>
            <input type="text" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                   placeholder="VD: Tiền mặt, Chuyển khoản, Ví MoMo">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="form-group">
            <label>Trạng thái</label>
            <select th:field="*{status}">
                <option value="ACTIVE">Hoạt động</option>
                <option value="INACTIVE">Ngừng hoạt động</option>
            </select>
        </div>

        <div class="action-bar">
            <button type="submit" class="btn-submit" th:text="${isEdit} ? 'Cập nhật' : 'Thêm mới'"></button>
            <a href="/payment-methods" class="btn-cancel">Hủy</a>
        </div>
    </form>
</div>
</body>
</html>
