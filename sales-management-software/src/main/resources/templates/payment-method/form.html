<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Sửa Phương thức Thanh toán' : 'Thêm Phương thức Thanh toán'"></title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 600px">

    <h4 class="fw-bold mb-4"
        th:text="${isEdit} ? '✏️ Sửa Phương thức Thanh toán' : '➕ Thêm Phương thức Thanh toán'">
    </h4>

    <!-- Error message -->
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="${isEdit}
                        ? @{/payment-methods/edit/{id}(id=${paymentMethodId})}
                        : @{/payment-methods/create}"
                  th:object="${request}" method="post">

                <div class="row g-3">

                    <!-- Mã -->
                    <div class="col-12">
                        <label class="form-label fw-semibold">Mã phương thức *</label>
                        <input type="text" th:field="*{code}" class="form-control"
                               th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                               placeholder="VD: CASH, BANK_TRANSFER, MOMO">
                        <div class="invalid-feedback" th:errors="*{code}"></div>
                        <small class="text-muted">Mã sẽ được tự động chuyển thành chữ HOA</small>
                    </div>

                    <!-- Tên -->
                    <div class="col-12">
                        <label class="form-label fw-semibold">Tên phương thức *</label>
                        <input type="text" th:field="*{name}" class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               placeholder="VD: Tiền mặt, Chuyển khoản, Ví MoMo">
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>

                    <!-- Trạng thái -->
                    <div class="col-12">
                        <label class="form-label fw-semibold">Trạng thái</label>
                        <select th:field="*{status}" class="form-select">
                            <option value="ACTIVE">Hoạt động</option>
                            <option value="INACTIVE">Ngừng hoạt động</option>
                        </select>
                    </div>

                </div>

                <hr class="my-4">
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"
                            th:text="${isEdit} ? 'Cập nhật' : 'Thêm mới'">
                    </button>
                    <a href="/payment-methods" class="btn btn-outline-secondary">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
