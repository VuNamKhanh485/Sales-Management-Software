<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Phương thức Thanh toán</title>
    <style>
        :root {
            --apple-blue: #0071e3;
            --apple-blue-hover: #0077ed;
            --apple-bg: #f5f5f7;
            --apple-card: #ffffff;
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --border-color: #d2d2d7;
            --success-color: #34c759;
            --danger-color: #ff3b30;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--apple-bg);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--apple-card);
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }
        h3 {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .btn-add {
            background-color: var(--apple-blue);
            color: white;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn-add:hover {
            background-color: var(--apple-blue-hover);
        }
        .alert-success {
            background-color: #eafaf1;
            color: var(--success-color);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-close {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 16px;
        }
        .search-form {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-form input, .search-form select {
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            background: #fafafa;
            outline: none;
            transition: all 0.2s;
            min-width: 220px;
        }
        .search-form input:focus, .search-form select:focus {
            border-color: var(--apple-blue);
            background: #fff;
        }
        .btn-search {
            background-color: #e8e8ed;
            color: var(--text-main);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-search:hover {
            background-color: #d2d2d7;
        }
        .btn-clear {
            color: var(--danger-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .btn-clear:hover {
            text-decoration: underline;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            text-align: left;
        }
        th {
            background-color: #f5f5f7;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }
        td {
            padding: 16px;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f2;
            color: #1d1d1f;
        }
        tr:hover td {
            background-color: #fafafa;
        }
        .code-badge {
            background-color: #e8e8ed;
            color: var(--text-main);
            padding: 3px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-active {
            background-color: #e6f7ed;
            color: var(--success-color);
        }
        .badge-inactive {
            background-color: #fdf2f2;
            color: var(--danger-color);
        }
        .actions a {
            color: var(--apple-blue);
            text-decoration: none;
            font-weight: 500;
            margin-right: 16px;
            font-size: 14px;
        }
        .actions a.delete {
            color: var(--danger-color);
        }
        .actions a:hover {
            text-decoration: underline;
        }
        .empty-row {
            text-align: center;
            color: var(--text-sub);
            padding: 40px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-section">
        <h3>Phương thức Thanh toán</h3>
        <a href="/payment-methods/create" class="btn-add">+ Thêm mới</a>
    </div>

    <div th:if="${successMessage}" class="alert-success">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" onclick="this.parentElement.style.display='none'">×</button>
    </div>

    <form method="get" action="/payment-methods" class="search-form">
        <input type="text" name="keyword" placeholder="Tìm theo mã hoặc tên..." th:value="${keyword}">

        <select name="status">
            <option value="">-- Tất cả trạng thái --</option>
            <option value="ACTIVE" th:selected="${selectedStatus == 'ACTIVE'}">Đang hoạt động</option>
            <option value="INACTIVE" th:selected="${selectedStatus == 'INACTIVE'}">Ngừng hoạt động</option>
        </select>

        <button type="submit" class="btn-search">Tìm kiếm</button>
        <a href="/payment-methods" class="btn-clear">Xóa lọc</a>
    </form>

    <table>
        <thead>
        <tr>
            <th style="width: 60px;">#</th>
            <th style="width: 150px;">Mã</th>
            <th>Tên phương thức</th>
            <th style="width: 160px;">Trạng thái</th>
            <th style="width: 180px;">Ngày tạo</th>
            <th style="width: 130px;">Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pm, stat : ${paymentMethods}">
            <td th:text="${stat.count}"></td>
            <td><span class="code-badge" th:text="${pm.code}"></span></td>
            <td th:text="${pm.name}" style="font-weight: 500;"></td>
            <td>
                <span th:class="${pm.status.name() == 'ACTIVE' ? 'badge badge-active' : 'badge badge-inactive'}"
                      th:text="${pm.status.name() == 'ACTIVE' ? 'Hoạt động' : 'Ngừng'}"></span>
            </td>
            <td th:text="${#temporals.format(pm.createdAt, 'dd/MM/yyyy HH:mm')}" style="color: var(--text-sub); font-size: 13px;"></td>
            <td class="actions">
                <a th:href="@{/payment-methods/edit/{id}(id=${pm.id})}">Sửa</a>
                <a th:href="@{/payment-methods/delete/{id}(id=${pm.id})}" class="delete">Xóa</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(paymentMethods)}">
            <td colspan="6" class="empty-row">Không có phương thức thanh toán nào</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
