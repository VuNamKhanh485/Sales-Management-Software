<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác nhận xóa</title>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-card: #ffffff;
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --danger-color: #ff3b30;
            --danger-hover: #e03126;
            --btn-gray: #e8e8ed;
            --btn-gray-hover: #d2d2d7;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--apple-bg);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .dialog-container {
            width: 100%;
            max-width: 400px;
            background: var(--apple-card);
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .icon {
            font-size: 40px;
            margin-bottom: 16px;
            color: var(--danger-color);
        }
        h5 {
            font-size: 19px;
            font-weight: 600;
            margin: 0 0 10px 0;
            letter-spacing: -0.4px;
        }
        p {
            font-size: 14px;
            color: #48484a;
            line-height: 1.45;
            margin: 0 0 24px 0;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-direction: row-reverse; /* Đưa nút xác nhận sang phải đúng chuẩn Apple UI */
        }
        .btn-delete {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            flex: 1;
        }
        .btn-delete:hover {
            background-color: var(--danger-hover);
        }
        .btn-cancel {
            background-color: var(--btn-gray);
            color: var(--text-main);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
            flex: 1;
            box-sizing: border-box;
            display: inline-block;
        }
        .btn-cancel:hover {
            background-color: var(--btn-gray-hover);
        }
    </style>
</head>
<body>
<div class="dialog-container">
    <div class="icon">⚠️</div>
    <h5>Xác nhận xóa phương thức</h5>
    <p>
        Bạn có chắc muốn xóa phương thức
        <strong th:text="${paymentMethod.name}"></strong>
        (<span th:text="${paymentMethod.code}"></span>) không?
        <br><span style="color: var(--danger-color); font-size: 13px; margin-top: 4px; display: inline-block;">Hành động này không thể hoàn tác.</span>
    </p>
    <div class="action-buttons">
        <form th:action="@{/payment-methods/delete/{id}(id=${paymentMethod.id})}" method="post" style="flex: 1;">
            <button type="submit" class="btn-delete">Xác nhận xóa</button>
        </form>
        <a href="/payment-methods" class="btn-cancel">Hủy</a>
    </div>
</div>
</body>
</html>
