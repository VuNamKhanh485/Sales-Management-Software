<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác nhận xóa</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 500px">
    <div class="card shadow border-danger">
        <div class="card-body text-center p-4">
            <div class="mb-3" style="font-size: 3rem">🗑️</div>
            <h5 class="fw-bold">Xác nhận xóa phương thức thanh toán</h5>
            <p class="text-muted">
                Bạn có chắc muốn xóa phương thức
                <strong th:text="${paymentMethod.name}"></strong>
                (<span th:text="${paymentMethod.code}"></span>) không?
                <br>Hành động này không thể hoàn tác.
            </p>
            <div class="d-flex justify-content-center gap-3 mt-3">
                <form th:action="@{/payment-methods/delete/{id}(id=${paymentMethod.id})}"
                      method="post">
                    <button type="submit" class="btn btn-danger">Xác nhận xóa</button>
                </form>
                <a href="/payment-methods" class="btn btn-outline-secondary">Hủy</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
